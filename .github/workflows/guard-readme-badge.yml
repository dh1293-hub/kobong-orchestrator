# ============================================================
# Guard: README 릴리즈 배지 링크 포맷 검증
# 목적:
#   - README.md 안의 "releases/tag/vX.Y.Z" 배지 링크가
#     *정상 포맷*인지 확인하고,
#     "v0\.1\.11"처럼 점(.) 앞에 백슬래시를 넣은 *잘못된* 패턴을 차단.
# 트리거:
#   - README 또는 워크플로/스크립트가 바뀔 때만 실행(경로 필터)
# 보안/가드:
#   - 최소 권한(contents: read)
#   - 동시성 취소 / 3분 타임아웃 / 얕은 체크아웃
# 참고:
#   - YAML 파서 오류 방지: 모든 스크립트는 run: | 블록, 탭 금지(스페이스만)
# ============================================================
name: guard/readme-badge

on:
  pull_request:
    paths:
      - README.md
      - .github/workflows/**
      - scripts/g5/**
      - .github/workflows/guard-readme-badge.yml
  push:
    branches: [ main ]
    paths:
      - README.md
      - .github/workflows/**
      - scripts/g5/**
      - .github/workflows/guard-readme-badge.yml

permissions:
  contents: read

concurrency:
  group: guard-readme-badge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ⛔ README 배지에서 "v0\.1\.11"처럼 '버전 내부의 점'에 백슬래시를 넣은 잘못된 링크 감지
      #   올바른 예: .../releases/tag/v0.1.11
      #   잘못된 예: .../releases/tag/v0\.1\.11 (← 이 패턴을 *금지*)
      - name: Fail if version dots are escaped inside the link (e.g. v0\.1\.11)
        shell: bash
        run: |
          set -euo pipefail
          if grep -qE 'releases/tag/v[0-9]+\\\.[0-9]+\\\.[0-9]+' README.md; then
            echo "::error::Escaped version (e.g. v0\\.1\\.11) found in README badge link."
            exit 1
          fi

      # ✅ 정상 링크가 반드시 하나 이상 있어야 함 (vX.Y.Z 형태)
      - name: Ensure a clean version link exists (vX.Y.Z)
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -qE 'releases/tag/v[0-9]+\.[0-9]+\.[0-9]+' README.md; then
            echo "::error::No clean release tag link (vX.Y.Z) found in README."
            exit 1
          fi
