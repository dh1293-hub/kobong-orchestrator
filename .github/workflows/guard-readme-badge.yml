# ============================================================
# Guard: README 배지(Shields/Actions 등) 존재·유효성 검증 — 안정 단순판
# 목적:
#   - README.md 안의 필수 배지(예: CI, License)가 존재하는지 점검
#   - (선택) 수동 실행 시에만 배지 URL의 HTTP 응답(HEAD) 확인
# 설정:
#   - .config/readme-badges.json 있으면 그 규칙 사용, 없으면 안전 기본값 사용
# 트리거:
#   - PR / main 푸시 (README 또는 설정이 바뀔 때만 실행: 경로 필터)
# 보안/가드:
#   - 최소 권한(contents: read), 동시성 취소, 타임아웃 5분
# YAML 안전:
#   - 모든 스크립트는 run: | 블록, 탭 금지(스페이스만), 한 줄 한 명령
# ============================================================
name: guard/readme-badge

on:
  pull_request:
    paths:
      - 'README.md'
      - '.config/readme-badges.json'
      - '.github/workflows/guard-readme-badge.yml'
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - '.config/readme-badges.json'
      - '.github/workflows/guard-readme-badge.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "위반 시 동작"
        type: choice
        options: [enforce, report]
        default: enforce
      verify_http:
        description: "배지 URL의 HTTP(HEAD) 응답 확인(느릴 수 있음)"
        type: choice
        options: [true, false]
        default: false

permissions:
  contents: read

concurrency:
  group: guard-readme-badge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 1) 설정 로드(없으면 기본값), README 존재 확인
      - name: Load config & ensure README
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _tmp _inventory/readme-badge
          if [ ! -f README.md ]; then
            echo "::error::README.md not found"
            exit 1
          fi

          # 기본 규칙(JSON) 작성
          cat > _tmp/default_config.json <<'JSON'
          {
            "_comment": "없으면 사용하는 안전 기본값",
            "required": [
              { "alt_match": "ci",      "url_match": "actions/workflows/ci.yml/badge.svg" },
              { "alt_match": "license", "url_match": "img.shields.io/github/license" }
            ],
            "optional": [
              { "alt_match": "release", "url_match": "img.shields.io/github/v/release" }
            ],
            "verify_http": false
          }
          JSON

          # 실제 사용할 설정 경로 결정
          CFG="_tmp/default_config.json"
          if [ -f ".config/readme-badges.json" ]; then
            CFG=".config/readme-badges.json"
          fi

          echo "cfg=${CFG}" >> "$GITHUB_OUTPUT"

      # 2) 규칙에 따라 배지 문자열 존재 검사(README 안에서 고정문자 검색)
      - name: Validate badges (presence)
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          CFG="${{ steps.cfg.outputs.cfg }}"

          # jq 필수(ubuntu-latest 기본 탑재). 없으면 빠르게 실패 로그.
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq not found on runner"
            exit 1
          fi

          # README를 한 번만 소문자로 캐싱
          lower="$(tr '[:upper:]' '[:lower:]' < README.md)"

          # required rules
          missing=0
          req_total=$(jq -r '.required | length' "$CFG")
          if [ "$req_total" = "null" ] || [ -z "$req_total" ]; then req_total=0; fi

          if [ "$req_total" -gt 0 ]; then
            i=0
            while [ "$i" -lt "$req_total" ]; do
              alt=$(jq -r ".required[$i].alt_match // empty" "$CFG")
              url=$(jq -r ".required[$i].url_match // empty" "$CFG")
              ok=0
              if [ -n "$alt" ]; then
                needle="$(printf '%s' "$alt" | tr '[:upper:]' '[:lower:]')"
                echo "$lower" | grep -Fqi "$needle" && ok=1 || true
              fi
              if [ "$ok" -eq 0 ] && [ -n "$url" ]; then
                needle="$(printf '%s' "$url" | tr '[:upper:]' '[:lower:]')"
                echo "$lower" | grep -Fqi "$needle" && ok=1 || true
              fi
              if [ "$ok" -eq 0 ]; then
                echo "::error::missing required badge: alt_match='$alt' url_match='$url'"
                missing=$((missing+1))
              fi
              i=$((i+1))
            done
          fi

          echo "missing_cnt=$missing" >> "$GITHUB_OUTPUT"

      # 3) (선택) 수동 실행일 때만 HTTP 링크 HEAD 검사
      - name: Optional HTTP checks (HEAD)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.verify_http == 'true' }}
        id: http
        shell: bash
        run: |
          set -euo pipefail
          CFG="${{ steps.cfg.outputs.cfg }}"

          # README의 배지 링크(URL들) 추출(간단 패턴)
          mapfile -t urls < <(grep -oE '!\[[^]]*\]\([^) "]+(\s+"[^"]*")?\)' README.md | sed -E 's@^!\[[^]]*\]\(([^) "]+).*@\1@')

          # required+optional 규칙 중 URL 매칭 대상만 HEAD 체크 (중복 제거)
          declare -A seen=()
          declare -a heads=()

          total=$(jq -r '.required | length' "$CFG"); [ "$total" = "null" ] && total=0
          i=0
          while [ "$i" -lt "$total" ]; do
            u=$(jq -r ".required[$i].url_match // empty" "$CFG")
            [ -n "$u" ] && heads+=("$u")
            i=$((i+1))
          done
          total2=$(jq -r '.optional | length' "$CFG"); [ "$total2" = "null" ] && total2=0
          j=0
          while [ "$j" -lt "$total2" ]; do
            u=$(jq -r ".optional[$j].url_match // empty" "$CFG")
            [ -n "$u" ] && heads+=("$u")
            j=$((j+1))
          done

          bad=0
          echo "::group::HTTP HEAD check"
          for want in "${heads[@]}"; do
            # README 안의 실제 URL들 중 'want' 부분문자열을 포함하는 것을 찾아 검사
            for u in "${urls[@]}"; do
              if printf '%s' "$u" | grep -Fq "$want"; then
                key="$u"
                if [ -z "${seen[$key]+x}" ]; then
                  seen[$key]=1
                  code="$(curl -fsSLI -o /dev/null -w '%{http_code}' --max-time 5 "$u" || true)"
                  if [ -z "$code" ] || [ "$code" -ge 400 ]; then
                    echo "::error::dead badge url: $u (code=${code:-NA})"
                    bad=$((bad+1))
                  else
                    echo "OK $u ($code)"
                  fi
                fi
              fi
            done
          done
          echo "::endgroup::"
          echo "dead_cnt=$bad" >> "$GITHUB_OUTPUT"

      # 4) 요약 저장 + 아티팩트 업로드
      - name: Save summary & upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-badge-${{ github.run_id }}
          path: |
            README.md
            .config/readme-badges.json
          if-no-files-found: warn

      # 5) Enforce / Report
      - name: Enforce or report
        shell: bash
        run: |
          set -euo pipefail
          # defaults
          MODE="enforce"
          DEAD=0
          # dispatch 입력 반영
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
            if [ "${{ github.event.inputs.verify_http }}" = "true" ]; then
              DEAD="${{ steps.http.outputs.dead_cnt || '0' }}"
            fi
          fi
          MISS="${{ steps.validate.outputs.missing_cnt || '0' }}"

          # 처리
          if [ "$MODE" = "report" ]; then
            if [ "$MISS" -gt 0 ] || [ "$DEAD" -gt 0 ]; then
              echo "::warning::README badge issues — missing=$MISS, dead=$DEAD (report mode: not failing)."
              exit 0
            else
              echo "README badge OK (report mode)."
              exit 0
            fi
          else
            if [ "$MISS" -gt 0 ] || [ "$DEAD" -gt 0 ]; then
              echo "::error::README badge failed — missing=$MISS, dead=$DEAD"
              exit 1
            else
              echo "✅ README badge OK (enforce)."
              exit 0
            fi
          fi
