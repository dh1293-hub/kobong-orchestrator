name: Release Docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to update (optional)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-docs
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      DOCS_SENTINEL: "<!-- __G5_SENTINEL:RELEASE_DOCS_v1 -->"
    steps:
      - name: Idempotency guard (skip if docs already marked)
        id: guard
        env:
          TAG_FROM_EVENT: ${{ github.event.release.tag_name }}
          TAG_INPUT: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # 1) 태그 결정 (이벤트→입력→최신 릴리즈→최근 태그)
          tag="${TAG_FROM_EVENT:-}"
          if [ -z "$tag" ] && [ -n "${TAG_INPUT:-}" ]; then tag="$TAG_INPUT"; fi
          if [ -z "$tag" ]; then
            tag="$(gh api -H 'X-GitHub-Api-Version:2022-11-28' \
                   "repos/${REPO}/releases/latest" -q .tag_name 2>/dev/null || true)"
          fi
          if [ -z "$tag" ]; then
            tag="$(gh api -H 'X-GitHub-Api-Version:2022-11-28' \
                   "repos/${REPO}/tags?per_page=1" -q '.[0].name' 2>/dev/null || true)"
          fi
          if [ -z "$tag" ]; then
            echo "::error::no release/tag detected; pass an input 'tag' or publish a release."; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # 2) 릴리즈 존재 + 본문 확인
          if ! gh release view -R "$REPO" "$tag" >/dev/null 2>&1; then
            echo "::error::release '$tag' not found in $REPO"; exit 1
          fi
          body="$(gh release view -R "$REPO" "$tag" --json body -q .body || echo '')"

          # 3) 이미 마크되어 있으면 Skip
          if echo "$body" | grep -q "$DOCS_SENTINEL"; then
            echo "skip=true"  >> "$GITHUB_OUTPUT"
            printf "### Docs publish\n- Tag: \`%s\`\n- Result: **SKIP** (sentinel exists)\n" "$tag" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # ↓ 실제 문서 빌드/업로드가 필요하면 이 스텝에 넣으세요.
      - name: (Optional) Build & attach docs
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          echo "Your docs build & upload steps go here."

      - name: Mark release notes with docs sentinel
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.guard.outputs.tag }}"
          {
            echo ""
            echo "## Docs"
            echo "- published: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "${DOCS_SENTINEL}"
          } >> docs-release-append.md
          gh release edit -R "$REPO" "$tag" --notes-file docs-release-append.md

      - name: Summary
        shell: bash
        run: |
          tag="${{ steps.guard.outputs.tag }}"
          if [ "${{ steps.guard.outputs.skip }}" = "true" ]; then
            printf "### Docs publish\n- Tag: \`%s\`\n- Result: **SKIP**\n" "$tag" >> "$GITHUB_STEP_SUMMARY"
          else
            printf "### Docs publish\n- Tag: \`%s\`\n- Result: **PASS** (published)\n" "$tag" >> "$GITHUB_STEP_SUMMARY"
          fi
