--- a/.github/workflows/release-docs.yml
+++ b/.github/workflows/release-docs.yml
@@
   jobs:
-    docs:
+    docs:
       runs-on: ubuntu-latest
       permissions:
         contents: write
       steps:
+        # [G5] Idempotency guard (release body sentinel for docs)
+        - name: Guard · skip if docs already published
+          id: guard
+          env:
+            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
+            DOCS_SENTINEL: "<!-- __G5_SENTINEL:RELEASE_DOCS_v1 -->"
+          shell: bash
+          run: |
+            set -euo pipefail
+            tag="${{ inputs.tag || '' }}"
+            if [ -z "${tag}" ]; then tag="${GITHUB_REF_NAME:-}"; fi
+            if [ -z "${tag}" ]; then tag="$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)"; fi
+            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
+            body="$(gh release view "${tag}" --json body -q .body || echo '')"
+            if echo "${body}" | grep -q "${DOCS_SENTINEL}"; then
+              echo "skip=true"  >> "$GITHUB_OUTPUT"
+              echo "### Docs publish\n- Tag: \`${tag}\`\n- Result: **SKIP** (sentinel exists)" >> "$GITHUB_STEP_SUMMARY"
+              exit 0
+            fi
+            echo "skip=false" >> "$GITHUB_OUTPUT"
+
         # (기존) 빌드/패키징/업로드 스텝들 …
 
-        - name: Mark release with docs info
+        - name: Mark release with docs info
+          if: steps.guard.outputs.skip != 'true'
           env:
             GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           shell: bash
           run: |
             set -euo pipefail
-            tag="${{ inputs.tag }}"
+            tag="${{ steps.guard.outputs.tag }}"
             {
               echo ""
               echo "## Docs"
               echo "- published: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
+              echo "${DOCS_SENTINEL}"
             } >> docs-release-append.md
             gh release edit "${tag}" --notes-file docs-release-append.md
 
+        - name: Summary (Job)
+          shell: bash
+          run: |
+            tag="${{ steps.guard.outputs.tag }}"
+            if [ "${{ steps.guard.outputs.skip }}" = "true" ]; then
+              echo "### Docs publish\n- Tag: \`${tag}\`\n- Result: **SKIP**" >> "$GITHUB_STEP_SUMMARY"
+            else
+              echo "### Docs publish\n- Tag: \`${tag}\`\n- Result: **PASS** (published)" >> "$GITHUB_STEP_SUMMARY"
+            fi
