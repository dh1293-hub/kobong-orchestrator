# ak-apply.yml — 주석판(가시 영역 기준)  / by GPT‑5
# 파일: .github/workflows/ak-apply.yml
# 제목: AK Apply (manual & merge)
# 목적:
#   - 수동(workflow_dispatch) 실행으로 AK 계열 작업(rewrite|fix|test)을 돌리고 산출물(로그)을 남김
#   - PR이 main에 "머지되어 닫힘(closed & merged==true)"일 때 자동 실행
#   - (선택) workflow_dispatch 실행 시 지정한 PR 번호에 결과 요약 Tail(80줄)을 코멘트로 회신
# 근거(우리 운영 표준):
#   - PS7 우선, StrictMode + -ErrorAction Stop (PowerShell7_Guidelines_Kobong_v1.1.md)
#   - Dry-Run → Apply 2단계 / GOOD 슬롯 롤백(ROLLBACK_POLICY.md, ROLLBACK_POLICY_MANUAL.md)
#   - KLC 1행 로그( traceId, durationMs, exitCode, anchorHash ) 기본
#   - 아티팩트/요약 보존, 브랜치 보호·필수 체크와 함께 운용
# 사용법:
#   - Actions > AK Apply (manual & merge) > Run workflow
#     · cmd: rewrite|fix|test (기본 fix)
#     · ref: 실행 기준 git ref (기본 main)
#     · pr:  회신할 PR 번호(선택)
#     · apply: 수동 실행 시 실제 적용(Apply)까지 수행할지 여부 (기본 false=Dry-Run만)
# 연관 파일/스크립트(예):
#   - scripts/g5/apply-patches.ps1  # 저장소 스크립트 경로에 맞게 조정 필수
# 산출물:
#   - artifacts: ak-apply-logs → .ak-out.txt, logs/ak7.jsonl
#   - (옵션) PR 코멘트: 마지막 80줄 Tail
name: ak-apply

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch/sha)'
        required: false
        default: 'main'
      cmd:
        description: 'Target command'
        required: false
        default: 'fix'
      dry_run:
        description: 'Run with DryRun first'
        type: boolean
        required: false
        default: true
      confirm_apply:
        description: 'Apply (CONFIRM_APPLY)'
        type: boolean
        required: false
        default: false
      health_gate:
        description: 'Health gate (optional)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read    # zipball 다운로드용
  actions: read

concurrency:
  group: ak-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Show inputs
        shell: pwsh
        run: |
          Write-Host "ref=${{ inputs.ref }}"
          Write-Host "cmd=${{ inputs.cmd }}"
          Write-Host "dry_run=${{ inputs.dry_run }}"
          Write-Host "confirm_apply=${{ inputs.confirm_apply }}"
          Write-Host "health_gate=${{ inputs.health_gate }}"

      - name: Download source (zipball) to workspace
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA:  ${{ inputs.ref }}
        run: |
          $ErrorActionPreference='Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'src.zip'
          $dst = Join-Path $env:GITHUB_WORKSPACE 'src'
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          $url = "https://api.github.com/repos/$env:REPO/zipball/$env:SHA"
          $hdr = @{ Authorization = "token $env:GH_TOKEN"; 'User-Agent'='ak-apply' }
          Invoke-WebRequest -Uri $url -Headers $hdr -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dst -Force

          # zipball 최상단 랜덤폴더 → 실제 루트 폴더로 이동
          $inner = Get-ChildItem -Path $dst | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          if ($null -ne $inner) {
            Get-ChildItem -Path $inner.FullName -Force | Move-Item -Destination $dst -Force
            Remove-Item -Recurse -Force $inner.FullName
          }

      - name: (Optional) Health gate
        if: ${{ inputs.health_gate == true }}
        shell: pwsh
        working-directory: src
        run: |
          $ErrorActionPreference='Stop'
          # 프로젝트 표준에 맞춰 필요한 사전 점검을 배치하세요.
          # 예: 폴더 존재, 포트 점검, 정책 파일 유효성, 등
          Write-Host "Health gate passed."

      - name: Prepare log folders
        shell: pwsh
        working-directory: src
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: DryRun
        if: ${{ inputs.dry_run == true }}
        shell: pwsh
        working-directory: src
        env:
          AK_TEE: "1"                       # .ak-out.txt는 워크플로가 전담
          TARGET_CMD: ${{ inputs.cmd }}
          TARGET_REF: ${{ inputs.ref }}
        run: |
          "== DRYRUN start ==" | Tee-Object -FilePath .ak-out.txt -Append
          & pwsh -NoProfile -File scripts/g5/apply-patches.ps1 `
              -Root . -Manifest patches/manifest.json `
              -OutText .ak-out.txt -OutJson logs/ak7.jsonl `
              -DryRun 2>&1 | Tee-Object -FilePath .ak-out.txt -Append
          "== DRYRUN end ==" | Tee-Object -FilePath .ak-out.txt -Append
          if ($LASTEXITCODE -ne 11) { throw "DryRun unexpected exit code: $LASTEXITCODE" }

      - name: Apply (CONFIRM_APPLY)
        if: ${{ inputs.dry_run == false || inputs.confirm_apply == true }}
        shell: pwsh
        working-directory: src
        env:
          AK_TEE: "1"                       # .ak-out.txt는 워크플로가 전담
          TARGET_CMD: ${{ inputs.cmd }}
          TARGET_REF: ${{ inputs.ref }}
        run: |
          "== APPLY start ==" | Tee-Object -FilePath .ak-out.txt -Append
          & pwsh -NoProfile -File scripts/g5/apply-patches.ps1 `
              -Root . -Manifest patches/manifest.json `
              -OutText .ak-out.txt -OutJson logs/ak7.jsonl `
              2>&1 | Tee-Object -FilePath .ak-out.txt -Append
          "== APPLY end ==" | Tee-Object -FilePath .ak-out.txt -Append
          exit $LASTEXITCODE

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ak-apply-logs
          path: |
            src/.ak-out.txt
            src/logs/*.jsonl
          if-no-files-found: ignore

      - name: Summary
        if: always()
        shell: pwsh
        working-directory: src
        run: |
          $summary = @()
          $summary += "## ak-apply summary"
          if (Test-Path .ak-out.txt) {
            $tail = Get-Content .ak-out.txt -Tail 200 -Raw
            $summary += ""
            $summary += "````text"
            $summary += $tail
            $summary += "````"
          } else {
            $summary += "- .ak-out.txt not found."
          }
          $summaryText = ($summary -join "`n")
          Set-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summaryText -Encoding UTF8
