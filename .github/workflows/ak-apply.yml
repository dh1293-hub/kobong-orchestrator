# ak-apply.yml — 주석판(가시 영역 기준)  / by GPT‑5
# 파일: .github/workflows/ak-apply.yml
# 제목: AK Apply (manual & merge)
# 목적:
#   - 수동(workflow_dispatch) 실행으로 AK 계열 작업(rewrite|fix|test)을 돌리고 산출물(로그)을 남김
#   - PR이 main에 "머지되어 닫힘(closed & merged==true)"일 때 자동 실행
#   - (선택) workflow_dispatch 실행 시 지정한 PR 번호에 결과 요약 Tail(80줄)을 코멘트로 회신
# 근거(우리 운영 표준):
#   - PS7 우선, StrictMode + -ErrorAction Stop (PowerShell7_Guidelines_Kobong_v1.1.md)
#   - Dry-Run → Apply 2단계 / GOOD 슬롯 롤백(ROLLBACK_POLICY.md, ROLLBACK_POLICY_MANUAL.md)
#   - KLC 1행 로그( traceId, durationMs, exitCode, anchorHash ) 기본
#   - 아티팩트/요약 보존, 브랜치 보호·필수 체크와 함께 운용
# 사용법:
#   - Actions > AK Apply (manual & merge) > Run workflow
#     · cmd: rewrite|fix|test (기본 fix)
#     · ref: 실행 기준 git ref (기본 main)
#     · pr:  회신할 PR 번호(선택)
#     · apply: 수동 실행 시 실제 적용(Apply)까지 수행할지 여부 (기본 false=Dry-Run만)
# 연관 파일/스크립트(예):
#   - scripts/g5/apply-patches.ps1  # 저장소 스크립트 경로에 맞게 조정 필수
# 산출물:
#   - artifacts: ak-apply-logs → .ak-out.txt, logs/ak7.jsonl
#   - (옵션) PR 코멘트: 마지막 80줄 Tail
name: AK Apply (manual & merge)

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 'rewrite|fix|test'
        required: true
        default: 'fix'
        type: choice
        options: [rewrite, fix, test]
      ref:
        description: 'git ref (branch/tag)'
        required: true
        default: 'main'
      pr:
        description: 'PR number to comment back (optional)'
        required: false
        default: ''
      apply:
        description: 'Run Apply step? (default: Dry-Run only)'
        required: true
        default: false
        type: boolean
  pull_request:
    branches: [main]
    types: [closed]   # 닫힐 때만 수신, 아래 if로 merged==true인 경우에만 실행

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # 같은 ref 대상으로는 한 번에 하나만
  group: ak-apply-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  apply:
    # 수동 실행이거나, PR이 "머지되어 닫힘"인 경우만 처리
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      # 수동 실행이면 inputs.ref/cmd, PR-머지 자동이면 ref_name/기본 fix
      TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
      TARGET_CMD: ${{ github.event_name == 'workflow_dispatch' && inputs.cmd || 'fix' }}

    steps:
      - name: Checkout (TARGET_REF)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Init PS7 guard (StrictMode / Stop / UTF-8)
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSDefaultParameterValues['Out-File:Encoding'] = 'utf8'
          '[INIT] AK APPLY {0} on {1}' -f $env:TARGET_CMD, $env:TARGET_REF | Out-File .ak-out.txt

      - name: Plan (Dry-Run)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          New-Item -ItemType File -Force -Path .ak-out.txt | Out-Null
    
           try {
             pwsh -NoProfile -File scripts/g5/apply-patches.ps1 -DryRun `
               -Manifest patches/manifest.json `
               -OutText .ak-out.txt -OutJson logs/ak7.jsonl
             $code = $LASTEXITCODE
             $msg  = 'ok'
           } catch {
             $code = 1
             $msg  = $_.Exception.Message
           }
           & pwsh -NoProfile -File scripts/g5/apply-patches.ps1 -DryRun `
             -Manifest patches/manifest.json `
             -OutText .ak-out.txt -OutJson logs/ak7.jsonl
           $code = $LASTEXITCODE
           # ✅ 정상 코드 맵핑: 0(성공), 11(DryRun 완료), 10(No-Op) → 성공(0)으로 처리
           $norm = if ($code -in 0,10,11) { 0 } else { $code }
           $msg  = if ($norm -eq 0) { 'ok' } else { "failed (code=$code)" }
        
            [pscustomobject]@{
              ts = (Get-Date -AsUtc -Format o)
              event = 'ak-plan'
             exitCode = $code
             error = if($code -eq 0){''}else{$msg}
             exitCode = $code
             error = if($norm -eq 0){''}else{$msg}
            } | ConvertTo-Json -Compress | Out-File logs/ak7.jsonl -Append -Encoding utf8
           exit $code
           exit $norm


      - name: Apply (on merge or manual)
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
        shell: pwsh
        run: |
            $ErrorActionPreference = 'Stop'
            New-Item -ItemType Directory -Force -Path logs | Out-Null
            New-Item -ItemType File -Force -Path .ak-out.txt | Out-Null
        
             try {
               pwsh -NoProfile -File scripts/g5/apply-patches.ps1 `
                 -Manifest patches/manifest.json `
                 -OutText .ak-out.txt -OutJson logs/ak7.jsonl
               $code = $LASTEXITCODE
               $msg  = 'ok'
             } catch {
               $code = 1
               $msg  = $_.Exception.Message
             }
             & pwsh -NoProfile -File scripts/g5/apply-patches.ps1 `
               -Manifest patches/manifest.json `
               -OutText .ak-out.txt -OutJson logs/ak7.jsonl
             $code = $LASTEXITCODE
             # ✅ 0(성공), 10(No-Op) → 성공(0)으로 처리
             $norm = if ($code -in 0,10) { 0 } else { $code }
             $msg  = if ($norm -eq 0) { 'ok' } else { "failed (code=$code)" }
          
              [pscustomobject]@{
                ts = (Get-Date -AsUtc -Format o)
                event = 'ak-apply'
               exitCode = $code
               error = if($code -eq 0){''}else{$msg}
               exitCode = $code
               error = if($norm -eq 0){''}else{$msg}
              } | ConvertTo-Json -Compress | Out-File logs/ak7.jsonl -Append -Encoding utf8
             exit $code
             exit $norm



      - name: Health gate (optional)
        if: ${{ always() }}   # 필요 시 조건/구현 보강
        run: |
          # TODO: 외부 서비스/에이전트 헬스체크 로직 삽입
          "health=ok" | Out-File .ak-out.txt -Append

      - name: Apply (CONFIRM_APPLY)
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && inputs.apply == true) }}
        env:
          CONFIRM_APPLY: 'true'
        run: |
          try {
            "== APPLY start ==" | Tee-Object -FilePath .ak-out.txt -Append
            pwsh -NoProfile -File scripts/g5/apply-patches.ps1 -Apply `
              2>&1 | Tee-Object -FilePath .ak-out.txt -Append
            "== APPLY end =="   | Tee-Object -FilePath .ak-out.txt -Append
            '{ "ts":"{0}","event":"ak-apply","cmd":"{1}","exitCode":0 }' -f (Get-Date -Format o), $env:TARGET_CMD | Out-File logs/ak7.jsonl -Append
          } catch {
            '{ "ts":"{0}","event":"ak-apply","cmd":"{1}","exitCode":1,"error":"{2}"}' -f (Get-Date -Format o), $env:TARGET_CMD, ($_.Exception.Message.Replace('"','''')) | Out-File logs/ak7.jsonl -Append
            throw
          }

      - name: Upload artifacts (logs)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ak-apply-logs
          path: |
            .ak-out.txt
            logs/ak7.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Comment back to PR (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const tail = fs.readFileSync('.ak-out.txt','utf8').split('\n').slice(-80).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number("${{ inputs.pr }}"),
              body: "🟩 **AK APPLY `${{ env.TARGET_CMD }}`** on `${{ env.TARGET_REF }}`\n\n```\\n"+tail+"\\n```"
            });
