# =========================================
# 이름 : Release / Apply (DRYRUN→APPLY)
# 용도 : 운영 반영(배포) 수동 실행. DRYRUN으로 검증 후 APPLY.
# 트리거 : workflow_dispatch
# 권한 : contents:read
# 산출물 : Step Summary
# =========================================
name: Release / Apply
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "대상 환경 (예: prod / staging)"
        required: true
        default: "prod"
      action:
        description: "실행 단계"
        type: choice
        options: [ DRYRUN, APPLY ]
        default: DRYRUN

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest   # 필요시 ubuntu-latest로 변경
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: DRYRUN / APPLY
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "### Release ${{ inputs.action }} → ${{ inputs.environment }}"
          if ("${{ inputs.action }}" -eq "DRYRUN") {
            # TODO: DRYRUN 배포 검증 명령 연결
            Write-Host "DRYRUN only. Validate /health here."
          } else {
            # TODO: 실제 배포 명령 연결
            Write-Host "APPLY. Execute real deployment."
          }
