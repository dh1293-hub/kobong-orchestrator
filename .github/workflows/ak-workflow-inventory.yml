# AK • Workflow Inventory (frozen rules)
# - 목적: 루트 ".github/workflows"의 YML을 스캔해, "주석 제외 + 단일 파일 경로만"을 _inventory/workflows.txt 로 산출
# - 규칙: inventory-ci.yml 제외, 파일명 토큰도 해석, 반복 루프 -ScanDepth 지원(기본 1)
# - 러너: ubuntu-latest (pwsh 사용) — 로컬과 동일 로직 유지

name: AK • Workflow Inventory

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'scripts/g5/Trace-WorkflowRefs.v3.3.2.ps1'

permissions:
  contents: write         # 커밋/브랜치 생성
  pull-requests: write    # PR 생성/업데이트 권한

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate inventory
        shell: pwsh
        run: |
          # 1) 스크립트 자동 탐색(대소문자/버전 오타 방지)
          $script = Get-ChildItem -File -Recurse "scripts/g5/Trace-WorkflowRefs*.ps1" |
                    Sort-Object Name -Descending | Select-Object -First 1
          if (-not $script) {
            Write-Error "Trace-WorkflowRefs*.ps1 not found under scripts/g5"
            Get-ChildItem -Recurse scripts/g5 | Format-List FullName
            exit 1
          }
          Write-Host "Using scanner: $($script.FullName)"
      
          # 2) 실행
          pwsh -NoProfile -File $script.FullName -ScanDepth 1
      
          # 3) 산출물 검증(없으면 실패로 종료)
          if (-not (Test-Path "_inventory/workflows.txt" -PathType Leaf)) {
            Write-Error "_inventory/workflows.txt was not generated."
            exit 2
          }
      
          # 4) 요약 출력(앞부분만)
          '## Workflows Inventory (head)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Content _inventory/workflows.txt -TotalCount 80 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append


      - name: Create PR with updated inventory
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(inventory): update workflows index"
          title: "chore: update workflows inventory"
          body: |
            Auto-generated inventory
            - Rules: comments-excluded, files-only, .github/workflows only
            - Excluded: inventory-ci.yml
            - ScanDepth: 1
          branch: ci/inventory-update
          add-paths: |
            _inventory/workflows.txt
          labels: |
            ci
            automated
