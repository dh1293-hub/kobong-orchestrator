# AK • Workflow Inventory (frozen rules)
# - 목적: 루트 ".github/workflows"의 YML을 스캔해, "주석 제외 + 단일 파일 경로만"을 _inventory/workflows.txt 로 산출
# - 규칙: inventory-ci.yml 제외, 파일명 토큰도 해석, 반복 루프 -ScanDepth 지원(기본 1)
# - 러너: ubuntu-latest (pwsh 사용) — 로컬과 동일 로직 유지

name: AK • Workflow Inventory

on:
  workflow_dispatch:   # 수동 실행
  push:                # 워크플로/스캐너 변경 시 자동 실행
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'scripts/g5/Trace-WorkflowRefs.v3.3.ps1'

jobs:
  build:
    runs-on: ubuntu-latest   # pwsh 내장
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate workflows inventory (flat files only)
        shell: pwsh
        run: |
          # PS 7 고정, 규칙 고정
          pwsh -NoProfile -File ./scripts/g5/Trace-WorkflowRefs.v3.3.ps1 -ScanDepth 1
          # 요약 출력(앞부분만)
          '## Workflows Inventory (head)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Content _inventory/workflows.txt -TotalCount 80 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload artifact (_inventory/workflows.txt)
        uses: actions/upload-artifact@v4
        with:
          name: workflows-inventory
          path: _inventory/workflows.txt
          if-no-files-found: error
