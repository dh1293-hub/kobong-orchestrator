name: WF / Inventory Publisher (single PR, no spam)

on:
  # main에 워크플로 관련 변경이 합쳐질 때만 자동 실행
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'scripts/g5/**'
      - 'scripts/**/wf-inventory.ps1'
  # 필요 시 수동 실행
  workflow_dispatch: {}

# PR 만들고 푸시해야 하므로 반드시 write 권한 필요
permissions:
  contents: write
  pull-requests: write

# 동일 ref에서 재런되면 진행 중인 실행 취소(중복 실행·레이스 방지)
concurrency:
  group: wf-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # ⚠️ 기존 PowerShell 스크립트(wf-inventory.ps1)가 Windows 경로/명령을 가정하므로 windows-latest 권장
    # (Ubuntu로 돌리고 싶으면 wf-inventory.ps1이 pwsh 7 + 리눅스 경로에서도 동작하는지 확인 필요)
    runs-on: windows-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # 1) 소스 받기
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # rebase/비교를 위해 원격 히스토리 일부 필요하면 늘리세요(기본 1도 무방)
          fetch-depth: 0

      # 2) 인벤토리 생성 (이미 있는 스크립트 호출)
      #    ✔ 경로는 레포의 실제 위치에 맞춰 주세요.
      - name: Build inventory (PowerShell)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'scripts/g5/wf-inventory.ps1'
          if (-not (Test-Path $script)) {
            throw "Not found: $script  (경로 확인)"
          }
          pwsh -NoProfile -File $script -Repo "${{ github.repository }}" -Ref "main"

      # 3) 결과 안정화(실행마다 바뀌는 필드 제거 + 정렬) → 매 실행 diff 폭주 방지
      - name: Normalize outputs (stable CSV/JSON)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csv  = Join-Path '_inventory' 'workflows.csv'
          $json = Join-Path '_inventory' 'workflows.json'
          if (-not (Test-Path $csv) -or -not (Test-Path $json)) {
            throw "Inventory outputs not found: $csv / $json"
          }

          # JSON 안정화: 볼라타일 필드 제거, path 기준 정렬
          $rows = Get-Content $json -Raw | ConvertFrom-Json
          if ($rows -isnot [System.Collections.IEnumerable]) { $rows = @($rows) }

          $volatile = @('updated_utc','run_id','run_url')
          foreach ($r in $rows) {
            foreach ($k in $volatile) {
              $null = $r.PSObject.Properties.Remove($k)
            }
          }
          $rows = $rows | Sort-Object path
          ($rows | ConvertTo-Json -Depth 10) | Set-Content $json -Encoding UTF8

          # CSV도 path 기준 정렬(열 순서는 유지)
          $csvRows = Import-Csv $csv
          $csvRows | Sort-Object path | Export-Csv $csv -NoTypeInformation -Encoding UTF8

      # 4) 변경 감지 (없으면 종료)
      - name: Detect changes
        id: diff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
      
          # 경로 고정
          $paths = @('_inventory/workflows.csv','_inventory/workflows.json')
      
          # 인텐트 추가(신규 파일도 diff에 잡히도록)
          git add -N $paths | Out-Null
      
          # 안전한 비교: --name-only 는 항상 exit 0 → 스텝 실패 안 함
          $changedList = git diff --name-only -- $paths
          if ([string]::IsNullOrWhiteSpace($changedList)) {
            'changed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host 'No inventory changes.'
          } else {
            'changed=true'  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Changed: $changedList"
          }


      # 5) 산출물 업로드(검토용)
      - name: Upload artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wf-inventory
          path: |
            _inventory/workflows.csv
            _inventory/workflows.json

      # 6) 단일 봇 브랜치로만 PR 유지(늘 새로 만들지 않음) + [skip ci]로 루프 차단
      - name: Commit & open/update single PR
        if: steps.diff.outputs.changed == 'true'
        shell: pwsh
        env:
          BOT_BRANCH: bot/wf-inventory          # ← 고정 브랜치(항상 이것만 사용)
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name  "wf-allround-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -B $env:BOT_BRANCH origin/main
          git pull --rebase origin main

          git add _inventory/workflows.csv _inventory/workflows.json
          git commit -m "[WF] _inventory snapshot [skip ci]" | Out-Null
          git push -f origin $env:BOT_BRANCH

          # 기존 열린 PR 재사용(없으면 생성)
          $pr = gh pr list --search "head:$env:BOT_BRANCH state:open" --json number --jq ".[0].number"
          if (-not $pr) {
            gh pr create --head $env:BOT_BRANCH --base main `
              --title "[WF] _inventory snapshot" `
              --body  "자동 생성된 인벤토리 스냅샷입니다. (_inventory/workflows.*)"
          } else {
            Write-Host "Reuse PR #$pr"
          }

          # (선택) 자동 스쿼시 머지: 리포지토리에서 Allow auto-merge 켜진 경우에만 동작
          try { gh pr merge --squash --auto $pr } catch { Write-Host "auto-merge not enabled or not allowed; skip" }
