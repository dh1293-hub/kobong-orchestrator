# WF / Inventory Publisher (single PR, no spam)
# - .github/workflows/ 하위가 바뀌면 _inventory/* 를 재생성하고
#   'bot/wf-inventory' 단일 브랜치에서 PR 1개만 재사용합니다.
# - Auto-merge는 리포 설정(Allow auto-merge)이 켜져 있어야 실제 자동 병합됩니다.
name: WF / Inventory Publisher (single PR, no spam)

on:
  # main 에 워크플로 관련 변경이 합쳐질 때만 자동 실행 (루프 방지: _inventory/* 는 트리거하지 않음)
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/**"
      - "scripts/g5/**"
      - "scripts/**/wf-inventory.ps1"
  # 필요 시 수동 실행
  workflow_dispatch: {}

# PR/푸시를 하므로 write 권한 필수
permissions:
  contents: write
  pull-requests: write

# 동시 실행/레이스 방지: 같은 워크플로는 1개만 진행
concurrency:
  group: wf-inventory-publisher   # ref별이 아닌 고정 그룹 → 중복 실행 강제 차단
  cancel-in-progress: true

jobs:
  publish:
    # PowerShell 스크립트(wf-inventory.ps1)가 Windows 경로/명령을 가정 → windows-latest 권장
    # (Ubuntu로 돌리려면 pwsh7 + 리눅스 경로 대응이 확인되어야 합니다)
    runs-on: windows-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # gh CLI 인증

    steps:
      # 1) 소스 받기
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # rebase/비교/브랜치 재생성에 대비해 히스토리 확보

      # 2) Git 라인엔딩/봇 서명 설정 (CRLF 경고 → 리베이스 실패 예방)
      - name: Git config (line endings & identity)
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config user.name  "wf-allround-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 3) (선택) 워킹트리 정리 — 이전 실행 잔여물로 인한 unstaged 방지
      - name: Reset working tree (clean)
        shell: pwsh
        run: |
          git reset --hard
          git clean -fd

      # 4) 인벤토리 생성 (이미 있는 스크립트 호출)
      - name: Build inventory (PowerShell)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'scripts/g5/wf-inventory.ps1'
          if (-not (Test-Path $script)) {
            throw "Not found: $script (경로 확인)"
          }
          # 필요한 경우 인자 조정 가능
          pwsh -NoProfile -File $script -Repo "${{ github.repository }}" -Ref "main"

      # 5) 산출물 정규화 — 실행마다 달라지는 필드 제거 + 정렬 + LF/UTF-8 고정
      - name: Normalize outputs (stable CSV/JSON)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csvPath  = Join-Path '_inventory' 'workflows.csv'
          $jsonPath = Join-Path '_inventory' 'workflows.json'
          if (-not (Test-Path $csvPath) -or -not (Test-Path $jsonPath)) {
            throw "Inventory outputs not found: $csvPath / $jsonPath"
          }

          # JSON: 볼라타일 키 제거 + path 정렬 + LF/UTF8
          $rows = Get-Content $jsonPath -Raw | ConvertFrom-Json
          if ($rows -isnot [System.Collections.IEnumerable]) { $rows = @($rows) }
          $volatile = @('updated_utc','run_id','run_url')
          foreach ($r in $rows) { foreach ($k in $volatile) { $null = $r.PSObject.Properties.Remove($k) } }
          $rows = $rows | Sort-Object path
          ($rows | ConvertTo-Json -Depth 10) | Set-Content $jsonPath -Encoding utf8 -NoNewline
          (Get-Content $jsonPath -Raw).Replace("`r`n","`n") | Set-Content $jsonPath -Encoding utf8 -NoNewline

          # CSV: path 정렬 + LF/UTF8
          $csvRows = Import-Csv $csvPath
          $tmp = Join-Path $env:RUNNER_TEMP 'wf-inventory.csv'
          $csvRows | Sort-Object path | Export-Csv $tmp -NoTypeInformation -Encoding utf8
          (Get-Content $tmp -Raw).Replace("`r`n","`n") | Set-Content $csvPath -Encoding utf8 -NoNewline

      # 6) 변경 감지 (없으면 이후 스텝 스킵)
      - name: Detect changes
        id: diff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @('_inventory/workflows.csv','_inventory/workflows.json')
          git add -N $paths | Out-Null                 # 신규 파일도 diff에 포착
          $changedList = git diff --name-only -- $paths
          if ([string]::IsNullOrWhiteSpace($changedList)) {
            'changed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host 'No inventory changes.'
          } else {
            'changed=true'  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Changed: $changedList"
          }

      # 7) (옵션) 산출물 업로드 — UI에서 쉽게 내려받아 확인
      - name: Upload artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wf-inventory
          path: |
            _inventory/workflows.csv
            _inventory/workflows.json
          if-no-files-found: error
          retention-days: 7

      # 8) 'bot/wf-inventory' 단일 브랜치로만 PR 유지 + [skip ci]로 루프 차단
      - name: Commit & open/update single PR
        if: steps.diff.outputs.changed == 'true'
        shell: pwsh
        env:
          BOT_BRANCH: bot/wf-inventory
        run: |
          $ErrorActionPreference = 'Stop'

          # 최신 main 기반으로 고정 브랜치 재생성/스위치(항상 깨끗한 기반 확보)
          git fetch origin main
          git checkout -B $env:BOT_BRANCH origin/main

          git add _inventory/workflows.csv _inventory/workflows.json
          git commit -m "[WF] _inventory snapshot [skip ci]" | Out-Null
          git push -f origin $env:BOT_BRANCH

          # PR 재사용(열려 있으면 재사용, 없으면 생성)
          $pr = gh pr list --head $env:BOT_BRANCH --state open --json number --jq ".[0].number"
          if (-not $pr) {
            $pr = gh pr create --head $env:BOT_BRANCH --base main `
                  --title "[WF] _inventory snapshot" `
                  --body  "자동 생성된 인벤토리 스냅샷입니다. (_inventory/workflows.*)"
            Write-Host "Opened PR #$pr"
          } else {
            Write-Host "Reusing PR #$pr"
          }

          # Auto-merge 시도(리포에서 Allow auto-merge가 켜져 있어야 동작). 실패해도 워크플로는 통과.
          try {
            gh pr merge $pr --squash --auto --delete-branch
            Write-Host "Auto-merge enabled for PR #$pr"
          } catch {
            Write-Warning "Auto-merge not enabled or not allowed. PR #$pr will wait for manual merge."
          }

      # 9) 혹시 남아 있는 중복 PR 정리(최신 1개만 유지)
      - name: Close duplicate open PRs (keep newest)
        if: always()
        shell: pwsh
        run: |
          $list = gh pr list --head bot/wf-inventory --state open --json number,createdAt `
                  | ConvertFrom-Json | Sort-Object createdAt -Descending
          if ($list.Count -gt 1) {
            $keep = $list[0].number
            foreach ($p in $list | Select-Object -Skip 1) {
              gh pr close $p.number -c "Superseded by #$keep"
            }
          }
