# =========================================================
# 파일 용도 : PowerShell 스크립트 정적 점검(PSScriptAnalyzer) + 폴백(문법 전용)
# 동작 방식 : PR/수동 실행 시 레포 소스를 Zipball로 받고 scripts/g5 하위 검사
# 연관 파일 : scripts/g5/* (ak-selftest.yml 보조)
# 안전 가드 : Git 미사용(Zipball), PSGallery v3→v2 다중 재시도, 갤러리 장애 시 문법 분석 폴백
# 산출물    : artifacts/pssa-findings.txt
# =========================================================
name: PS-analyze

on:
  pull_request:
    paths:
      - "scripts/g5/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: psanalyze-${{ github.ref }}
  cancel-in-progress: false

jobs:
  psanalyze:
    name: psanalyze
    runs-on: ubuntu-latest
    steps:
      # ── Git 없이 소스 수신(Zipball) ─────────────────────────────
      - name: Resolve repo and sha
        id: rev
        uses: actions/github-script@v7
        with:
          script: |
            let sha = context.sha;
            if (context.eventName === 'pull_request') {
              sha = context.payload.pull_request.head.sha;
            }
            core.setOutput('repo', `${context.repo.owner}/${context.repo.repo}`);
            core.setOutput('sha', sha);

      - name: Download zipball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ steps.rev.outputs.repo }}
          SHA:      ${{ steps.rev.outputs.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'src.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'src-unzip'
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; "X-GitHub-Api-Version"="2022-11-28" }
          $url = "https://api.github.com/repos/$env:REPO/zipball/$env:SHA"
          Invoke-WebRequest -Headers $hdr -Uri $url -OutFile $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($zip,$tmp)
          $root = Get-ChildItem $tmp | ?{ $_.PSIsContainer } | Select-Object -First 1
          if (-not $root) { throw "zipball root not found" }
          "SRCROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # 분석 대상만 워크스페이스 하위로 복사(컨테이너 액션 등 대비)
          New-Item -ItemType Directory -Force -Path src | Out-Null
          if (Test-Path (Join-Path $env:SRCROOT 'scripts/g5')) {
            Copy-Item -Recurse -Force (Join-Path $env:SRCROOT 'scripts/g5') 'src/scripts/g5'
          }

      - name: Print PowerShell environment
        shell: pwsh
        run: |
          $v=$PSVersionTable.PSVersion.ToString()
          $hasPSR=[bool](Get-Command Install-PSResource -ErrorAction SilentlyContinue)
          $pget=(Get-Module PowerShellGet -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1).Version
          Write-Host "pwsh=$v  Install-PSResource?=$hasPSR  PowerShellGet=$pget"
          Write-Host "SRCROOT=$env:SRCROOT"

      # ── PSScriptAnalyzer 설치(다중 재시도) ──────────────────────
      - name: Install PSScriptAnalyzer robust with retry
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ok=$false
          function Try-V3 {
            if (Get-Command Install-PSResource -ErrorAction SilentlyContinue) {
              if (-not (Get-PSResourceRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                Register-PSResourceRepository -Name PSGallery -Uri 'https://www.powershellgallery.com/api/v3' -Trusted
              } else { try { Set-PSResourceRepository -Name PSGallery -Trusted } catch {} }
              Install-PSResource -Name PSScriptAnalyzer -Repository PSGallery -Scope CurrentUser -TrustRepository -Quiet -Reinstall
              $script:ok=$true
            }
          }
          function Try-V2 {
            if ($IsWindows -and -not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
              Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
            }
            $pg = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
            if (-not $pg) {
              $hasDefault=(Get-Command Register-PSRepository).Parameters.ContainsKey('Default')
              if ($hasDefault) { Register-PSRepository -Default } else {
                Register-PSRepository -Name PSGallery -SourceLocation 'https://www.powershellgallery.com/api/v2' -ScriptSourceLocation 'https://www.powershellgallery.com/api/v2' -InstallationPolicy Trusted
              }
            } else { try { Set-PSRepository -Name PSGallery -InstallationPolicy Trusted } catch {} }
            Install-Module PSScriptAnalyzer -Repository PSGallery -Scope CurrentUser -Force -AcceptLicense
            $script:ok=$true
          }
          for ($i=0; $i -lt 6 -and -not $ok; $i++) { try { Try-V3 } catch { Start-Sleep -Seconds ([math]::Pow(2,$i)); continue } }
          for ($i=0; $i -lt 6 -and -not $ok; $i++) { try { Try-V2 } catch { Start-Sleep -Seconds ([math]::Pow(2,$i)); continue } }
          if ($ok) { Import-Module PSScriptAnalyzer -Force; 'ok=true'  | Out-File -FilePath $env:GITHUB_OUTPUT -Append }
          else      { 'ok=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append; Write-Warning 'PSScriptAnalyzer install failed; will run syntax-only fallback.' }

      # ── PSSA 사용 분석(정상 경로) ───────────────────────────────
      - name: Run PSSA and save findings
        if: ${{ steps.install.outputs.ok == 'true'
