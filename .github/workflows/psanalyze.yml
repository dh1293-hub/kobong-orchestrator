# =========================================================
# 파일 용도 : PowerShell 스크립트 정적 점검(PSScriptAnalyzer) + 폴백(문법 전용)
# 동작 방식 : PR/수동 실행 시 레포 소스를 Zipball로 받고 scripts/g5 하위 검사
# 연관 파일 : scripts/g5/*  (ak-selftest.yml의 보조 분석기로 병행 운용)
# 안전 가드 : Git 미사용(Zipball), PSGallery(v3→v2) 다중 재시도, 갤러리 장애 시 문법 분석 폴백
# 산출물    : artifacts/pssa-findings.txt
# =========================================================
name: PS-analyze

on:
  pull_request:
    paths:
      - "scripts/g5/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: psanalyze-${{ github.ref }}
  cancel-in-progress: false

jobs:
  psanalyze:
    name: psanalyze
    runs-on: ubuntu-latest
    steps:
      # ── Git 없이 소스 수신(Zipball) ─────────────────────────────
      - name: Resolve repo and sha
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            SHA="$(jq -r '.pull_request.head.sha' < "$GITHUB_EVENT_PATH")"
          else
            SHA="${GITHUB_SHA}"
          fi
          echo "REPO=${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
          echo "SHA=${SHA}" >> "$GITHUB_ENV"

      - name: Download zipball (curl, 3-fallback)
        shell: bash
        env:
          REPO: ${{ env.REPO }}
          SHA:  ${{ env.SHA }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
      
          zip="$RUNNER_TEMP/src.zip"
          tmp="$RUNNER_TEMP/src-unzip"
          rm -rf "$tmp"; mkdir -p "$tmp"
      
          api_url="https://api.github.com/repos/$REPO/zipball/$SHA"
          owner="${REPO%%/*}"
          name="${REPO##*/}"
          cl_url="https://codeload.github.com/$owner/$name/zip/$SHA"
      
          download() {
            local url="$1"
            echo "→ try: $url"
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              curl -fL --connect-timeout 10 \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Accept: application/zip" \
                -o "$zip" "$url"
            else
              curl -fL --connect-timeout 10 \
                -H "Accept: application/zip" \
                -o "$zip" "$url"
            fi
          }
      
          ok=0
          # 1) API zipball
          if download "$api_url"; then ok=1; fi
      
          # 2) codeload (공개 레포용) 폴백
          if [ $ok -eq 0 ]; then
            echo "warn: api zipball failed, fallback to codeload"
            if download "$cl_url"; then ok=1; fi
          fi
      
          # 3) gh api 최종 폴백(토큰 자동 사용, 바이너리 리다이렉트)
          if [ $ok -eq 0 ]; then
            echo "warn: codeload failed, fallback to gh api"
            if gh api -H "Accept: application/zip" "/repos/$REPO/zipball/$SHA" > "$zip"; then
              ok=1
            fi
          fi
      
          if [ $ok -ne 1 ] || [ ! -s "$zip" ]; then
            echo "::error::Zipball download failed (auth/visibility). Check token/permissions."
            exit 1
          fi
      
          unzip -q "$zip" -d "$tmp"
          root="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          [ -n "$root" ] || { echo "::error::zipball root not found"; exit 1; }
      
          echo "SRCROOT=$root" >> "$GITHUB_ENV"
          mkdir -p src
          if [ -d "$root/scripts/g5" ]; then
            mkdir -p src/scripts
            cp -R "$root/scripts/g5" "src/scripts/"
          fi



      - name: Print PowerShell env
        shell: pwsh
        run: |
          $v=$PSVersionTable.PSVersion.ToString()
          $hasPSR=[bool](Get-Command Install-PSResource -ErrorAction SilentlyContinue)
          $pget=(Get-Module PowerShellGet -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1).Version
          Write-Host "pwsh=$v  Install-PSResource?=$hasPSR  PowerShellGet=$pget"
          Write-Host "SRCROOT=$env:SRCROOT"

      # ── PSScriptAnalyzer 설치(다중 재시도) ──────────────────────
      - name: Install PSScriptAnalyzer robust
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $global:PSAInstalled=$false

          function Try-V3 {
            if (Get-Command Install-PSResource -ErrorAction SilentlyContinue) {
              if (-not (Get-PSResourceRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                Register-PSResourceRepository -Name PSGallery -Uri 'https://www.powershellgallery.com/api/v3' -Trusted
              } else { try { Set-PSResourceRepository -Name PSGallery -Trusted } catch {} }
              Install-PSResource -Name PSScriptAnalyzer -Repository PSGallery -Scope CurrentUser -TrustRepository -Quiet -Reinstall
              $global:PSAInstalled=$true
            }
          }

          function Try-V2 {
            if ($IsWindows -and -not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
              Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
            }
            $pg = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
            if (-not $pg) {
              $hasDefault=(Get-Command Register-PSRepository).Parameters.ContainsKey('Default')
              if ($hasDefault) { Register-PSRepository -Default } else {
                Register-PSRepository -Name PSGallery -SourceLocation 'https://www.powershellgallery.com/api/v2' -ScriptSourceLocation 'https://www.powershellgallery.com/api/v2' -InstallationPolicy Trusted
              }
            } else { try { Set-PSRepository -Name PSGallery -InstallationPolicy Trusted } catch {} }
            Install-Module PSScriptAnalyzer -Repository PSGallery -Scope CurrentUser -Force -AcceptLicense
            $global:PSAInstalled=$true
          }

          for ($i=0; $i -lt 6 -and -not $global:PSAInstalled; $i++) {
            try { Try-V3 } catch { Start-Sleep -Seconds ([math]::Pow(2,$i)); continue }
          }
          for ($i=0; $i -lt 6 -and -not $global:PSAInstalled; $i++) {
            try { Try-V2 } catch { Start-Sleep -Seconds ([math]::Pow(2,$i)); continue }
          }

          if ($global:PSAInstalled) {
            Import-Module PSScriptAnalyzer -Force
            Get-Module PSScriptAnalyzer | Format-List Name,Version | Out-String | Write-Host
            'PRIMARY=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Warning 'PSScriptAnalyzer install failed; will run syntax-only fallback.'
            'PRIMARY=0' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      # ── 분석 실행(Primary 경로) ─────────────────────────────────
      - name: Run PSSA and save findings
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:PRIMARY -ne '1') { Write-Host 'Skip primary (no PSSA).'; exit 0 }
          $target='src/scripts/g5'
          if (-not (Test-Path $target)) { Write-Host 'No scripts/g5 to analyze'; exit 0 }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $results = Invoke-ScriptAnalyzer -Path $target -Recurse -Severity Error,Warning
          if ($results) {
            $results | Sort-Object Severity, RuleName |
              Select-Object Severity, RuleName, ScriptName, Line, Message |
              Format-Table -AutoSize | Out-String | Tee-Object -FilePath 'artifacts/pssa-findings.txt'
          } else {
            'PSScriptAnalyzer: no findings' | Tee-Object -FilePath 'artifacts/pssa-findings.txt'
          }
          $err = ($results | Where-Object { $_.Severity -eq 'Error' }).Count
          if ($err -gt 0) { Write-Error "PSScriptAnalyzer errors: $err" }

      # ── 갤러리 장애 폴백: 문법 전용 분석(오프라인) ───────────────
      - name: Fallback syntax only analysis
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:PRIMARY -eq '1') { Write-Host 'Skip fallback (PSSA available).'; exit 0 }
          $target='src/scripts/g5'
          if (-not (Test-Path $target)) { Write-Host 'No scripts/g5 to analyze'; exit 0 }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $errs=@()
          Get-ChildItem $target -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            try {
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$null)
            } catch {
              $errs += [pscustomobject]@{ Severity='Error'; RuleName='Syntax'; ScriptName=$_.Name; Line=0; Message=$_.Exception.Message }
            }
          }
          if ($errs.Count -gt 0) {
            $errs | Format-Table -AutoSize | Out-String | Tee-Object -FilePath 'artifacts/pssa-findings.txt'
            Write-Error "Syntax errors: $($errs.Count)"
          } else {
            'Syntax-only: no parse errors (PSGallery outage fallback mode)' | Tee-Object -FilePath 'artifacts/pssa-findings.txt'
          }

      - name: Upload findings artifact
        uses: actions/upload-artifact@v4
        with:
          name: pssa-findings
          path: artifacts/pssa-findings.txt
          if-no-files-found: ignore
          retention-days: 7
