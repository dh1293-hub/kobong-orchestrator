# ============================================================
# Smoke / Health — 초경량 헬스 체크(여러 엔드포인트 일괄 확인)
# 목적:
#   - 수동/예약으로 여러 헬스 URL을 빠르게 확인(HTTP 200/본문 포함 여부)
#   - 실패 시 enforce(잡 실패) 또는 report(경고만) 모드 선택
# 트리거:
#   - workflow_dispatch(수동). 필요하다면 schedule 주석 해제.
# 보안/가드:
#   - 최소 권한(contents: read)
#   - 동시성 취소, 5분 타임아웃, Ubuntu 러너(빠르고 안정)
# 참고:
#   - YAML 파서 오류 방지: 모든 스크립트는 run: | 블록, 탭 금지(스페이스만)
#   - 입력에 여러 줄을 넣을 때는 줄 단위로 파싱합니다.
# ============================================================
name: smoke/health

on:
  workflow_dispatch:
    inputs:
      targets:
        description: |-
          헬스 체크 대상 URL(한 줄 하나).
          예)
            http://localhost:5181/health
            http://localhost:5182/health
            http://localhost:5183/health
        required: false
        type: string
        default: |
          http://localhost:5181/health
          http://localhost:5182/health
          http://localhost:5183/health
      expect_substr:
        description: '본문에 포함되어야 할 문자열(선택). 없으면 상태코드만 검사'
        required: false
        type: string
        default: ''
      timeout_sec:
        description: '요청 타임아웃(초)'
        required: true
        type: string
        default: '5'
      mode:
        description: '위반 시 동작: enforce=실패, report=경고만'
        required: true
        type: choice
        options: [enforce, report]
        default: enforce
  # schedule:
  #   - cron: '*/15 * * * *'   # 15분마다(필요 시 주석 해제)

permissions:
  contents: read

concurrency:
  group: smoke-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Parse inputs
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          # 입력 문자열을 안전하게 줄 단위 분해(앞뒤 공백/빈줄 제거)
          readarray -t URLS < <(printf '%s\n' "${{ github.event.inputs.targets }}" | sed '/^[[:space:]]*$/d')
          if (( ${#URLS[@]} == 0 )); then
            echo "::error::No targets provided"; exit 1
          fi
          printf 'urls<<EOF\n' >> "$GITHUB_OUTPUT"
          printf '%s\n' "${URLS[@]}" >> "$GITHUB_OUTPUT"
          printf 'EOF\n' >> "$GITHUB_OUTPUT"
          echo "expect=${{ github.event.inputs.expect_substr }}"   >> "$GITHUB_OUTPUT"
          echo "timeout=${{ github.event.inputs.timeout_sec }}"    >> "$GITHUB_OUTPUT"
          echo "mode=${{ github.event.inputs.mode }}"              >> "$GITHUB_OUTPUT"

      - name: Probe endpoints (HTTP)
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n' read -r -d '' -a URLS < <(printf '%s\0' "${{ steps.parse.outputs.urls }}")
          EXPECT="${{ steps.parse.outputs.expect }}"
          TOUT="${{ steps.parse.outputs.timeout }}"
          mkdir -p _inventory/health-smoke
          ok=(); bad=()

          for u in "${URLS[@]}"; do
            u="$(echo "$u" | xargs)"   # trim
            [[ -z "$u" ]] && continue

            # HTTP 요청(HEAD 우선, 실패 시 GET로 재시도) — 짧은 타임아웃
            code="$(curl -fsSLI --max-time "$TOUT" -o /dev/null -w '%{http_code}' "$u" || true)"
            body=""
            if [[ -z "$code" || "$code" -ge 400 || "$code" -eq 000 ]]; then
              body="$(curl -fsSL --max-time "$TOUT" "$u" 2>/dev/null || true)"
              if [[ -z "$body" ]]; then code="000"; fi
            else
              # HEAD 2xx라면 본문은 생략(옵션)
              body=""
            fi

            pass=false
            if [[ "$code" =~ ^2[0-9][0-9]$ ]]; then
              if [[ -n "$EXPECT" ]]; then
                if printf '%s' "$body" | grep -Fq -- "$EXPECT"; then pass=true; fi
              else
                pass=true
              fi
            fi

            if $pass; then
              echo "OK  $u  (code=$code)"
              ok+=("$u")
            else
              echo "::error::FAIL $u (code=${code:-NA})"
              if [[ -n "$EXPECT" && -n "$body" ]]; then
                echo "::notice title=Body snippet::$(printf '%s' "$body" | head -c 200)"
              fi
              bad+=("$u")
            fi
          done

          # 요약 파일 생성
          {
            echo "# Health Smoke Summary"
            echo ""
            echo "- OK    : ${#ok[@]}"
            echo "- Failed: ${#bad[@]}"
            echo ""
            echo "## Targets"
            for x in "${ok[@]}";  do echo "- ✅ $x"; done
            for x in "${bad[@]}"; do echo "- ❌ $x"; done
          } > _inventory/health-smoke/summary.md

          # 출력값
          echo "ok=${#ok[@]}"     >> "$GITHUB_OUTPUT"
          echo "fail=${#bad[@]}"  >> "$GITHUB_OUTPUT"

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-smoke-${{ github.run_id }}
          path: _inventory/health-smoke/summary.md
          if-no-files-found: warn

      - name: Enforce or report
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ steps.parse.outputs.mode }}"
          fail="${{ steps.probe.outputs.fail }}"
          [[ -z "$fail" ]] && fail=0
          if (( fail > 0 )); then
            if [[ "$mode" == "report" ]]; then
              echo "::warning::Health failures: $fail (report mode: not failing)."
              exit 0
            else
              echo "::error::Health failures: $fail"
              exit 1
            fi
          else
            echo "✅ All health checks passed."
          fi
