name: Health Smoke (daily)

on:
  schedule:
    # UTC 00:00 (KST 09:00)
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: health-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Download source (zipball)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA:  ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'src.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'src-unzip'
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent" = "actions"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $url = "https://api.github.com/repos/$env:REPO/zipball/$env:SHA"
          Invoke-WebRequest -Uri $url -Headers $headers -OutFile $zip -UseBasicParsing

          Expand-Archive -LiteralPath $zip -DestinationPath $tmp -Force
          $root = Get-ChildItem $tmp -Directory | Select-Object -First 1
          if (-not $root) { throw "zipball root not found" }
          Get-ChildItem -LiteralPath $root.FullName -Force | Copy-Item -Destination $env:GITHUB_WORKSPACE -Recurse -Force

      - name: Smoke run (DRY)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference='Stop'
          & "scripts/g5/ak-test.ps1" -Pr "0" -Sha "${{ github.sha }}" -ConfirmApply:$false
