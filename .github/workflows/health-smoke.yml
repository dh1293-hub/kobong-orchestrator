name: Health Smoke (daily)


on:
  schedule:
    - cron: "0 0 * * *"     # 09:00 KST
  workflow_dispatch:
    inputs:
      base5182:
        description: "GHMON base (예: http://203.0.113.10:5182 또는 https://ghmon.example.com)"
        required: false
        default: ""
      base5199:
        description: "GHMON MOCK base (예: http://203.0.113.10:5199)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: health-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ping:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # 입력 비워두면 시크릿으로 폴백 (레포 시크릿에 미리 넣어두면 편함)
      DEF5182: ${{ secrets.GHMON_BASE_5182 }}
      DEF5199: ${{ secrets.GHMON_BASE_5199 }}

    steps:
      # 0) 로컬 액션 부트스트랩 (.github/actions만 전개)
      - name: Bootstrap local actions (no git)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $ref ='${{ github.sha }}'
          $zip = Join-Path $env:RUNNER_TEMP 'repo.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'repo'
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $Headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version"="2022-11-28"
            "User-Agent"="bootstrap-actions"
            Accept="application/vnd.github+json"
          }
          $owner,$name = $repo.Split('/')
          $url = "https://api.github.com/repos/$owner/$name/zipball/$ref"
          Invoke-WebRequest -Uri $url -Headers $Headers -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $root = Get-ChildItem -Directory $tmp | Select-Object -First 1
          $dst  = Join-Path $env:GITHUB_WORKSPACE '.github'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path (Join-Path $root.FullName '.github\actions') -Destination $dst -Recurse -Force
          Remove-Item $zip -Force

      # 1) (옵션) 전개 — 필요시 소스가져오기. 없어도 동작엔 지장 없음
      - uses: ./.github/actions/zip-fetch

      # 2) 헬스 체크 (입력→시크릿 순 폴백)
      # -- BEGIN REPLACE: hosted ping with skip when unset --
      - name: Ping GHMON 5182 / 5199 (hosted)
        if: ${{ (github.event.inputs.base5182 != '' && github.event.inputs.base5199 != '') || (secrets.GHMON_BASE_5182 != '' && secrets.GHMON_BASE_5199 != '') }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          # 우선순위: 입력 > 시크릿
          $in1 = '${{ github.event.inputs.base5182 }}'
          $in2 = '${{ github.event.inputs.base5199 }}'
          $B1  = if ([string]::IsNullOrWhiteSpace($in1)) { '${{ secrets.GHMON_BASE_5182 }}' } else { $in1 }
          $B2  = if ([string]::IsNullOrWhiteSpace($in2)) { '${{ secrets.GHMON_BASE_5199 }}' } else { $in2 }

          function Test-Health($base){
            try { (Invoke-RestMethod "$base/api/ghmon/health" -TimeoutSec 8).ok } catch { $false }
          }
          $ok1 = Test-Health $B1
          $ok2 = Test-Health $B2

          if (-not (Test-Path logs)) { New-Item -ItemType Directory -Force -Path logs | Out-Null }
          "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] 5182=$ok1  5199=$ok2  B1=$B1  B2=$B2" |
            Tee-Object -FilePath "logs/health-smoke.log" -Append

          if (-not ($ok1 -and $ok2)) { Write-Error "health failed"; exit 1 }

      - name: Skip ping (no base URLs provided)
        if: ${{ !((github.event.inputs.base5182 != '' && github.event.inputs.base5199 != '') || (secrets.GHMON_BASE_5182 != '' && secrets.GHMON_BASE_5199 != '')) }}
        run: echo "health-smoke:skipped (no base URLs). Provide inputs or set repo secrets to enable hosted checks."
      # -- END REPLACE --


      # 3) 로그 업로드(유일 이름, 409 방지)
      - uses: ./.github/actions/publish-logs
        if: always()
        with:
          logdir: logs
          name: health-logs
