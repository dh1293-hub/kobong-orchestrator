name: health/smoke

on:
  schedule:
    - cron: "0 0 * * *"     # 09:00 KST
  workflow_dispatch:
    inputs:
      base5182:
        description: "override GHMON base (empty -> http://localhost:5182)"
        required: false
        default: ""
      base5199:
        description: "override GHMON MOCK base (empty -> http://localhost:5199)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: health-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ping:
    runs-on: [self-hosted, ghmon-safe]
    # PR(특히 fork)로는 self-hosted 실행 금지
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # 0) 로컬 액션 부트스트랩 (.github/actions만 전개)
      - name: Bootstrap local actions (no git)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $ref ='${{ github.sha }}'
          $zip = Join-Path $env:RUNNER_TEMP 'repo.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'repo'
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $Headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version"="2022-11-28"
            "User-Agent"="bootstrap-actions"
            Accept="application/vnd.github+json"
          }
          $owner,$name = $repo.Split('/')
          $url = "https://api.github.com/repos/$owner/$name/zipball/$ref"
          Invoke-WebRequest -Uri $url -Headers $Headers -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $root = Get-ChildItem -Directory $tmp | Select-Object -First 1
          $dst  = Join-Path $env:GITHUB_WORKSPACE '.github'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path (Join-Path $root.FullName '.github\actions') -Destination $dst -Recurse -Force
          Remove-Item $zip -Force

      # 1) (옵션) 소스 전개
      - uses: ./.github/actions/zip-fetch
        with:
          ref: ${{ github.sha }}

      # 2) localhost 기본값 해석 (입력 비우면 localhost)
      - name: Resolve base URLs (self-hosted defaults)
        id: bases
        shell: pwsh
        env:
          IN_5182: ${{ github.event.inputs.base5182 }}
          IN_5199: ${{ github.event.inputs.base5199 }}
        run: |
          $b1 = if ([string]::IsNullOrWhiteSpace($env:IN_5182)) { 'http://localhost:5182' } else { $env:IN_5182 }
          $b2 = if ([string]::IsNullOrWhiteSpace($env:IN_5199)) { 'http://localhost:5199' } else { $env:IN_5199 }
          "B1=$b1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "B2=$b2" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # 3) 실제 헬스 체크
      - name: Ping GHMON 5182 / 5199
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $B1='${{ steps.bases.outputs.B1 }}'
          $B2='${{ steps.bases.outputs.B2 }}'
          function Test-Health($base){
            try { (Invoke-RestMethod "$base/api/ghmon/health" -TimeoutSec 8).ok } catch { $false }
          }
          $ok1 = Test-Health $B1
          $ok2 = Test-Health $B2
          if (-not (Test-Path logs)) { New-Item -ItemType Directory -Force -Path logs | Out-Null }
          "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] 5182=$ok1  5199=$ok2  B1=$B1  B2=$B2" |
            Tee-Object -FilePath "logs/health-smoke.log" -Append
          if (-not ($ok1 -and $ok2)) { Write-Error "health failed"; exit 1 }

      # 4) 항상 로그 업로드 (409 방지: 유일 이름)
      - uses: ./.github/actions/publish-logs
        if: always()
        with:
          logdir: logs
          name: health-logs
