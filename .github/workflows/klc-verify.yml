name: KLC Verify

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy KLC disabled. Use 'KLC / Nightly Aggregate v2'."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run KLC verify smoke
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          .\scripts\g5\klc-verify.ps1 -Out "_klc\klc-verify-$env:GITHUB_RUN_ID.log"

      - name: Upload KLC artifact
        uses: actions/upload-artifact@v4
        with:
          name: klc-verify-${{ github.run_id }}
          path: _klc\*.log

