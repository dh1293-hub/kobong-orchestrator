name: Protect / Basic
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
concurrency:
  group: protect-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
