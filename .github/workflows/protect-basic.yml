name: Protect / Basic
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: protect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ✅ 경고만 수집(실패하지 않음). 기존 파일들의 누적 경고 때문에 막히지 않도록.
      - name: actionlint (warn-only)
        uses: docker://rhysd/actionlint:latest
        with:
          # 필요시 특정 경고를 임시 무시할 수 있음(예: shellcheck SC2129)
          args: -ignore 'shellcheck.*SC2129' .github/workflows/*.yml
        continue-on-error: true

      - name: Summary
        run: echo "### Protect / Basic finished (warn-only)" >> $GITHUB_STEP_SUMMARY
