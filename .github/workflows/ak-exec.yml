# =========================================================
# 파일 용도 : PR 코멘트의 /ak 명령(또는 수동 입력)으로 단일 단계 실행
# 동작 방식 : issue_comment(created), 또는 workflow_dispatch(pr/command/rawargs)
# 연관 파일 : scripts/g5/ak-dispatch.ps1
# 안전 가드 : - PR 코드는 zipball로 받고, 실행 스크립트는 main에서 하이드레이트
#             - 명령 파싱은 /ak <cmd> [raw args] 형태
# 산출물    : PR 코멘트(시작/요약), Artifact: ak7-logs
# =========================================================
# DEPRECATED / QUARANTINE STUB
name: AK / Exec (quarantined)
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ak-exec-quarantine
  cancel-in-progress: true

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ak-exec quarantined. Use KLC v2 flows."

      - name: Resolve inputs from event
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pr=${{ inputs.pr }}" >> "$GITHUB_OUTPUT"
            echo "cmd=${{ inputs.command }}" >> "$GITHUB_OUTPUT"
            echo "raw=${{ inputs.rawargs }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body="${{ github.event.comment.body }}"
          # 추출: /ak <cmd> [raw...]
          cmd=$(printf "%s" "$body" | sed -n 's@.*/ak[[:space:]]\+\([a-z0-9-]\+\).*@\1@p')
          raw=$(printf "%s" "$body" | sed -n 's@.*/ak[[:space:]]\+[a-z0-9-]\+\(.*\)@\1@p' | sed 's/^[[:space:]]*//')
          echo "pr=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          echo "cmd=${cmd:-help}" >> "$GITHUB_OUTPUT"
          echo "raw=$raw" >> "$GITHUB_OUTPUT"

      - name: Resolve PR head sha
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = Number('${{ steps.resolve.outputs.pr }}');
            const {data} = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr
            });
            core.setOutput('sha', data.head.sha);

      # === PR 소스: zipball로 전개 ===
      - name: Download PR source zipball
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA:  ${{ steps.pr.outputs.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'src.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'src-unzip'
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "X-GitHub-Api-Version"="2022-11-28" }
          $url = "https://api.github.com/repos/$env:REPO/zipball/$env:SHA"
          Invoke-WebRequest -Headers $headers -Uri $url -OutFile $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($zip,$tmp)
          $root = Get-ChildItem $tmp | ?{ $_.PSIsContainer } | Select-Object -First 1
          Get-ChildItem -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Force $root.FullName | Copy-Item -Recurse -Force -Destination .

      # === 실행 스크립트: main에서 하이드레이트 ===
      - name: Hydrate scripts/g5 from main via zipball
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'g5.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'g5-unzip'
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "X-GitHub-Api-Version"="2022-11-28" }
          $url = "https://api.github.com/repos/$env:REPO/zipball/main"
          Invoke-WebRequest -Headers $headers -Uri $url -OutFile $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($zip,$tmp)
          $root = Get-ChildItem $tmp | ?{ $_.PSIsContainer } | Select-Object -First 1
          Remove-Item -Recurse -Force scripts/g5 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force scripts | Out-Null
          Copy-Item -Recurse -Force "$($root.FullName)/scripts/g5" "scripts/g5"

      - name: Ensure logs exist
        shell: bash
        run: |
          mkdir -p logs
          [ -s logs/ak7.jsonl ] || printf '{"ts":"%s","lvl":"INFO","msg":"init"}\n' "$(date -Iseconds)" >> logs/ak7.jsonl

      - name: Dispatch /ak command
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $cmd = '${{ steps.resolve.outputs.cmd }}'
          $raw = '${{ steps.resolve.outputs.raw }}'
          $pr  = '${{ steps.resolve.outputs.pr }}'
          ./scripts/g5/ak-dispatch.ps1 -Command $cmd -RawArgs $raw -Pr $pr

      - name: Upload ak logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ak7-logs
          path: logs/ak7.jsonl
          if-no-files-found: ignore
          retention-days: 7

      - name: Post result to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = Number('${{ steps.resolve.outputs.pr }}');
            const {owner, repo} = context.repo;
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `✅ /ak **${{ steps.resolve.outputs.cmd }}** run finished\n\nRun: ${url}`;
            await github.rest.issues.createComment({owner, repo, issue_number: pr, body});
