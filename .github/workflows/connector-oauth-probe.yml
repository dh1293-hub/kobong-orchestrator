# ============================================================
# Connector OAuth Probe — GitHub/ChatGPT OAuth 토큰 상태 자가진단
# 목적:
#   - GITHUB_TOKEN(워크플로 기본 토큰)과 선택적 CHATGPT_OAUTH_TOKEN의
#     Private 리포 읽기 가능 여부를 API로 점검하고 _inventory에 리포트 생성
# 사용법:
#   - (선택) 리포 시크릿: CHATGPT_OAUTH_TOKEN  설정 시 ChatGPT OAuth도 검사
#   - Actions → Run workflow → path_to_check 입력 후 실행
# 산출:
#   - _inventory/connector-status/summary.json, status.md  + 아티팩트
# 주의:
#   - YAML 파서 오류 방지: 모든 스크립트는 run: | 블록, heredoc은 단일-인용(<<'EOF')
# ============================================================
name: connector/oauth-probe

on:
  workflow_dispatch:
    inputs:
      path_to_check:
        description: "Private 읽기 시험 경로(예: .github/workflows)"
        required: true
        default: ".github/workflows"
        type: string

permissions:
  contents: read

concurrency:
  group: oauth-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPO: ${{ github.repository }}
      GH_BASIC: ${{ github.token }}
      CHATGPT_OAUTH_TOKEN: ${{ secrets.CHATGPT_OAUTH_TOKEN }}

    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 1) API 호출은 bash에서 수행해 ENV로만 전달 (파이썬엔 텍스트만 넘김)
      - name: Call APIs (HEAD/GET)
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          repo="${REPO}"
          path="${{ inputs.path_to_check }}"
          api="https://api.github.com"

          http_head() { curl -fsSLI -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $1" -H "X-GitHub-Api-Version: 2022-11-28" "$2" || true; }
          http_get()  { curl -fsSL  -H "Authorization: Bearer $1" -H "X-GitHub-Api-Version: 2022-11-28" "$2" || true; }

          gt_viewer="$(curl -fsSL -X POST -H "Authorization: Bearer ${GH_BASIC}" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" "${api}/graphql" --data '{"query":"{ viewer { login } }"}' || true)"
          gt_repo="$(http_get "${GH_BASIC}" "${api}/repos/${repo}")"
          gt_contents_code="$(http_head "${GH_BASIC}" "${api}/repos/${repo}/contents/${path}")"

          ct_user=""; ct_repo=""; ct_contents_code=""
          if [ -n "${CHATGPT_OAUTH_TOKEN:-}" ]; then
            ct_user="$(http_get "${CHATGPT_OAUTH_TOKEN}" "${api}/user")"
            ct_repo="$(http_get "${CHATGPT_OAUTH_TOKEN}" "${api}/repos/${repo}")"
            ct_contents_code="$(http_head "${CHATGPT_OAUTH_TOKEN}" "${api}/repos/${repo}/contents/${path}")"
          fi

          echo "repo=$repo"                       >> "$GITHUB_ENV"
          echo "path_to_check=$path"              >> "$GITHUB_ENV"
          printf 'gt_viewer_json<<__E__\n%s\n__E__\n' "$gt_viewer" >> "$GITHUB_ENV"
          printf 'gt_repo_json<<__E__\n%s\n__E__\n'   "$gt_repo"   >> "$GITHUB_ENV"
          echo "gt_contents_code=$gt_contents_code" >> "$GITHUB_ENV"
          printf 'ct_user_json<<__E__\n%s\n__E__\n'  "$ct_user"    >> "$GITHUB_ENV"
          printf 'ct_repo_json<<__E__\n%s\n__E__\n'  "$ct_repo"    >> "$GITHUB_ENV"
          echo "ct_contents_code=$ct_contents_code"  >> "$GITHUB_ENV"
          echo "has_chatgpt_token=$([ -n "${CHATGPT_OAUTH_TOKEN:-}" ] && echo true || echo false)" >> "$GITHUB_ENV"

      # 2) summary.json 생성 — heredoc 없이 순수 Python 셸
      - name: Build summary.json
        shell: python
        run: |
          import json, os, pathlib
          def safe_load(s):
              try:
                  return json.loads(s) if s else {}
              except Exception:
                  return {}
          outdir = pathlib.Path("_inventory/connector-status")
          outdir.mkdir(parents=True, exist_ok=True)
          summary = {
              "repo": os.environ.get("repo"),
              "path_checked": os.environ.get("path_to_check"),
              "github_token": {
                  "viewer_login": safe_load(os.environ.get("gt_viewer_json")).get("data",{}).get("viewer",{}).get("login"),
                  "repo_known":   bool(safe_load(os.environ.get("gt_repo_json"))),
                  "contents_head_code": os.environ.get("gt_contents_code"),
              },
              "chatgpt_oauth_token": {
                  "present": os.environ.get("has_chatgpt_token") == "true",
                  "user_login": safe_load(os.environ.get("ct_user_json")).get("login"),
                  "repo_known": bool(safe_load(os.environ.get("ct_repo_json"))),
                  "contents_head_code": os.environ.get("ct_contents_code"),
              },
          }
          (outdir / "summary.json").write_text(json.dumps(summary), encoding="utf-8")

      # 3) status.md 생성 — 역시 순수 Python 셸
      - name: Build status.md
        shell: python
        run: |
          import json, pathlib
          p = pathlib.Path("_inventory/connector-status/summary.json")
          s = json.loads(p.read_text(encoding="utf-8"))
          gt = s["github_token"]; ct = s["chatgpt_oauth_token"]
          md = []
          md += ["# Connector OAuth Probe"]
          md += [f"- repo: {s['repo']}"]
          md += [f"- path_checked: {s['path_checked']}"]
          md += ["", "## GITHUB_TOKEN"]
          md += [f"- viewer_login: {gt.get('viewer_login')}"]
          md += [f"- contents HEAD: {gt.get('contents_head_code')}"]
          md += ["", "## CHATGPT_OAUTH_TOKEN"]
          md += [f"- present: {ct.get('present')}"]
          md += [f"- user_login: {ct.get('user_login')}"]
          md += [f"- contents HEAD: {ct.get('contents_head_code')}"]
          pathlib.Path("_inventory/connector-status/status.md").write_text("\n".join(md), encoding="utf-8")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: connector-status-${{ github.run_id }}
          path: _inventory/connector-status
          if-no-files-found: error
