# ============================================================
# Connector OAuth Probe — ChatGPT ↔ GitHub 커넥터/토큰 상태 자가진단
# 목적:
#   - (선택) CHATGPT_OAUTH_TOKEN 이 제공되면, 해당 토큰으로 Private 리포 읽기 가능 여부 검사
#   - GITHUB_TOKEN(워크플로 기본 토큰)의 권한·제한도 함께 리포트
# 산출:
#   - _inventory/connector-status/summary.json, status.md 로 결과 저장
# 사용법:
#   1) 레포 시크릿 설정 (선택): CHATGPT_OAUTH_TOKEN = ChatGPT 커넥터가 발급한 OAuth 토큰
#      - 없으면 ChatGPT 토큰 검사는 건너뜀(레포 기본 토큰만 보고)
#   2) Actions → Run workflow (workflow_dispatch) 실행
#   3) 결과는 아티팩트 + _inventory/connector-status/* 로 남고, 원하면 자동 PR로 반영
# ============================================================
name: connector/oauth-probe

on:
  workflow_dispatch:
    inputs:
      path_to_check:
        description: "Private 읽기 시험 경로(예: .github/workflows)"
        required: true
        default: ".github/workflows"
        type: string

permissions:
  contents: write       # _inventory 커밋/PR 위해 필요
  pull-requests: write

concurrency:
  group: oauth-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPO: ${{ github.repository }}
      GH_BASIC: ${{ github.token }}
      CHATGPT_OAUTH_TOKEN: ${{ secrets.CHATGPT_OAUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Run probes
        id: run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _inventory/connector-status

          repo="${REPO}"
          path="${{ inputs.path_to_check }}"
          api="https://api.github.com"

          j() { python3 - <<'PY' "$@"; }
          # --- helper: HEAD/GET with token ---
          http_head() { curl -fsSLI -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $1" -H "X-GitHub-Api-Version: 2022-11-28" "$2" || true; }
          http_get()  { curl -fsSL -H "Authorization: Bearer $1" -H "X-GitHub-Api-Version: 2022-11-28" "$2" || true; }

          # ========== 1) GITHUB_TOKEN(레포 토큰) 측정 ==========
          gt_viewer=$(curl -fsSL -X POST -H "Authorization: Bearer ${GH_BASIC}" -H "X-GitHub-Api-Version: 2022-11-28" \
                       -H "Content-Type: application/json" "${api}/graphql" \
                       --data '{"query":"{ viewer { login } }"}' || true)
          gt_repo=$(http_get "${GH_BASIC}" "${api}/repos/${repo}")
          gt_contents_code=$(http_head "${GH_BASIC}" "${api}/repos/${repo}/contents/${path}")

          # ========== 2) CHATGPT_OAUTH_TOKEN(선택) 측정 ==========
          ct_user=""; ct_repo=""; ct_contents_code=""
          if [[ -n "${CHATGPT_OAUTH_TOKEN:-}" ]]; then
            ct_user=$(http_get "${CHATGPT_OAUTH_TOKEN}" "${api}/user")
            ct_repo=$(http_get "${CHATGPT_OAUTH_TOKEN}" "${api}/repos/${repo}")
            ct_contents_code=$(http_head "${CHATGPT_OAUTH_TOKEN}" "${api}/repos/${repo}/contents/${path}")
          fi

          # ========== 3) 요약 JSON 생성 ==========
          j > _inventory/connector-status/summary.json <<PY
import json, sys
gt_viewer = json.loads('''${gt_viewer}''') if ${#gt_viewer:-0} else {}
gt_repo   = json.loads('''${gt_repo}''')   if ${#gt_repo:-0}   else {}
ct_user   = json.loads('''${ct_user}''')   if ${#ct_user:-0}   else {}
ct_repo   = json.loads('''${ct_repo}''')   if ${#ct_repo:-0}   else {}
summary = {
  "repo": "${repo}",
  "path_checked": "${path}",
  "github_token": {
    "viewer_login": gt_viewer.get("data",{}).get("viewer",{}).get("login"),
    "repo_visibility": gt_repo.get("private"),
    "contents_head_code": "${gt_contents_code}"
  },
  "chatgpt_oauth_token": {
    "present": ${'true' if '${CHATGPT_OAUTH_TOKEN:-}' else 'false'},
    "user_login": ct_user.get("login") if isinstance(ct_user, dict) else None,
    "repo_visibility": ct_repo.get("private") if isinstance(ct_repo, dict) else None,
    "contents_head_code": "${ct_contents_code}"
  }
}
print(json.dumps(summary))
PY

          # 사람 눈용 요약
          python3 - <<'PY' "_inventory/connector-status/summary.json" > _inventory/connector-status/status.md
import sys, json, pathlib
s = json.loads(pathlib.Path(sys.argv[1]).read_text())
def line(k,v): print(f"- {k}: {v}")
print("# Connector OAuth Probe")
line("repo", s["repo"])
line("path_checked", s["path_checked"])
gt = s["github_token"]; ct = s["chatgpt_oauth_token"]
print("\n## GITHUB_TOKEN")
line("viewer_login", gt.get("viewer_login"))
line("repo.private", gt.get("repo_visibility"))
line("contents HEAD", gt.get("contents_head_code"))
print("\n## CHATGPT_OAUTH_TOKEN")
line("present", ct.get("present"))
line("user_login", ct.get("user_login"))
line("repo.private", ct.get("repo_visibility"))
line("contents HEAD", ct.get("contents_head_code"))
PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: connector-status-${{ github.run_id }}
          path: _inventory/connector-status
          if-no-files-found: error

  publish:
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/download-artifact@v4
        with:
          path: _inventory/_ci_artifacts
          merge-multiple: true
          pattern: connector-status-*
      - name: Stage & dedupe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _inventory
          rsync -a _inventory/_ci_artifacts/ _inventory/
          rm -rf _inventory/_ci_artifacts
          find _inventory -maxdepth 2 -type f -print
      - name: Commit & PR (inventory only)
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        shell: bash
        run: |
          set -e
          git config user.name  "connector-probe-bot"
          git config user.email "connector-probe-bot@users.noreply.github.com"
          branch="bot/connector-probe-${{ github.run_id }}"
          git checkout -b "$branch"
          git add -f _inventory/*
          git diff --cached --quiet && { echo "No changes → skip PR."; exit 0; }
          git commit -m "[PROBE] connector status snapshot (run=${{ github.run_id }})"
          git push origin "$branch"
          base="${GITHUB_BASE_REF:-${{ github.event.repository.default_branch || 'main' }}}"
          gh pr create --base "$base" --head "$branch" --title "[PROBE] connector status ${{ github.run_id }}" --body "자동 생성된 커넥터 상태 보고서(_inventory/connector-status)."
          # auto-merge는 정책 허용 시 수동/자동 선택
