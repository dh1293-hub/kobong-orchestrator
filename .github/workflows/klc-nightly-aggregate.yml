name: KLC Nightly Aggregate

on:
  schedule:
    - cron: '0 15 * * *'   # 매일 00:00 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klc-nightly-aggregate
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Download source (zipball) to workspace
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA:  ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'src.zip'
          $dst = Join-Path $env:RUNNER_TEMP 'src-unzip'
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28" }
          $url = "https://api.github.com/repos/$env:REPO/zipball/$env:SHA"
          Invoke-WebRequest -Headers $headers -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $root = Get-ChildItem -Path $dst | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          "SRC_DIR=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Aggregate KLC
        shell: pwsh
        working-directory: ${{ env.SRC_DIR }}
        run: ./scripts/g5/klc-aggregate.ps1 -Mode nightly -Root "${{ env.SRC_DIR }}"
