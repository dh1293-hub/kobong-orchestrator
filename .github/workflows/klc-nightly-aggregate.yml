name: KLC Nightly Aggregate

on:
  schedule:
    - cron: '0 15 * * *'   # 매일 00:00 KST (UTC+9) 기준
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klc-nightly-aggregate
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aggregate KLC
        shell: pwsh
        run: ./scripts/g5/klc-aggregate.ps1 -Mode nightly
