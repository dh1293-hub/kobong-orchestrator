# 파일: .github/workflows/wf-allround-tester.yml
# 목적: 저장소의 "등록된 워크플로"를 자동 수집하고(dispatch/PR/댓글) 스모크 테스트 후
#       결과(MD/CSV/JSON)를 아티팩트로 남기며, _inventory로 반영하는 PR을 자동 생성한다.
# 트리거:
#   - 수동: workflow_dispatch (옵션 플래그)
#   - 자동: .github/workflows/** 경로에 변경(push/pr) 발생 시 전체 테스터 실행
# 보안/가드:
#   - permissions 최소화 + publish에서만 write 사용
#   - concurrency로 중복 실행 방지
#   - 각 잡은 github-actions[bot]이 푸시한 이벤트에서는 동작하지 않음(루프 방지)
# 사용 팁:
#   - PowerShell 스위치에는 $true/$false가 필요 → -Switch:$${{ inputs.flag }} 형태로 전달
# 산출물:
#   - _inventory/workflows.csv|json (인벤토리)
#   - _inventory/wf-allround/*-summary.md / *.csv / *.json (스모크 요약)
#   - 위 산출물을 모아 자동 PR 생성 (bot/wf-inventory-<run_id>)

name: WF Allround Tester

on:
  workflow_dispatch:
    inputs:
      test_pr:
        description: "PR 트리거 스모크(드래프트 PR)"
        type: boolean
        default: true
      test_comment:
        description: "댓글(/ak) 스모크"
        type: boolean
        default: true
      test_dispatch:
        description: "workflow_dispatch 스모크"
        type: boolean
        default: true
      keep_pr:
        description: "테스트 PR/브랜치를 보존할지 여부"
        type: boolean
        default: false
      mode:
        description: "집계 강도 (quick|full)"
        required: false
        default: "quick"

  # 새 워크플로가 추가/수정되면 자동으로 테스터 실행
  push:
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  actions: write
  contents: write          # publish 잡에서 커밋/푸시 필요
  pull-requests: write     # PR 생성/코멘트
  checks: read
  statuses: read

concurrency:
  group: wf-allround-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    name: Build workflows inventory
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build workflows inventory (_inventory/workflows.*)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pwsh -NoProfile -File scripts/g5/wf-inventory.ps1 `
            -Repo "${{ github.repository }}" `
            -Ref  "${{ github.ref_name }}"

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: wf-inventory
          path: |
            _inventory/workflows.csv
            _inventory/workflows.json
          if-no-files-found: error

  smoke:
    name: Run smoke (dispatch / PR / comment)
    if: github.actor != 'github-actions[bot]'
    needs: [inventory]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger allround tester (safe)
        id: trigger
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pwsh -NoProfile -File scripts/g5/wf-allround-tester.ps1 `
            -Repo "${{ github.repository }}" `
            -TestDispatch:$${{ inputs.test_dispatch }} `
            -TestPR:$${{ inputs.test_pr }} `
            -TestIssueComment:$${{ inputs.test_comment }} `
            -KeepPr:$${{ inputs.keep_pr }}

      # PR 기반 집계는 PR이 있을 때만 수행(0일 경우 스킵)
      - name: Collect runs & checks
        if: ${{ steps.trigger.outputs.pr_number && steps.trigger.outputs.pr_number != '0' }}
        id: collect
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pwsh -NoProfile -File scripts/g5/AllRound-WF-Tester.ps1 `
            -PrNumber ${{ steps.trigger.outputs.pr_number }} `
            -Branch   "${{ steps.trigger.outputs.branch }}" `
            -Mode     "${{ inputs.mode }}"

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wf-allround-report-${{ steps.trigger.outputs.ts }}
          path: |
            _inventory/wf-allround/*.md
            _inventory/wf-allround/*.csv
            _inventory/wf-allround/*.json
          if-no-files-found: warn

      - name: Comment summary to PR
        if: ${{ always() && steps.trigger.outputs.pr_number && steps.trigger.outputs.pr_number != '0' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $md = Get-ChildItem _inventory/wf-allround/*-summary.md -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime | Select-Object -Last 1
          if ($md) { gh pr comment ${{ steps.trigger.outputs.pr_number }} --body-file $md.FullName }

      - name: Auto tidy (close PR & delete branch)
        if: ${{ always() && steps.trigger.outputs.pr_number && steps.trigger.outputs.pr_number != '0' && inputs.keep_pr == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr close ${{ steps.trigger.outputs.pr_number }} --delete-branch

  publish:
    name: Publish _inventory via PR
    if: always()
    needs: [inventory, smoke]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: _inventory/_ci_artifacts
          merge-multiple: true

      - name: Stage _inventory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _inventory | Out-Null
          if (Test-Path _inventory/_ci_artifacts) {
            Copy-Item -Recurse -Force _inventory/_ci_artifacts/* _inventory/ 2>$null
            Write-Host "Artifacts staged to _inventory"
          } else {
            Write-Host "No artifacts to stage (previous jobs produced none)."
          }

      - name: Commit & open PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "wf-allround-bot"
          git config user.email "wf-allround-bot@users.noreply.github.com"

          $branch = "bot/wf-inventory-${{ github.run_id }}"
          git checkout -b $branch

          git add -f _inventory/*      # .gitignore 무시하고 강제 추가
          if (git diff --cached --quiet) {
            Write-Host "No changes in _inventory → skip PR."
            exit 0
          }

          git commit -m "[WF-TEST] _inventory snapshot (run=${{ github.run_id }})"
          git push origin $branch

          $base = gh repo view --json defaultBranchRef -q .defaultBranchRef.name
          gh pr create --base $base --head $branch `
            --title "[WF-TEST] _inventory snapshot ${{ github.run_id }}" `
            --body  "WF Allround Tester가 생성한 인벤토리/리포트를 자동 반영합니다."
