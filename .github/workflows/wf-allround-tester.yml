# 파일: .github/workflows/wf-allround-tester.yml
# 목적: 저장소 내 워크플로를 전수 수집(인벤토리) → 안전 스모크(Dispatch/PR/댓글) → 결과 요약(MD/CSV/JSON) →
#       _inventory 반영용 PR 자동생성까지 원샷으로 수행.
# 트리거:
#   - 수동: workflow_dispatch (옵션 플래그)
#   - 자동: .github/workflows/** 변경 시(push/pr) 실행
# 보안/가드:
#   - permissions 최소화(필요 범위만 write)
#   - concurrency 중복 실행 방지
#   - github-actions[bot] 루프 방지(if)
# YAML 작성 규칙:
#   - 탭(\t) 금지, 들여쓰기는 스페이스 2칸
#   - 셸 스크립트는 반드시 run: | (블록 스칼라) 사용
#   - run: | 아래의 #은 PowerShell 주석(실행되지 않음)

name: WF Allround Tester

on:
  workflow_dispatch:
    inputs:
      test_pr:
        description: "PR 트리거 스모크(드래프트 PR)"
        type: boolean
        default: true
      test_comment:
        description: "댓글(/ak) 스모크"
        type: boolean
        default: true
      test_dispatch:
        description: "workflow_dispatch 스모크"
        type: boolean
        default: true
      keep_pr:
        description: "테스트 PR/브랜치 보존"
        type: boolean
        default: false
      mode:
        description: "집계 강도 (quick|full)"
        default: "quick"
  push:
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: wf-allround-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:                      # ← job ID (jobs 바로 아래 2칸)
    name: Build workflows inventory
    runs-on: windows-latest       # ← job에는 runs-on (또는 uses) 필수
    steps:                        # ← steps 키 아래에 리스트로 스텝들
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Build workflows inventory (_inventory/workflows.*)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/g5/wf-inventory.ps1 `
            -Repo "${{ github.repository }}" `
            -Ref  "${{ github.head_ref || github.ref_name }}"

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: wf-inventory
          path: |
            _inventory/workflows.csv
            _inventory/workflows.json
          if-no-files-found: error

  smoke:                          # ← inventory와 같은 레벨(형제)
    name: Run smoke (dispatch / PR / comment)
    needs: inventory
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger allround tester (safe)
        id: trigger
        shell: pwsh
        env:
          GH_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          TEST_DISPATCH: ${{ inputs.test_dispatch }}
          TEST_PR:       ${{ inputs.test_pr }}
          TEST_COMMENT:  ${{ inputs.test_comment }}
          KEEP_PR:       ${{ inputs.keep_pr }}
        run: |
          $params = @{
            Repo             = "${{ github.repository }}"
            TestDispatch     = ($env:TEST_DISPATCH -ieq 'true')
            TestPR           = ($env:TEST_PR -ieq 'true')
            TestIssueComment = ($env:TEST_COMMENT -ieq 'true')
            KeepPr           = ($env:KEEP_PR -ieq 'true')
          }
          ./scripts/g5/wf-allround-tester.ps1 @params

      - name: Collect runs & checks (inline)
        if: ${{ steps.trigger.outputs.pr_number && steps.trigger.outputs.pr_number != '0' }}
        id: collect
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo   = "${{ github.repository }}"
          $prNum  = [int]"${{ steps.trigger.outputs.pr_number }}"
          $branch = "${{ steps.trigger.outputs.branch }}"
      
          # PR 최신 커밋과 체크 결과 수집
          $json = gh pr view $prNum -R $repo --json number,headRefName,headRefOid,mergeable,statusCheckRollup
          $o = $json | ConvertFrom-Json
          $checks = @($o.statusCheckRollup)
      
          $ok   = ($checks | Where-Object { $_.state -eq 'SUCCESS' }).Count
          $fail = ($checks | Where-Object { $_.state -in @('FAILURE','ERROR','CANCELLED','TIMED_OUT') }).Count
          $pend = ($checks | Where-Object { $_.state -in @('PENDING','IN_PROGRESS','QUEUED') }).Count
      
          New-Item -ItemType Directory -Force -Path _inventory/wf-allround | Out-Null
          $md = @()
          $md += "# WF Allround Smoke Result"
          $md += ""
          $md += "* PR: #$($o.number) (branch `$branch`)"
          $md += "* Commit: $($o.headRefOid)"
          $md += "* Checks: success=$ok, pending=$pend, failed=$fail"
          $md += ""
          foreach ($c in $checks) {
            $md += "- **$($c.name)** : $($c.state)"
          }
          $out = "_inventory/wf-allround/${{ github.run_id }}-summary.md"
          $md -join "`n" | Set-Content -Path $out -Encoding utf8
          Write-Host "Wrote $out"

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wf-allround-report-${{ steps.trigger.outputs.ts }}
          path: |
            _inventory/wf-allround/*.md
            _inventory/wf-allround/*.csv
            _inventory/wf-allround/*.json
          if-no-files-found: warn

      - name: Comment summary to PR
        if: ${{ always() && steps.trigger.outputs.pr_number && steps.trigger.outputs.pr_number != '0' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $md = Get-ChildItem _inventory/wf-allround/*-summary.md -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime | Select-Object -Last 1
          if ($md) { gh pr comment ${{ steps.trigger.outputs.pr_number }} --body-file $md.FullName }

      - name: Auto tidy (close PR & delete branch)
        if: ${{ always() && steps.trigger.outputs.pr_number && steps.trigger.outputs.pr_number != '0' && inputs.keep_pr == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $pr = [int]"${{ steps.trigger.outputs.pr_number }}"
          gh pr close $pr --delete-branch -R "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "PR close or branch delete failed (likely rate-limit/permission). Keeping PR/branch for inspection."
            exit 0
          }


  publish:                        # ← inventory/smoke와 같은 레벨
    name: Publish _inventory via PR
    needs: [inventory, smoke]
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: _inventory/_ci_artifacts
          merge-multiple: true

      - name: Stage _inventory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _inventory | Out-Null
          if (Test-Path _inventory/_ci_artifacts) {
            Copy-Item -Recurse -Force _inventory/_ci_artifacts/* _inventory/ 2>$null
          } else {
            Write-Host "No artifacts to stage."
          }

# ... (Stage _inventory 까지는 그대로)

      - name: Commit & open PR
        id: openpr
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name  "wf-allround-bot"
          git config user.email "wf-allround-bot@users.noreply.github.com"
      
          $branch = "bot/wf-inventory-${{ github.run_id }}"
          git checkout -b $branch
      
          git add -f _inventory/*
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "No changes in _inventory → skip PR."; exit 0 }
      
          git commit -m "[WF] _inventory snapshot (run=${{ github.run_id }})"
          git push origin $branch
      
          $base = gh repo view --json defaultBranchRef -q .defaultBranchRef.name
      
          # NOTE: gh pr create 은 --json/-q 미지원 → URL 파싱 또는 후조회로 번호 구함
          $out = gh pr create --base $base --head $branch `
                  --title "[WF] _inventory snapshot ${{ github.run_id }}" `
                  --body  "자동 반영(_inventory/*)"
      
          if ($LASTEXITCODE -ne 0) { throw "gh pr create failed: $out" }
      
          # 1차: 생성 출력의 URL에서 번호 추출
          $pr = $null
          if ($out -match '/pull/(\d+)') { $pr = $Matches[1] }
      
          # 2차: 못 찾으면 head 브랜치로 조회
          if (-not $pr) {
            $pr = gh pr view --head $branch --json number -q .number
          }
      
          if (-not $pr) { throw "Failed to obtain PR number. Output:`n$out" }
      
          "pr=$pr" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Opened PR #$pr"

      
      - name: Enable auto-merge (squash) if safe
        if: ${{ steps.openpr.outputs.pr }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pr = [int]"${{ steps.openpr.outputs.pr }}"
          # 변경 파일이 _inventory/ 이하인지 검사 (보수적으로)
          $files = gh pr view $pr --json files -q ".files[].path"
          if ($files | Where-Object { $_ -notmatch '^_inventory/' }) {
            Write-Host "Skip automerge: non-inventory changes detected."
            exit 0
          }
          # 라벨로 가드(원하면 주석 해제)
          # gh pr edit $pr --add-label "auto-inventory"
      
          # 승인 필요 없다면 바로 auto-merge 대기 상태 진입, 필요하면 승인 후 자동 머지
          gh pr merge $pr --squash --auto
          Write-Host "Auto-merge enabled for PR #$pr"


