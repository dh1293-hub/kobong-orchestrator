# 친절한 머리 주석:
# 목적: 저장소 내 모든 워크플로를 자동으로 수집하고, 안전한 범위부터 스모크(Dispatch/PR/댓글) 실행
# 보안: 최소 권한, concurrency, 라벨/드래프트 PR로 격리. 위험 액션은 모듈 /health OK일 때만.
name: WF Allround Tester

on:
  workflow_dispatch:
    inputs:
      test_pr:        {type: boolean, default: true,  description: "PR 트리거 스모크(드래프트)"}
      test_comment:   {type: boolean, default: true,  description: "댓글(/ak) 스모크"}
      test_dispatch:  {type: boolean, default: true,  description: "workflow_dispatch 스모크"}

permissions:
  actions: write
  contents: read

concurrency:
  group: wf-allround-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build workflows inventory (_inventory/workflows.*)
        shell: pwsh
        run: |
          pwsh -File scripts/g5/wf-inventory.ps1 -Repo "${{ github.repository }}" -Ref "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with: { name: wf-inventory, path: _inventory/workflows.* }

  smoke:
    needs: [inventory]
    if: ${{ inputs.test_dispatch || inputs.test_pr || inputs.test_comment }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run allround tester (safe)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pwsh -File scripts/g5/wf-allround-tester.ps1 `
            -Repo "${{ github.repository }}" `
            -TestDispatch:$${{ inputs.test_dispatch }} `
            -TestPR:$${{ inputs.test_pr }} `
            -TestIssueComment:$${{ inputs.test_comment }}
