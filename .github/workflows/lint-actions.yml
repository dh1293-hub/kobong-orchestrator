# .github/workflows/lint-actions.yml
name: Lint GitHub Actions
on:
  pull_request:
  push:
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: devops-actions/actionlint@v1
        with:
          args: -color
