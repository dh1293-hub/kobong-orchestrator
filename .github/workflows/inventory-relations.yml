# .github/workflows/inventory-relations.yml
# 목적(WHAT):
#   - 리포지토리 파일 "연관 관계"를 스캔해 _inventory 산출물 생성/PR 반영
#   - 최초 1회는 전체 수집(Full), 이후는 변경분(Incremental) 갱신
#
# 용도(WHY):
#   - 영향 범위 파악, 리팩토링 후보 탐색, 리뷰 가이드 강화
#
# 연관 파일(RELATED):
#   - scripts/g5/Build-Relations.ps1   # 스캐너(정규식 1차판)
#   - _inventory/relations.csv         # 엣지 목록(소스/관계/타깃/탐지기/신뢰도)
#   - _inventory/graph.json            # 그래프 JSON
#   - _inventory/graph.mermaid.md      # 미리보기(100엣지 제한)
#   - _inventory/index.json            # 메타(시각/노드/엣지/모드)
#
# 출력(OUTPUTS):
#   - Job Summary: 요약 + Mermaid
#   - Artifact: inventory-relations
#   - PR: chore/inventory-relations-update (메인 직접 변경 없음)
#
# 안전 가드(SAFETY):
#   - paths-ignore: _inventory/**  (자기 변경 루프 방지)
#   - concurrency: ref 단일 실행
#   - 마지막에 $LASTEXITCODE=0/exit 0 보장 → "Decide scan mode" 단계 실패 방지
#
# 테스트 방법(TEST):
#   - 로컬: act -n -j build-relations
#   - 원격: gh workflow run inventory-relations.yml --ref <브랜치>
#   - 정적검사: actionlint (필수)
#
name: inventory-relations

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch/sha)'
        default: 'main'
      full:
        description: 'Full scan (false면 변경만 시도; zipball이면 내부적으로 전체)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: inventory-relations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      INVENTORY_DIR: ${{ github.workspace }}\src\_inventory   # ✅ 여기로 강제


    steps:
      - name: Download source (zipball) to ./src
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA:  ${{ inputs.ref }}
        run: |
          $ErrorActionPreference='Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'src.zip'
          $dst = Join-Path $env:GITHUB_WORKSPACE 'src'
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          $url = "https://api.github.com/repos/$env:REPO/zipball/$env:SHA"
          $hdr = @{ Authorization = "token $env:GH_TOKEN"; 'User-Agent'='inventory-relations' }
          Invoke-WebRequest -Uri $url -Headers $hdr -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dst -Force

          # zipball 최상단 임시 폴더 → 실제 루트로 평탄화
          $inner = Get-ChildItem -Path $dst | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          if ($null -ne $inner) {
            Get-ChildItem -Path $inner.FullName -Force | Move-Item -Destination $dst -Force
            Remove-Item -Recurse -Force $inner.FullName
          }

      - name: Sanity check (tree & script exists)
        shell: pwsh
        working-directory: src
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "== Top-level tree =="
          Get-ChildItem -Force | Select-Object Mode,Length,Name | Format-Table -AutoSize
          if (-not (Test-Path 'scripts/g5/Build-Relations.ps1')) {
            throw "scripts/g5/Build-Relations.ps1 not found (working-directory=src)."
          }

      - name: Static parse (PowerShell AST)
        shell: pwsh
        working-directory: src
        run: |
          $p = 'scripts/g5/Build-Relations.ps1'
          $null = $tokens = $errs = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $p), [ref]$tokens, [ref]$errs
          )
          if ($errs) {
            $lines = Get-Content -Path $p
            foreach ($e in $errs) {
              $l1 = $e.Extent.StartLineNumber; $c1 = $e.Extent.StartColumnNumber; $l2 = $e.Extent.EndLineNumber
              Write-Host ("{0}:{1}  {2}" -f $l1,$c1,$e.Message)
              $from = [Math]::Max($l1-3,1); $to = [Math]::Min($l2+3,$lines.Count)
              "----- context $from..$to -----"
              for ($i=$from; $i -le $to; $i++) { '{0,5} {1}' -f $i, $lines[$i-1] }
              "-------------------------------"
            }
            throw "Parse errors found."
          } else { Write-Host "No parse errors." }

      - name: Build relations (FULL / CHANGED)
        shell: pwsh
        working-directory: src
        env:
          WANT_FULL: ${{ inputs.full }}
        run: |
          $ErrorActionPreference='Stop'
          $full = ($env:WANT_FULL -eq 'true')
          if ($full) { & pwsh -NoProfile -File scripts/g5/Build-Relations.ps1 }
          else       { & pwsh -NoProfile -File scripts/g5/Build-Relations.ps1 -ChangedOnly }
          if ($LASTEXITCODE -ne 0) { throw "Build-Relations.ps1 exit=$LASTEXITCODE" }

      - name: Build relations (FULL / CHANGED)
        shell: pwsh
        working-directory: src
        env:
          WANT_FULL: ${{ inputs.full }}
          INVENTORY_DIR: ${{ env.INVENTORY_DIR }}   # ✅ 전달
        run: |
          $ErrorActionPreference='Stop'
          $full = ($env:WANT_FULL -eq 'true')
          if ($full) {
            & pwsh -NoProfile -File scripts/g5/Build-Relations.ps1   # 스크립트가 ENV를 읽음
          } else {
            & pwsh -NoProfile -File scripts/g5/Build-Relations.ps1 -ChangedOnly
          }
          if ($LASTEXITCODE -ne 0) { throw "Build-Relations.ps1 exit=$LASTEXITCODE" }
      
      - name: Job summary (counts + Mermaid preview)
        if: always()
        shell: pwsh
        working-directory: src
        env:
          INVENTORY_DIR: ${{ env.INVENTORY_DIR }}
        run: |
          $s = @()
          $s += "## build-relations summary"
          $inv = $env:INVENTORY_DIR
          $idx = Join-Path $inv "index.json"
          $csv = Join-Path $inv "relations.csv"
          $mm  = Join-Path $inv "graph.mermaid.md"
      
          if (Test-Path $idx) {
            $j = Get-Content $idx -Raw | ConvertFrom-Json
            $s += ""
            $s += "- generated_at: $($j.generated_at)"
            $s += "- node_count  : $($j.node_count)"
            $s += "- edge_count  : $($j.edge_count)"
            $s += "- changed_only: $($j.changed_only_effective)"
          } else { $s += "- index.json missing (no output?)" }
      
          if (Test-Path $csv) {
            $head = (Get-Content $csv -Raw) -split "`n"
            $s += ""
            $s += "#### relations.csv (head)"
            $s += "````csv"
            $s += ($head | Select-Object -First 15)
            $s += "````"
          } else { $s += "`n- relations.csv not found." }
      
          if (Test-Path $mm) {
            $m = Get-Content $mm -Raw
            $s += ""
            $s += "#### Mermaid Preview (first 100 edges)"
            $s += $m
          } else { $s += "`n- Mermaid preview not found." }
      
          Set-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($s -join "`n") -Encoding UTF8
      
      - name: Upload artifacts (_inventory)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-relations
          path: ${{ env.INVENTORY_DIR }}       # ✅ 폴더 자체를 업로드(/** 쓰지 말 것)
          if-no-files-found: error


