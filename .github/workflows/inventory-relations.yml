# .github/workflows/inventory-relations.yml
# 목적(WHAT):
#   - 리포지토리 파일 "연관 관계"를 스캔해 _inventory 산출물 생성/PR 반영
#   - 최초 1회는 전체 수집(Full), 이후는 변경분(Incremental) 갱신
#
# 용도(WHY):
#   - 영향 범위 파악, 리팩토링 후보 탐색, 리뷰 가이드 강화
#
# 연관 파일(RELATED):
#   - scripts/g5/Build-Relations.ps1   # 스캐너(정규식 1차판)
#   - _inventory/relations.csv         # 엣지 목록(소스/관계/타깃/탐지기/신뢰도)
#   - _inventory/graph.json            # 그래프 JSON
#   - _inventory/graph.mermaid.md      # 미리보기(100엣지 제한)
#   - _inventory/index.json            # 메타(시각/노드/엣지/모드)
#
# 출력(OUTPUTS):
#   - Job Summary: 요약 + Mermaid
#   - Artifact: inventory-relations
#   - PR: chore/inventory-relations-update (메인 직접 변경 없음)
#
# 안전 가드(SAFETY):
#   - paths-ignore: _inventory/**  (자기 변경 루프 방지)
#   - concurrency: ref 단일 실행
#   - 마지막에 $LASTEXITCODE=0/exit 0 보장 → "Decide scan mode" 단계 실패 방지
#
# 테스트 방법(TEST):
#   - 로컬: act -n -j build-relations
#   - 원격: gh workflow run inventory-relations.yml --ref <브랜치>
#   - 정적검사: actionlint (필수)
#
name: "Inventory / File Relations"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "_inventory/**"
  pull_request:
    paths-ignore:
      - "_inventory/**"
  workflow_dispatch:
    inputs:
      full:
        description: "강제 전체 수집(Force Full Scan)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "inventory-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-relations:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout (full history)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Show PowerShell version (for audit)"
        shell: pwsh
        run: pwsh --version

      - name: "Decide scan mode (Full vs Incremental)"
        id: mode
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FULL: ${{ inputs.full }}
        run: |
          $ErrorActionPreference = 'Stop'

          # 기본: Full. 조건 충족 시 Incremental
          $changedOnly = $false

          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:INPUT_FULL -eq 'true') {
            $changedOnly = $false
          }
          else {
            # main의 과거 산출물 유무 확인 (에러를 남기지 않는 방식)
            git fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main | Out-Null
            $exist = (git ls-tree -r --name-only origin/main -- _inventory/relations.csv | Select-Object -First 1)
            $hasRel = -not [string]::IsNullOrWhiteSpace($exist)
            # git 네이티브 커맨드의 종료코드가 단계 종료코드에 전이되지 않도록 리셋
            $global:LASTEXITCODE = 0

            if ($hasRel) { $changedOnly = $true } else { $changedOnly = $false }
          }

          $mode = if ($changedOnly) { 'Incremental' } else { 'Full' }

          "changed_only=$changedOnly" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "mode=$mode"              | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "== Scan Mode: $mode"

          # 이 단계는 반드시 성공 종료
          $global:LASTEXITCODE = 0
          exit 0

      - name: "Build relations (scripts/g5/Build-Relations.ps1)"
        shell: pwsh
        run: |
          $args = @(
            '-NoProfile','-File','scripts/g5/Build-Relations.ps1',
            '-OutDir','_inventory'
          )
          if ('${{ steps.mode.outputs.changed_only }}' -eq 'true') { $args += '-ChangedOnly' }
          pwsh @args

      - name: "Upload artifact (inventory-relations)"
        uses: actions/upload-artifact@v4
        with:
          name: inventory-relations
          path: |
            _inventory/relations.csv
            _inventory/graph.json
            _inventory/graph.mermaid.md
            _inventory/index.json
          if-no-files-found: error
          retention-days: 7

      - name: "Summarize (Job Summary)"
        shell: pwsh
        run: |
          $idx = Get-Content _inventory/index.json -Raw | ConvertFrom-Json
          $rel = Import-Csv _inventory/relations.csv
          $top = $rel | Group-Object source_path | Sort-Object Count -Desc | Select-Object -First 10

          $lines = @()
          $lines += "# File Relations"
          $lines += "- Mode: ${{ steps.mode.outputs.mode }}"
          $lines += "- Generated: $($idx.generated_at)"
          $lines += "- Nodes: $($idx.node_count)"
          $lines += "- Edges: $($idx.edge_count)"
          $lines += ""
          $lines += "## Top 10 Sources"
          foreach ($t in $top) { $lines += "* $($t.Name) — $($t.Count) edges" }
          $lines += ""
          $lines += "## Mermaid Preview (first 100 edges)"
          $lines += (Get-Content _inventory/graph.mermaid.md -Raw)

          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: "Create PR for _inventory update"
        if: ${{ github.event_name != 'pull_request' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(inventory): update relations graph"
          title: "chore(inventory): update relations graph"
          body: |
            자동 생성된 파일 관계 그래프/목록 업데이트
            - 모드: ${{ steps.mode.outputs.mode }}
          branch: chore/inventory-relations-update
          add-paths: |
            _inventory/relations.csv
            _inventory/graph.json
            _inventory/graph.mermaid.md
            _inventory/index.json
