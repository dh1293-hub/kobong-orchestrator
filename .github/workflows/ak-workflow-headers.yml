# AK • Workflow Headers → Repo(_inventory) + Wiki  #주석(친절한)
# 목적: .github/workflows의 "머리 주석"만 수집하여
#   1) 레포의 _inventory/workflow-headers.md 로 저장(커밋/푸시)
#   2) Wiki의 Workflow-Header-Comments.md 로도 반영(커밋/푸시)
# 규칙:
#   - inventory-ci.yml 제외
#   - 머리 주석 없는 워크플로는 목록에서 제외
#   - 머리 주석 패턴: 시작부 연속 '#' 또는 시작~끝을 ```로 감싼 펜스 블록
#   - 출력은 모두 ```text 코드블록으로 렌더(문자 크기/굵기 통일)
# 실행 트리거:
#   - 수동 실행(workflow_dispatch)
#   - 워크플로/YAML/스크립트 변경 push 시 자동 실행
# 안전장치:
#   - contents: write 권한 필요
#   - push 트리거는 .github/workflows/** 와 스크립트만 감지 → _inventory 변경으로 자기재실행 방지

name: AK • Workflow Headers → Wiki & Repo

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'scripts/g5/Extract-WorkflowHeaders.v1.2.ps1'

permissions:
  contents: write    # ← 레포/위키 커밋/푸시에 필요

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout (wiki)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          fetch-depth: 0

      - name: Generate header docs (to _inventory & wiki)  #주석(친절한)
        shell: pwsh
        run: |
          # 1) _inventory 쪽 산출
          pwsh -NoProfile -File ./scripts/g5/Extract-WorkflowHeaders.v1.2.ps1 -Out ./_inventory/workflow-headers.md
          # 2) wiki 쪽 산출(동일 내용)
          pwsh -NoProfile -File ./scripts/g5/Extract-WorkflowHeaders.v1.2.ps1 -Out ./wiki/Workflow-Header-Comments.md

          # 요약 출력(앞부분)
          '## Workflow Headers (head of file)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Content ./_inventory/workflow-headers.md -TotalCount 60 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Commit back to repo (_inventory) if changed
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _inventory/workflow-headers.md
          if git diff --cached --quiet; then
            echo "No repo changes."; exit 0
          fi
          git commit -m "docs(workflows): update header comments [skip ci]"
          BRANCH="${GITHUB_REF_NAME:-$(git symbolic-ref --short HEAD)}"
          git push origin HEAD:"$BRANCH"

      - name: Commit to Wiki (if changed)
        shell: bash
        run: |
          git -C wiki config user.name  "github-actions[bot]"
          git -C wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C wiki add Workflow-Header-Comments.md
          if git -C wiki diff --cached --quiet; then
            echo "No wiki changes."; exit 0
          fi
          git -C wiki commit -m "docs(workflows): update header comments"
          git -C wiki push origin HEAD

      - name: Upload artifact (for review)
        uses: actions/upload-artifact@v4
        with:
          name: workflow-headers
          path: |
            _inventory/workflow-headers.md
            wiki/Workflow-Header-Comments.md
          if-no-files-found: error
