# ============================================================
# Housekeeping Smoke — 레포 위생(비밀/대용량/금지 확장자) 초경량 검사
# 목적:
#   - PR/메인 반영 전에 치명적 실수만 빠르게 차단
#     * 대용량 파일(기본 > 5MB)
#     * 비밀/키/토큰 패턴
#     * 금지 확장자(.pem/.key/.p12/.jks/.db 등)
# 역할 분리(중복 방지):
#   - logs/ 트래킹 금지: guard-logs-ignored
#   - README 배지/센티널 검증: guard-readme-badge / contracts-ci
# 트리거:
#   - PR / main 푸시 / 수동(dispatch)
# 보안·안전:
#   - 최소 권한(contents: read)
#   - 동시성 취소 + 5분 타임아웃
#   - YAML 안전: 모든 스크립트 run: |, 탭 금지(스페이스만)
# 커스터마이즈(수동 실행):
#   - mode(enforce/report), max_mb, exclude_globs(멀티라인)
# ============================================================
name: housekeeping/smoke

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      mode:
        description: "위반 시 동작"
        type: choice
        options: [enforce, report]   # ⚠️ strings여야 함
        default: enforce
      max_mb:
        description: "대용량 기준(MB)"
        type: string                  # ⚠️ 숫자처럼 보여도 문자열로 받음
        default: "5"
      exclude_globs:
        description: |-
          검사 제외 글롭(한 줄 하나)
          예) _inventory/** 
              docs/assets/** 
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: housekeeping-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 기본값(수동 실행 입력이 없을 때)
      HK_MAX_MB: "5"
    steps:
      - name: Checkout (full for accurate diff on PR)
        uses: actions/checkout@v4
        with:
          # PR에서 base/head 비교를 위해 히스토리 필요 → 0
          fetch-depth: 0

      - name: Normalize inputs
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          MODE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'enforce' }}"
          MAX_MB="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_mb || env.HK_MAX_MB }}"
          EXCL="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.exclude_globs || '' }}"

          # 멀티라인 exclude 파싱
          mapfile -t EXCLUDES < <(printf '%s\n' "$EXCL" | sed '/^[[:space:]]*$/d')

          echo "mode=$MODE"   >> "$GITHUB_OUTPUT"
          echo "max_mb=$MAX_MB" >> "$GITHUB_OUTPUT"

          printf 'excludes<<EOF\n' >> "$GITHUB_OUTPUT"
          printf '%s\n' "${EXCLUDES[@]}" >> "$GITHUB_OUTPUT"
          printf 'EOF\n' >> "$GITHUB_OUTPUT"

      - name: Collect changed files (PR or push)
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _tmp
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          # 추가/변경/복사/이름변경/타입변경만 추출
          git diff --name-status -z "$base" "$head" | tr '\0' '\n' > _tmp/diff.txt

          files=()
          while read -r st f; do
            case "$st" in
              A|C*|M|R*|T) files+=("$f");;
            esac
          done < <(awk 'NR%2{st=$0;next}{print st,$0}' _tmp/diff.txt)

          # exclude 적용
          mapfile -t EXC < <(printf '%s\n' "${{ steps.cfg.outputs.excludes }}")
          filtered=()
          for f in "${files[@]}"; do
            skip=0
            for g in "${EXC[@]}"; do
              [[ -z "$g" ]] && continue
              [[ "$f" == $g ]] && { skip=1; break; }
            done
            [[ $skip -eq 0 ]] && filtered+=("$f")
          done

          if (( ${#filtered[@]} == 0 )); then
            echo "list=" >> "$GITHUB_OUTPUT"
            echo "No changed files to check."
            exit 0
          fi

          printf 'list<<EOF\n' >> "$GITHUB_OUTPUT"
          printf '%s\n' "${filtered[@]}" >> "$GITHUB_OUTPUT"
          printf 'EOF\n' >> "$GITHUB_OUTPUT"

      - name: Scan large files
        id: large
        if: ${{ steps.changed.outputs.list != '' }}
        shell: bash
        run: |
          set -euo pipefail
          MAX_MB="${{ steps.cfg.outputs.max_mb }}"
          MAX=$(( MAX_MB * 1024 * 1024 ))

          mapfile -t FILES < <(printf '%s\n' "${{ steps.changed.outputs.list }}")

          over=()
          for f in "${FILES[@]}"; do
            [[ -f "$f" ]] || continue
            sz=$(stat -c '%s' "$f" 2>/dev/null || echo 0)
            if (( sz > MAX )); then over+=("$f ($sz bytes)"); fi
          done

          if (( ${#over[@]} > 0 )); then
            printf 'found<<EOF\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' "${over[@]}" >> "$GITHUB_OUTPUT"
            printf 'EOF\n' >> "$GITHUB_OUTPUT"
          else
            echo "found=" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan forbidden extensions
        id: ext
        if: ${{ steps.changed.outputs.list != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # 금지 확장자(필요 시 추가/수정)
          BLOCK_EXT='^(pem|key|p12|pfx|jks|keystore|kdb|db|sqlite)$'

          mapfile -t FILES < <(printf '%s\n' "${{ steps.changed.outputs.list }}")
          bad=()
          for f in "${FILES[@]}"; do
            ext="${f##*.}"
            [[ "$ext" == "$f" ]] && continue  # 확장자 없음
            if [[ "$ext" =~ $BLOCK_EXT ]]; then bad+=("$f"); fi
          done

          if (( ${#bad[@]} > 0 )); then
            printf 'found<<EOF\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' "${bad[@]}" >> "$GITHUB_OUTPUT"
            printf 'EOF\n' >> "$GITHUB_OUTPUT"
          else
            echo "found=" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan secret patterns (text files ≤ 1MB)
        id: secrets
        if: ${{ steps.changed.outputs.list != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(printf '%s\n' "${{ steps.changed.outputs.list }}")
          limit=$((1024*1024))
          found=()

          # 최소 핵심 패턴(보수적으로)
          re_gh='gh[pous]_[A-Za-z0-9_]{20,}'
          re_aws='AKIA[0-9A-Z]{16}'
          re_priv='-----BEGIN (RSA|DSA|EC|OPENSSH) PRIVATE KEY-----'
          re_cert='-----BEGIN CERTIFICATE-----'
          re_pgp='-----BEGIN PGP PRIVATE KEY BLOCK-----'
          re_slack='xox[baprs]-[A-Za-z0-9-]{10,}'

          for f in "${FILES[@]}"; do
            [[ -f "$f" ]] || continue
            sz=$(stat -c '%s' "$f" 2>/dev/null || echo 0)
            (( sz > limit )) && continue   # 너무 큰 텍스트는 스킵(성능)
            # 바이너리 대략 필터: NUL 존재시 스킵
            if LC_ALL=C grep -qU $'\x00' "$f" 2>/dev/null; then
              continue
            fi
            if grep -Eq "$re_gh|$re_aws|$re_priv|$re_cert|$re_pgp|$re_slack" "$f"; then
              found+=("$f")
            fi
          done

          if (( ${#found[@]} > 0 )); then
            printf 'found<<EOF\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' "${found[@]}" >> "$GITHUB_OUTPUT"
            printf 'EOF\n' >> "$GITHUB_OUTPUT"
          else
            echo "found=" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize & Enforce
        shell: bash
        run: |
          set -euo pipefail
          MODE="${{ steps.cfg.outputs.mode }}"
          large="${{ steps.large.outputs.found }}"
          ext="${{ steps.ext.outputs.found }}"
          sec="${{ steps.secrets.outputs.found }}"

          issues=0
          [[ -n "$large" ]] && { echo "::group::Large files (> limit)"; printf '%s\n' "$large"; echo "::endgroup::"; issues=$((issues+1)); }
          [[ -n "$ext"   ]] && { echo "::group::Forbidden extensions"; printf '%s\n' "$ext";   echo "::endgroup::"; issues=$((issues+1)); }
          [[ -n "$sec"   ]] && { echo "::group::Secret patterns";     printf '%s\n' "$sec";   echo "::endgroup::"; issues=$((issues+1)); }

          if (( issues == 0 )); then
            echo "✅ Housekeeping OK"
            exit 0
          fi

          if [[ "$MODE" == "report" ]]; then
            echo "::warning::Housekeeping issues found (report mode: not failing)."
            exit 0
          else
            echo "::error::Housekeeping issues found (enforce mode)."
            exit 1
          fi
