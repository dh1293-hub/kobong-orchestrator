# ===========================================
# AK-AUTO (fixed) : PR 라벨 기반 자동 시퀀스
# - 트리거: pull_request_target(labeled/opened/reopened/synchronize), workflow_dispatch
# - 조건: ak:auto 라벨 필수, (옵션) ak:auto-apply + OWNER → apply
# - 실행: help → test → scan --all → fixloop preview → (옵션) apply
# - logs/ak7.jsonl 아티팩트 업로드, 요약 코멘트 남김
# ===========================================
name: ak-auto

"on":
  pull_request_target:
    types: [labeled, opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

concurrency:
  group: ak-auto-${{ github.repository }}-${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  auto:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve PR
        id: pr
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "num=${{ inputs.pr }}" >> "$GITHUB_OUTPUT"
          else
            echo "num=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.pr.outputs.num }}/head
          fetch-depth: 1

      - name: Require ak:auto label
        id: checklabel
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const pr = Number('${{ steps.pr.outputs.num }}');
            const {data: labels} = await github.rest.issues.listLabelsOnIssue({owner, repo, issue_number: pr});
            const ok = labels.some(l => l.name.toLowerCase()==='ak:auto');
            if (!ok) {
              await github.rest.issues.createComment({owner, repo, issue_number: pr, body: 'ℹ️ 이 PR에는 `ak:auto` 라벨이 없어 자동 실행을 건너뜁니다.'});
              core.setOutput('skip','true');
            } else {
              core.setOutput('skip','false');
            }

      - name: Stop when no label
        if: ${{ steps.checklabel.outputs.skip == 'true' }}
        run: echo "skip"

      - name: /ak help
        if: ${{ steps.checklabel.outputs.skip != 'true' }}
        shell: pwsh
        run: ./scripts/g5/ak-dispatch.ps1 -Command help -Pr '${{ steps.pr.outputs.num }}'

      - name: /ak test
        if: ${{ steps.checklabel.outputs.skip != 'true' }}
        shell: pwsh
        run: ./scripts/g5/ak-dispatch.ps1 -Command test -Pr '${{ steps.pr.outputs.num }}'

      - name: /ak scan --all
        if: ${{ steps.checklabel.outputs.skip != 'true' }}
        shell: pwsh
        run: ./scripts/g5/ak-dispatch.ps1 -Command scan -RawArgs '--all' -Pr '${{ steps.pr.outputs.num }}'

      - name: /ak fixloop preview
        if: ${{ steps.checklabel.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          ./scripts/g5/ak-dispatch.ps1 -Command fixloop -RawArgs 'preview' -Pr '${{ steps.pr.outputs.num }}' ; exit 0

      - name: Decide apply
        id: apply
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const pr = Number('${{ steps.pr.outputs.num }}');
            const {data: labels} = await github.rest.issues.listLabelsOnIssue({owner, repo, issue_number: pr});
            const applyLabel = labels.some(l => l.name.toLowerCase()==='ak:auto-apply');
            core.setOutput('do', applyLabel ? 'true' : 'false');
            core.setOutput('night','false');

      - name: Night notice
        if: ${{ false }}
        run: |
          echo "DEV mode: night guard disabled"

      - name: /ak fixloop apply (OWNER only)
        if: ${{ steps.apply.outputs.do == 'true' && github.actor == github.repository_owner }}
        shell: pwsh
        run: ./scripts/g5/ak-dispatch.ps1 -Command fixloop -RawArgs 'apply' -Pr '${{ steps.pr.outputs.num }}'

      - name: Upload ak logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ak7-logs
          path: logs/ak7.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECKS_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ steps.pr.outputs.num }}/checks
          STATUS: ${{ job.status }}
          KB_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/.kobong/reports/ERROR-KB.md
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const pr = Number('${{ steps.pr.outputs.num }}');
            const body = [
              `**AUTO-Kobong** finished: **${process.env.STATUS.toUpperCase()}**`,
              `- Actions Run: ${process.env.RUN_URL}`,
              `- PR Checks  : ${process.env.CHECKS_URL}`,
              `- Error KB   : ${process.env.KB_URL}`
            ].join("\n");
            await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
