# .github/workflows/ak-auto.yml
name: AK Auto

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "자동화 작업을 실제로 실행하지 않고 검증만 수행"
        required: false
        default: "false"

concurrency:
  group: ak-auto-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-tracked-logs:
    name: guard-logs-ignored
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Scan tracked files under logs/
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          files="$(git ls-files -- 'logs/*' ':!logs/.gitkeep' || true)"
          if [ -n "${files}" ]; then
            echo "has_tracked=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${files}" > tracked.txt
          else
            echo "has_tracked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set commit status (no-tracked-logs = failure)
        if: steps.scan.outputs.has_tracked == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const files = fs.readFileSync('tracked.txt','utf8').trim().split('\n');
            const preview = files.length ? `${files[0]}${files.length>1?' …':''}` : '';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'guard-logs-ignored/no-tracked-logs',
              description: preview || 'Tracked files under logs/'
            });
            core.setFailed('Tracked files exist under logs/');

      - name: Set commit status (no-tracked-logs = success)
        if: steps.scan.outputs.has_tracked == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'guard-logs-ignored/no-tracked-logs',
              description: 'No tracked files under logs/'
            });

  auto:
    name: run-automation
    runs-on: ubuntu-latest
    needs: [ no-tracked-logs ]
    if: needs.no-tracked-logs.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Show context
        shell: bash
        run: |
          echo "dry_run: ${{ github.event.inputs.dry_run || 'false' }}"
          echo "ref: ${{ github.ref }}"
          echo "sha: ${{ github.sha }}"
          echo "actor: ${{ github.actor }}"
