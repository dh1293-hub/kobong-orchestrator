# ===========================================
# AK-AUTO : Kobong-Orchestrator 자동화 실행
# ===========================================
# ✔ logs/ 추적파일 차단 (no-tracked-logs 게이트)
# ✔ 실행 전후 Context 출력
# ✔ YAML 구조 및 들여쓰기 정합성 보정
# -------------------------------------------

name: AK Auto
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode (테스트 실행, 실제 명령 제외)'
        required: false
        default: "false"
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  no-tracked-logs:
    name: Guard logs/ (no tracked logs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Scan tracked files under logs/
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          files="$(git ls-files -- 'logs/*' ':!logs/.gitkeep' || true)"
          if [ -n "$files" ]; then
            echo "has_tracked=true" >> "$GITHUB_OUTPUT"
            echo "$files" > tracked.txt
          else
            echo "has_tracked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark status (fail)
        if: steps.scan.outputs.has_tracked == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const files = fs.readFileSync('tracked.txt', 'utf8').trim().split('\n');
            const preview = files.length ? files[0] + (files.length > 1 ? ' …' : '') : '';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'guard-logs-ignored/no-tracked-logs',
              description: preview || 'Tracked files under logs/'
            });
            core.setFailed(`❌ Tracked log files detected: ${preview}`);

      - name: Mark status (success)
        if: steps.scan.outputs.has_tracked == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'guard-logs-ignored/no-tracked-logs',
              description: 'No tracked files under logs/'
            });

  run-auto:
    name: Run Auto Tasks
    runs-on: ubuntu-latest
    needs: [ no-tracked-logs ]
    if: needs.no-tracked-logs.result == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Context 확인
        shell: bash
        run: |
          echo "🔹 Actor: ${{ github.actor }}"
          echo "🔹 Branch: ${{ github.ref }}"
          echo "🔹 SHA: ${{ github.sha }}"
          echo "🔹 Dry-run: ${{ github.event.inputs.dry_run || 'false' }}"

      - name: 실행 예시 (자동화 동작)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          echo "자동화 프로세스 시작..."
          echo "현재 시각: $(date)"
          echo "✔ 실행 완료!"
