name: AK Auto

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number (optional for manual run)'
        required: false
  # 이 워크플로 파일 수정/로그 변경 시, 로그 가드 전용으로 push도 돌립니다.
  push:
    paths:
      - '.github/workflows/ak-auto.yml'
      - 'logs/**'

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

# ─────────────────────────────────────────────
# 1) 공통 로그 가드 (logs/* 은 추적 금지, .gitkeep만 허용)
# ─────────────────────────────────────────────
jobs:
  no-tracked-logs:
    name: no-tracked-logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Scan for tracked logs
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'logs/*' ':!:logs/.gitkeep' || true)
          if [ ${#files[@]} -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Tracked files under logs/"
              printf '%s\n' "${files[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set commit status (guard-logs-ignored/no-tracked-logs)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const found = '${{ steps.scan.outputs.found }}' === 'true';
            const state = found ? 'failure' : 'success';
            const desc  = found ? 'logs/ contains tracked files (except .gitkeep)' : 'OK: no tracked logs';
            await github.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'guard-logs-ignored/no-tracked-logs',
              description: desc,
            });

      - name: Fail build if tracked logs found
        if: steps.scan.outputs.found == 'true'
        shell: bash
        run: |
          echo "Error: Tracked files under logs/:"
          git ls-files 'logs/*' ':!:logs/.gitkeep' || true
          exit 1

  # ───────────────────────────────────────────
  # 2) 라벨 기반 자동 실행 (PR 타겟/수동 실행만)
  # ───────────────────────────────────────────
  auto:
    needs: no-tracked-logs
    if: >
      ${{
        (github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch')
        && needs.no-tracked-logs.result != 'failure'
      }}
    runs-on: windows-latest
    concurrency:
      group: ak-auto-${{ github.event.pull_request.number || inputs.pr || github.sha }}
      cancel-in-progress: false

    steps:
      - name: Resolve PR number
        id: resolve
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.pr }}' -ne '') {
            $num = '${{ inputs.pr }}'
          } else {
            $num = '${{ github.event.pull_request.number }}'
          }
          if (-not $num) { throw 'PR number is required for ak-auto'; }
          "num=$num" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Require label ak:auto
        id: label
        uses: actions/github-script@v7
        with:
          script: |
            const pr = Number('${{ steps.resolve.outputs.num }}');
            const {data: labels} = await github.issues.listLabelsOnIssue({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr
            });
            const has = labels.some(l => l.name === 'ak:auto');
            core.setOutput('has', has ? 'true' : 'false');

      - name: Announce when label missing
        if: steps.label.outputs.has != 'true' && github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            await github.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: 'ℹ️ Add the `ak:auto` label to enable automatic actions.'
            });

      - name: Stop when label missing
        if: steps.label.outputs.has != 'true'
        run: exit 0

      - name: Checkout default branch (safe)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          submodules: false

      - name: Ensure dispatcher script
        id: ensure
        shell: pwsh
        run: |
          $path = "scripts/g5/ak-dispatch.ps1"
          if (-not (Test-Path $path)) { throw "Missing $path" }
          "path=$path" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Run automation (help/test/scan/fixloop preview)
        shell: pwsh
        run: |
          $pr  = '${{ steps.resolve.outputs.num }}'
          $sha = '${{ github.event.pull_request.head.sha || github.sha }}'
          pwsh -NoProfile -File $env:GITHUB_WORKSPACE/${{ steps.ensure.outputs.path }} -Command 'help'           -Pr $pr -Sha $sha
          pwsh -NoProfile -File $env:GITHUB_WORKSPACE/${{ steps.ensure.outputs.path }} -Command 'test'           -Pr $pr -Sha $sha
          pwsh -NoProfile -File $env:GITHUB_WORKSPACE/${{ steps.ensure.outputs.path }} -Command 'scan --all'     -Pr $pr -Sha $sha
          pwsh -NoProfile -File $env:GITHUB_WORKSPACE/${{ steps.ensure.outputs.path }} -Command 'fixloop preview' -Pr $pr -Sha $sha

      - name: Apply fixloop (label: ak:auto-apply)
        id: apply-flag
        uses: actions/github-script@v7
        with:
          script: |
            const pr = Number('${{ steps.resolve.outputs.num }}');
            const {data: labels} = await github.issues.listLabelsOnIssue({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr
            });
            const ok = labels.some(l => l.name === 'ak:auto-apply');
            core.setOutput('do', ok ? 'true' : 'false');

      - name: Do apply
        if: steps.apply-flag.outputs.do == 'true'
        shell: pwsh
        run: |
          $pr  = '${{ steps.resolve.outputs.num }}'
          $sha = '${{ github.event.pull_request.head.sha || github.sha }}'
          pwsh -NoProfile -File $env:GITHUB_WORKSPACE/${{ steps.ensure.outputs.path }} -Command 'fixloop apply' -Pr $pr -Sha $sha

      - name: Upload ak logs (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ak-logs
          if-no-files-found: ignore
          path: |
            logs/ak7.jsonl
            logs/*.log

      - name: Summary comment
        if: always() && github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `### AK Auto summary\n• Run: ${url}\n• Outcome: see checks.`
            })
