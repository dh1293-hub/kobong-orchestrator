+            }

            

      - name: Check required label ak:auto
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const pr = Number('${{ steps.pr.outputs.num }}');
            const {owner, repo} = context.repo;
            const {data: labels} = await github.rest.issues.listLabelsOnIssue({owner, repo, issue_number: pr});
            const ok = labels.some(l => (l.name || '').toLowerCase() === 'ak:auto');
            core.setOutput('skip', ok ? 'false' : 'true');
            if (!ok) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr,
                body: 'ℹ️ 이 PR에는 `ak:auto` 라벨이 없어 자동 실행을 건너뜁니다.'
              });
            }

      - name: Stop when no label
        if: ${{ steps.gate.outputs.skip == 'true' }}
        run: echo "skip"

      # === PR 소스: zipball로 전개(서브모듈/깃 의존 제거) ===
      - name: Download PR source zipball
        if: ${{ steps.gate.outputs.skip != 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA:  ${{ steps.pr.outputs.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'src.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'src-unzip'
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "X-GitHub-Api-Version"="2022-11-28" }
          $url = "https://api.github.com/repos/$env:REPO/zipball/$env:SHA"
          Invoke-WebRequest -Headers $headers -Uri $url -OutFile $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($zip,$tmp)
          $root = Get-ChildItem $tmp | ?{ $_.PSIsContainer } | Select-Object -First 1
          # 워크스페이스 클린 후 전개
          Get-ChildItem -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Force $root.FullName | Copy-Item -Recurse -Force -Destination .

      # === 실행 스크립트: 항상 main에서 하이드레이트 ===
      - name: Hydrate scripts/g5 from main via zipball
        if: ${{ steps.gate.outputs.skip != 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'g5.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'g5-unzip'
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "X-GitHub-Api-Version"="2022-11-28" }
          $url = "https://api.github.com/repos/$env:REPO/zipball/main"
          Invoke-WebRequest -Headers $headers -Uri $url -OutFile $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($zip,$tmp)
          $root = Get-ChildItem $tmp | ?{ $_.PSIsContainer } | Select-Object -First 1
          if (-not (Test-Path "$($root.FullName)/scripts/g5")) { throw "scripts/g5 not found" }
          Remove-Item -Recurse -Force scripts/g5 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force scripts | Out-Null
          Copy-Item -Recurse -Force "$($root.FullName)/scripts/g5" "scripts/g5"

      # === 로그 파일 보장(아티팩트 경고 제거) ===
      - name: Ensure logs exist
        if: ${{ steps.gate.outputs.skip != 'true' }}
        shell: bash
        run: |
          mkdir -p logs
          [ -s logs/ak7.jsonl ] || printf '{"ts":"%s","lvl":"INFO","msg":"init"}\n' "$(date -Iseconds)" >> logs/ak7.jsonl

      - name: /ak help
        if: ${{ steps.gate.outputs.skip != 'true' }}
        shell: pwsh
        run: ./scripts/g5/ak-dispatch.ps1 -Command help -Pr '${{ steps.pr.outputs.num }}'

      - name: /ak test
        if: ${{ steps.gate.outputs.skip != 'true' }}
        shell: pwsh
        run: ./scripts/g5/ak-dispatch.ps1 -Command test -Pr '${{ steps.pr.outputs.num }}'

      - name: /ak scan --all
        if: ${{ steps.gate.outputs.skip != 'true' }}
        shell: pwsh
        run: ./scripts/g5/ak-dispatch.ps1 -Command scan -RawArgs '--all' -Pr '${{ steps.pr.outputs.num }}'

      - name: /ak fixloop preview
        if: ${{ steps.gate.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          ./scripts/g5/ak-dispatch.ps1 -Command fixloop -RawArgs 'preview' -Pr '${{ steps.pr.outputs.num }}' ; exit 0

      - name: Decide apply
        if: ${{ steps.gate.outputs.skip != 'true' }}
        id: apply
        uses: actions/github-script@v7
        with:
          script: |
            const pr = Number('${{ steps.pr.outputs.num }}');
            const {owner, repo} = context.repo;
            const {data: labels} = await github.rest.issues.listLabelsOnIssue({owner, repo, issue_number: pr});
            const doApply = labels.some(l => (l.name || '').toLowerCase() === 'ak:auto-apply');
            core.setOutput('do', doApply ? 'true' : 'false');

      - name: /ak fixloop apply
        if: ${{ steps.gate.outputs.skip != 'true' && steps.apply.outputs.do == 'true' && github.actor == github.repository_owner }}
        shell: pwsh
        run: ./scripts/g5/ak-dispatch.ps1 -Command fixloop -RawArgs 'apply' -Pr '${{ steps.pr.outputs.num }}'

      - name: Upload ak logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ak7-logs
          path: logs/ak7.jsonl
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize to PR
        if: always()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECKS_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ steps.pr.outputs.num }}/checks
          STATUS: ${{ job.status }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const pr = Number('${{ steps.pr.outputs.num }}');
            const body = [
              `**AUTO-Kobong** finished: **${process.env.STATUS.toUpperCase()}**`,
              `- Actions Run: ${process.env.RUN_URL}`,
              `- PR Checks  : ${process.env.CHECKS_URL}`
            ].join("\n");
            await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
