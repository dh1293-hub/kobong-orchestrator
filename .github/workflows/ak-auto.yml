# =========================================================
# 파일 용도 : PR 라벨 기반 자동 파일럿
#             Help → Test → Scan(--all) → Fixloop preview → (조건) Apply
# 동작 방식 : pull_request_target(labeled/opened/reopened/synchronize),
#             또는 workflow_dispatch(pr 입력)
# 연관 파일 : scripts/g5/ak-dispatch.ps1
#             .github/workflows/ak-exec.yml (ChatOps 수동 실행기)
# 안전 가드 : - PR 코드는 zipball로 받고, 실행 스크립트는 항상 main에서 하이드레이트
#             - Apply는 ak:auto-apply 라벨 + OWNER일 때만
# 산출물    : PR 코멘트(요약), Artifact: ak7-logs (logs/ak7.jsonl)
# =========================================================
name: ak-auto

on:
  pull_request_target:
    types: [labeled, opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

concurrency:
  group: ak-auto-${{ github.repository }}-${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number and head sha
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = (context.eventName === 'workflow_dispatch')
              ? Number(core.getInput('pr'))
              : context.payload.pull_request.number;
            const {data: pr} = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNum
            });
            core.setOutput('num', prNum.toString());
            core.setOutput('sha', pr.head.sha);

