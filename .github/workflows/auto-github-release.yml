# 파일: .github/workflows/auto-github-release.yml
# 목적: 태그 push(`v*`) 또는 수동 실행 시 GitHub Release를 자동 생성/갱신하고 릴리스 노트를 자동 생성한다.
# 핵심:
#   - generate_release_notes: true (PR/커밋 기반 자동 릴리스 노트)
#   - 필요 시 산출물(dist/** 등) 첨부
# 트리거:
#   - push.tags: v*    # v1.2.3 형식 권장(semver)
#   - workflow_dispatch(tag 입력 지원)
# 사용법:
#   - 태그 배포:  git tag v1.2.3 && git push origin v1.2.3
#   - 수동 배포:  Actions → 이 워크플로 → Run workflow → tag 입력
# 권한(최소 권한 원칙):
#   - permissions.contents: write (Release 작성/갱신에 필요)
# 보안 가드:
#   - 포크/외부 이벤트 차단: jobs.if에서 저장소 일치 확인
#   - 동시 실행 방지: concurrency (동일 태그 중복 배포 차단)
#   - 태그 유효성 검사: semver(vX.Y.Z[-pre]) 아닌 경우 실패 처리
#   - checkout 시 persist-credentials: false (토큰 확산 방지)
#   - (선택) prerelease 자동 판별: 태그에 '-' 포함 시 prerelease=true
# 산출물/연동:
#   - GitHub Release(노트/자산)
#   - (선택) _inventory에 릴리스 리스트를 따로 수집하는 스크립트와 함께 운용
# 롤백:
#   - 잘못된 릴리스/태그는 GitHub에서 릴리스 삭제 → 태그 수정 후 재실행
# 변경 이력(작성자/일시/사유): 
#   - 2025-11-01: 보안 보강(permissions/concurrency/semver/포크가드), 머리 주석 추가

name: auto-github-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그 (예: v1.2.3). 비우면 현재 ref의 태그를 사용"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

# 동일 태그 중복 배포 방지
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    # 포크/외부 이벤트 차단 + 수동/태그 실행만 허용
    if: >
      github.repository == 'dh1293-hub/kobong-orchestrator' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 입력으로 tag가 오면 사용, 아니면 현재 ref_name 사용
      - name: Resolve tag
        id: resolve_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # vX.Y.Z 또는 vX.Y.Z-rc.1 등 semver 형태만 허용
      - name: Validate semver tag
        shell: bash
        run: |
          TAG="${{ steps.resolve_tag.outputs.tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag: $TAG (expected like v1.2.3 or v1.2.3-rc.1)"
            exit 1
          fi

      # (선택) 빌드가 필요한 레포면 주석 해제
      # - name: Set up Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version-file: ".nvmrc"
      #     cache: "npm"
      #
      # - name: Build
      #   run: |
      #     npm ci
      #     npm run build

      # (선택) 산출물 첨부 시 주석 해제
      # - name: Upload artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: dist
      #     path: dist/**

      - name: Create/Update GitHub Release (auto notes)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          generate_release_notes: true
          # 태그에 '-'가 포함되면 prerelease로 간주 (예: v1.2.3-rc.1)
          prerelease: ${{ contains(steps.resolve_tag.outputs.tag, '-') }}
          draft: false
          fail_on_unmatched_files: true
          # files: |
          #   dist/**/*
