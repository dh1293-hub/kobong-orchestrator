# =========================================
# KLC Append Release (주석 강화본)
# 목적  : 릴리즈(Release) 노트에 'KLC 요약 1줄'을 멱등하게 추가
# 트리거: 1) release: published   2) workflow_dispatch(tag 입력 선택)
# 권한  : contents: write (릴리즈 노트 수정 최소 권한)
# 멱등  : 센티넬 주석(<!-- __G5_SENTINEL:KLC_SUMMARY_v1 -->)로 중복 방지
# 의존  : GitHub CLI(gh) 사전 탑재(ubuntu-latest 기본 제공)
# 산출물: - 릴리즈 노트에 "KLC | <trace> | exitCode=0 | anchor=release-append"
#        - Job Summary(GITHUB_STEP_SUMMARY)에 PASS/SKIP 요약
# 관련  : 프로젝트 릴리즈 운용 표준(KLC 1행 로그 규칙)
# =========================================
name: KLC Append Release


on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy KLC disabled. Use 'KLC / Nightly Aggregate v2'."

      # 1) 멱등 가드: 이미 센티넬이 붙어 있으면 skip
      - name: Idempotency guard (skip if already appended)
        id: guard
        env:
          TAG_FROM_EVENT: ${{ github.event.release.tag_name }}  # release 트리거 시 태그
          TAG_INPUT: ${{ inputs.tag }}                          # 수동 실행 시 입력 태그
        shell: bash
        run: |
          set -euo pipefail
          # --- 태그 결정 순서: 이벤트 태그 → 입력 → 최신 릴리즈 → 최근 태그 ---
          tag="${TAG_FROM_EVENT:-}"
          if [ -z "$tag" ] && [ -n "${TAG_INPUT:-}" ]; then tag="$TAG_INPUT"; fi
          if [ -z "$tag" ]; then
            tag="$(gh api -H 'X-GitHub-Api-Version:2022-11-28' \
                   "repos/${REPO}/releases/latest" -q .tag_name 2>/dev/null || true)"
          fi
          if [ -z "$tag" ]; then
            tag="$(gh api -H 'X-GitHub-Api-Version:2022-11-28' \
                   "repos/${REPO}/tags?per_page=1" -q '.[0].name' 2>/dev/null || true)"
          fi
          if [ -z "$tag" ]; then
            echo "::error::no release/tag detected; pass an input 'tag' or publish a release."; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # 릴리즈 존재 확인(+본문 조회). -R 로 repo를 명시하여 .git 의존 제거
          if ! gh release view -R "$REPO" "$tag" >/dev/null 2>&1; then
            echo "::error::release '$tag' not found in $REPO"; exit 1
          fi
          body="$(gh release view -R "$REPO" "$tag" --json body -q .body || echo '')"

          # 이미 센티넬이 존재하면 SKIP (멱등)
          if echo "$body" | grep -q "$SENTINEL"; then
            printf "### KLC append\n- Tag: \`%s\`\n- Result: **SKIP** (sentinel exists)\n" "$tag" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # 2) KLC 1행 생성: 추적용 trace(uuid) + 고정 anchor
      - name: Generate KLC line
        if: steps.guard.outputs.skip != 'true'
        id: gen
        shell: bash
        run: |
          set -euo pipefail
          trace=$(uuidgen | tr '[:upper:]' '[:lower:]')
          anchor="release-append"
          line="KLC | $trace | exitCode=0 | anchor=$anchor"
          echo "KLC_LINE=$line" >> "$GITHUB_ENV"
          echo "$line"

      # 3) 릴리즈 노트에 KLC 1행 + 센티넬을 안전하게 추가
      - name: Append to release notes
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.guard.outputs.tag }}"
          {
            echo ""
            echo "## KLC Summary"
            echo "- ${KLC_LINE}"
            echo "${SENTINEL}"
          } >> klc-release-append.md
          gh release edit -R "$REPO" "$tag" --notes-file klc-release-append.md

      # 4) 실행 요약
      - name: Summary
        shell: bash
        run: |
          tag="${{ steps.guard.outputs.tag }}"
          if [ "${{ steps.guard.outputs.skip }}" = "true" ]; then
            printf "### KLC append\n- Tag: \`%s\`\n- Result: **SKIP**\n" "$tag" >> "$GITHUB_STEP_SUMMARY"
          else
            printf "### KLC append\n- Tag: \`%s\`\n- Result: **PASS** (appended)\n" "$tag" >> "$GITHUB_STEP_SUMMARY"
          fi
