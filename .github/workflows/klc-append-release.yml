+            if [ -z "${tag}" ]; then tag="$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)"; fi
+            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
+            body="$(gh release view "${tag}" --json body -q .body || echo '')"
+            if echo "${body}" | grep -q "${SENTINEL}"; then
+              echo "skip=true"  >> "$GITHUB_OUTPUT"
+              echo "### KLC append\n- Tag: \`${tag}\`\n- Result: **SKIP** (sentinel exists)" >> "$GITHUB_STEP_SUMMARY"
+              exit 0
+            fi
+            echo "skip=false" >> "$GITHUB_OUTPUT"
