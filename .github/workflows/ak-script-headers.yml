# AK • Script Headers → Repo(_inventory) + Wiki   #주석(친절한)
# 목적: scripts/g5/**/*.ps1 파일들의 "머리 주석"만 수집하여
#   1) 레포의 _inventory/script-headers.md 로 저장(커밋/푸시)
#   2) Wiki의 Script-Header-Comments.md 로도 반영(커밋/푸시)
# 규칙:
#   - 대상: scripts/g5/**/*.ps1
#   - 머리 주석 없는 스크립트는 제외
#   - 머리 주석 패턴: 연속 '#' / 펜스 블록 ```...``` / PowerShell 블록 <#...#>
#   - 출력은 모두 ```text 코드블록으로 렌더(문자 크기/굵기 통일)
# 실행 트리거:
#   - 수동 실행(workflow_dispatch)
#   - 스크립트/수집기 변경 push 시 자동 실행
# 권한:
#   - contents: write (레포/위키 커밋/푸시)

name: AK • Script Headers → Wiki & Repo

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/g5/**/*.ps1'
      - 'scripts/g5/Extract-ScriptHeaders*.ps1'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout (wiki)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          fetch-depth: 0

      - name: Generate script header docs  #주석(친절한)
        shell: pwsh
        run: |
          # 수집기 자동 탐색(버전/대소문자 오타 방지)
          $script = Get-ChildItem -File -Recurse "scripts/g5/Extract-ScriptHeaders*.ps1" |
                    Sort-Object Name -Descending | Select-Object -First 1
          if (-not $script) { throw "Extract-ScriptHeaders*.ps1 not found under scripts/g5" }
          Write-Host "Using script: $($script.FullName)"

          # 1) _inventory 산출
          pwsh -NoProfile -File $script.FullName -Out ./_inventory/script-headers.md
          # 2) wiki 산출
          pwsh -NoProfile -File $script.FullName -Out ./wiki/Script-Header-Comments.md

          # 요약 출력(앞부분)
          '## Script Headers (head of file)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Content ./_inventory/script-headers.md -TotalCount 60 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Commit back to repo (_inventory) if changed
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _inventory/script-headers.md
          if git diff --cached --quiet; then
            echo "No repo changes."; exit 0
          fi
          git commit -m "docs(scripts): update script header comments [skip ci]"
          BRANCH="${GITHUB_REF_NAME:-$(git symbolic-ref --short HEAD)}"
          git push origin HEAD:"$BRANCH"

      - name: Commit to Wiki (if changed)
        shell: bash
        run: |
          git -C wiki config user.name  "github-actions[bot]"
          git -C wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C wiki add Script-Header-Comments.md
          if git -C wiki diff --cached --quiet; then
            echo "No wiki changes."; exit 0
          fi
          git -C wiki commit -m "docs(scripts): update script header comments"
          git -C wiki push origin HEAD

      - name: Upload artifact (for review)
        uses: actions/upload-artifact@v4
        with:
          name: script-headers
          path: |
            _inventory/script-headers.md
            wiki/Script-Header-Comments.md
          if-no-files-found: error
