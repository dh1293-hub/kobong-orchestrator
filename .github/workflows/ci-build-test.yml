# =========================================
# 이름 : CI / Build & Test (multi-lang auto-detect)
# 용도 : PR의 최소 빌드·테스트 스모크 (언어 자동 감지)
# 트리거 : pull_request (main)
# 권한 : contents: read
# 산출물 : Step Summary(각 언어 결과)
# 의존 : 표준 툴체인(actions/setup-*)
# 주의 : 프로젝트에 없는 언어는 자동 스킵. 5~15분 내 종료 목표.
# =========================================
name: CI / Build & Test
on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-bt-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    if: ${{ hashFiles('**/package.json') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --no-audit; fi
      - name: Test (if present)
        run: |
          npm run -s test --if-present || true
      - name: Summary
        run: echo "### Node: done" >> $GITHUB_STEP_SUMMARY

  python:
    if: ${{ hashFiles('**/pyproject.toml') != '' || hashFiles('**/requirements.txt') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install . || true; fi
      - name: Test (if present)
        run: |
          if [ -f pytest.ini ] || ls -1 tests/*.py >/dev/null 2>&1; then
            python -m pytest -q || true
          else
            echo "no python tests found"
          fi
      - name: Summary
        run: echo "### Python: done" >> $GITHUB_STEP_SUMMARY

  java:
    if: ${{ hashFiles('**/pom.xml') != '' || hashFiles('**/build.gradle*') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Maven/Gradle build+test (best effort)
        shell: bash
        run: |
          if ls -1 **/pom.xml >/dev/null 2>&1; then mvn -B -q -DskipTests=false test || true; fi
          if ls -1 **/build.gradle* >/dev/null 2>&1; then ./gradlew test || gradle test || true; fi
      - name: Summary
        run: echo "### Java: done" >> $GITHUB_STEP_SUMMARY

  cpp:
    if: ${{ hashFiles('**/CMakeLists.txt') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configure & Build (CMake)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release || true
          cmake --build build -j2 || true
      - name: Test (ctest if exists)
        run: |
          if [ -f build/CTestTestfile.cmake ]; then ctest --test-dir build --output-on-failure || true; fi
      - name: Summary
        run: echo "### C++: done" >> $GITHUB_STEP_SUMMARY
