# =========================================
# 이름 : CI / Build & Test (multi-lang auto-detect)
# 용도 : PR의 최소 빌드·테스트 스모크 (언어 자동 감지)
# 트리거 : pull_request (main)
# 권한 : contents: read
# 산출물 : Step Summary(각 언어 결과)
# 의존 : 표준 툴체인(actions/setup-*)
# 주의 : 프로젝트에 없는 언어는 자동 스킵. 5~15분 내 종료 목표.
# =========================================
name: CI / Build & Test
on:
  pull_request:
    branches:
      - main
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-bt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Detect Node
        id: detect_node
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            if [ -f package-lock.json ]; then echo "lock=package-lock.json" >> "$GITHUB_OUTPUT"; fi
            if [ -f npm-shrinkwrap.json ]; then echo "lock=npm-shrinkwrap.json" >> "$GITHUB_OUTPUT"; fi
            if [ -f yarn.lock ]; then echo "lock=yarn.lock" >> "$GITHUB_OUTPUT"; fi
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "lock=" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node (with cache)
        if: steps.detect_node.outputs.present == 'true' && steps.detect_node.outputs.lock != ''
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: ${{ steps.detect_node.outputs.lock }}
      - name: Setup Node (no cache)
        if: steps.detect_node.outputs.present == 'true' && steps.detect_node.outputs.lock == ''
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install
        if: steps.detect_node.outputs.present == 'true'
        shell: bash
        run: |
          if [ -n "${{ steps.detect_node.outputs.lock }}" ]; then
            npm ci --ignore-scripts
          else
            npm install --no-audit
          fi
      - name: Test (if present)
        if: steps.detect_node.outputs.present == 'true'
        shell: bash
        run: npm run -s test --if-present || true
      - name: Summary
        uses: actions/github-script@v7
        with:
          script: |
            const p = '${{ steps.detect_node.outputs.present }}' === 'true';
            const lock = '${{ steps.detect_node.outputs.lock }}';
            await core.summary
              .addHeading('Node', 3)
              .addRaw(p ? `Ran install/test (${lock ? 'cache on' : 'no cache'})` : 'No package.json at repo root. Skipped.')
              .write()

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Detect Python
        id: detect_python
        shell: bash
        run: |
          n=$(git ls-files '**/pyproject.toml' '**/requirements.txt' | wc -l || true)
          if [ "$n" -gt 0 ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.detect_python.outputs.present == 'true'
        with:
          python-version: '3.x'
          cache: pip
      - name: Install
        if: steps.detect_python.outputs.present == 'true'
        shell: bash
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install . || true; fi
      - name: Test (if present)
        if: steps.detect_python.outputs.present == 'true'
        shell: bash
        run: |
          if [ -f pytest.ini ] || ls -1 tests/*.py >/dev/null 2>&1; then
            python -m pytest -q || true
          else
            echo "no python tests found"
          fi
      - name: Summary
        uses: actions/github-script@v7
        with:
          script: |
            const p = '${{ steps.detect_python.outputs.present }}' === 'true';
            await core.summary
              .addHeading('Python', 3)
              .addRaw(p ? 'Ran install/test.' : 'No pyproject/requirements found. Skipped.')
              .write()

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Detect Java
        id: detect_java
        shell: bash
        run: |
          n=$(git ls-files '**/pom.xml' '**/build.gradle*' | wc -l || true)
          if [ "$n" -gt 0 ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        if: steps.detect_java.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven/Gradle build+test (best effort)
        if: steps.detect_java.outputs.present == 'true'
        shell: bash
        run: |
          if ls -1 **/pom.xml >/dev/null 2>&1; then mvn -B -q -DskipTests=false test || true; fi
          if ls -1 **/build.gradle* >/dev/null 2>&1; then ./gradlew test || gradle test || true; fi
      - name: Summary
        uses: actions/github-script@v7
        with:
          script: |
            const p = '${{ steps.detect_java.outputs.present }}' === 'true';
            await core.summary
              .addHeading('Java', 3)
              .addRaw(p ? 'Ran build/test.' : 'No pom.xml/gradle files found. Skipped.')
              .write()

  cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Detect C++
        id: detect_cpp
        shell: bash
        run: |
          n=$(git ls-files '**/CMakeLists.txt' | wc -l || true)
          if [ "$n" -gt 0 ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Configure & Build (CMake)
        if: steps.detect_cpp.outputs.present == 'true'
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release || true
          cmake --build build -j2 || true
      - name: Test (ctest if exists)
        if: steps.detect_cpp.outputs.present == 'true'
        shell: bash
        run: |
          if [ -f build/CTestTestfile.cmake ]; then ctest --test-dir build --output-on-failure || true; fi
      - name: Summary
        uses: actions/github-script@v7
        with:
          script: |
            const p = '${{ steps.detect_cpp.outputs.present }}' === 'true';
            await core.summary
              .addHeading('C++', 3)
              .addRaw(p ? 'Ran cmake/ctest.' : 'No CMakeLists.txt found. Skipped.')
              .write()
