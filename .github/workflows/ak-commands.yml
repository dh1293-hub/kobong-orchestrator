# ===========================================
# AK-COMMANDS : Kobong-Orchestrator ChatOps
# ===========================================
# ✔ logs/ 추적파일 차단 (no-tracked-logs 게이트)
# ✔ 수동 트리거 입력(cmd/args)
# ✔ YAML 구조 오류 및 commitStatus 오류 정정
# -------------------------------------------

name: AK Commands (ChatOps)

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "실행할 커맨드 (예: bash, pwsh, gh …)"
        required: true
        type: string
      args:
        description: "인수(그대로 전달; 공백/따옴표 포함 가능)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  guard-logs:
    name: Guard logs/ (no tracked logs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Fail if tracked files exist in logs/
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mapfile -t tracked < <(git ls-files 'logs/*' ':!:logs/.gitkeep' || true)
          if (( ${#tracked[@]} > 0 )); then
            printf '%s\n' "${tracked[@]}" | sed 's/^/ - /' | tee /tmp/tracked.txt
            echo "::error::Tracked files under logs/:"
            cat /tmp/tracked.txt
            exit 1
          fi
          echo "OK: logs/ 에 추적 중인 파일이 없습니다(.gitkeep 제외)."

  run:
    name: Run Command
    runs-on: ubuntu-latest
    needs: guard-logs
    env:
      # gh CLI가 필요할 때 자동 사용
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: 입력 확인
        shell: bash
        run: |
          echo "입력 커맨드 : ${{ inputs.cmd }}"
          echo "입력 인수   : ${{ inputs.args }}"

      - name: 명령 실행
        id: exec
        shell: bash
        env:
          CMD_IN: ${{ inputs.cmd }}
          ARGS_IN: ${{ inputs.args }}
        run: |
          set -euo pipefail

          cmd="${CMD_IN}"
          args="${ARGS_IN}"

          if [[ -z "${cmd}" ]]; then
            echo "::error::cmd 가 비어있습니다."
            exit 2
          fi

          # 인용(quoting) 문제를 피하기 위해 임시 스크립트로 실행
          script="$(mktemp)"
          {
            echo '#!/usr/bin/env bash'
            echo 'set -euo pipefail'
            echo "echo \"▶ ${cmd} ${args}\""
            if [[ "${cmd}" == "pwsh" ]]; then
              # pwsh의 경우 사용자가 -Command/-File 을 args에 포함해 전달합니다.
              echo "pwsh ${args}"
            else
              # bash/gh/기타는 그대로 실행
              echo "${cmd} ${args}"
            fi
          } >"${script}"
          chmod +x "${script}"
          "${script}"

      - name: 완료
        if: always()
        shell: bash
        run: echo "결론:${{ steps.exec.conclusion }}"

