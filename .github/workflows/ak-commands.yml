# ===========================================
# AK-COMMANDS : Kobong-Orchestrator ChatOps
# ===========================================
# ✔ logs/ 추적파일 차단 (no-tracked-logs 게이트)
# ✔ 수동 트리거 입력(cmd/args)
# ✔ YAML 구조 오류 및 commitStatus 오류 정정
# -------------------------------------------

name: AK Commands (ChatOps)

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: '실행할 커맨드 (bash | pwsh | gh | 기타)'
        required: true
        type: string
      args:
        description: '인수(쉘에서 치는 그대로)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  guard-logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Ensure no tracked files under logs/ (except .gitkeep)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tracked < <(git ls-files 'logs/*' | grep -v '^logs/.gitkeep$' || true)
          if (( ${#tracked[@]} )); then
            printf '::error::Tracked files under logs/: %s\n' "${tracked[@]}"
            exit 1
          fi

  run-command:
    needs: guard-logs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: 입력 확인
        shell: bash
        run: |
          echo "입력 커맨드 : ${{ inputs.cmd }}"
          echo "입력 인수   : ${{ inputs.args }}"

      - name: Run Command
        shell: bash
        env:
          # ❗️절대 'cmd=' 같은 접두어 넣지 않음
          CMD: ${{ inputs.cmd }}
          ARGS: ${{ inputs.args }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${CMD}" ]]; then
            echo "::error::CMD is empty"; exit 1
          fi

          case "${CMD}" in
            pwsh|powershell|pwsh.exe)
              if [[ -z "${ARGS}" ]]; then
                echo "::error::pwsh에는 ARGS가 필요합니다 (예: -NoProfile -Command \"...\" 또는 -File path.ps1)"; exit 1
              fi
              pwsh -NoProfile ${ARGS}
              ;;

            bash|sh|/bin/bash)
              if [[ -z "${ARGS}" ]]; then
                echo "::error::bash에는 ARGS가 필요합니다 (예: -lc 'echo ok')"; exit 1
              fi
              # 사용자가 -lc를 안 넣어도 최소 실행되게 보정
              if [[ "${ARGS}" =~ ^-l?c[[:space:]] ]]; then
                bash ${ARGS}
              else
                bash -lc "${ARGS}"
              fi
              ;;

            gh)
              export GH_TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
              if [[ -z "${GH_TOKEN}" ]]; then
                echo "::error::GH_TOKEN not set"; exit 4
              fi
              gh ${ARGS}
              ;;

            *)
              # 일반 커맨드
              ${CMD} ${ARGS}
              ;;
          esac

          echo "✅ 명령 실행 완료"
