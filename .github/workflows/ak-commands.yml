# DEPRECATED / QUARANTINE STUB
# 목적: 기존 ak-commands 워크플로우의 자동 트리거를 모두 비활성화하고
#      CI 소음을 제거하기 위해 수동 실행만 허용한다.
# 주의: 필요 시 PR에서 "Run workflow"로만 실행 가능.
name: AK / Commands (quarantined)
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ak-commands-quarantine
  cancel-in-progress: true

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ak-commands quarantined. Use KLC v2 flows."

      - name: "Resolve inputs"
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pr=${{ inputs.pr }}" >> "$GITHUB_OUTPUT"
            echo "cmd=${{ inputs.command }}" >> "$GITHUB_OUTPUT"
            echo "raw=${{ inputs.rawargs }}" >> "$GITHUB_OUTPUT"
          else
            body=$(printf "%s" "${{ github.event.comment.body }}")
            # /ak <cmd> [args...]
            cmd=$(printf "%s\n" "$body" | sed -n 's!.*/ak[[:space:]]\+\([a-z0-9-]\+\).*!\1!p')
            raw=$(printf "%s\n" "$body" | sed -n 's!.*/ak[[:space:]]\+[a-z0-9-]\+\(.*\)$!\1!p' | sed 's/^[[:space:]]\+//')
            echo "pr=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "cmd=$cmd" >> "$GITHUB_OUTPUT"
            echo "raw=$raw" >> "$GITHUB_OUTPUT"
          fi

      - name: "Checkout PR head"
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.resolve.outputs.pr }}/head
          fetch-depth: 1

      - name: "Bootstrap ak logs"
        shell: bash
        run: |
          mkdir -p logs
          printf '{"timestamp":"%s","level":"INFO","action":"bootstrap","message":"init"}\n' "$(date -Iseconds)" >> logs/ak7.jsonl

      # git 128 방지: scripts/g5는 main에서 zipball 하이드레이트
      - name: "Hydrate scripts/g5 from main"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'g5.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'g5-unzip'
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "X-GitHub-Api-Version"="2022-11-28" }
          $url = "https://api.github.com/repos/$env:REPO/zipball/main"
          Invoke-WebRequest -Headers $headers -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $root = Get-ChildItem $tmp | Where-Object {$_.PSIsContainer} | Select-Object -First 1
          if (-not (Test-Path "$($root.FullName)/scripts/g5/ak-dispatch.ps1")) { throw "scripts/g5/ak-dispatch.ps1 not found in main" }
          Remove-Item -Recurse -Force scripts/g5 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force scripts | Out-Null
          Copy-Item -Recurse -Force "$($root.FullName)/scripts/g5" "scripts/g5"
          Get-ChildItem -Recurse scripts/g5

      - name: "Dispatch"
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $cmd = '${{ steps.resolve.outputs.cmd }}'
          $pr  = '${{ steps.resolve.outputs.pr }}'
          $raw = '${{ steps.resolve.outputs.raw }}'
          ./scripts/g5/ak-dispatch.ps1 -Command $cmd -Pr $pr -RawArgs $raw

      # 워크플로 정합성 선점 검사(선택): 레포 내 다른 *.yml 오류도 잡힐 수 있음
      - name: "Workflow lint (actionlint)"
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          level: error

      - name: "Upload ak logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ak7-logs
          path: logs/ak7.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: "Post start/result"
        if: ${{ github.event_name == 'issue_comment' || github.event_name == 'workflow_dispatch' }}
        uses: actions/github-script@v7
        with:
          script: |
            const pr  = '${{ steps.resolve.outputs.pr }}';
            const cmd = '${{ steps.resolve.outputs.cmd }}';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `✅ /ak **${cmd}** started for PR #${pr}\n\nRun: ${url}\n<!-- ak-commands:runId=${{ github.run_id }} -->`;
            if (context.eventName === 'issue_comment') {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(pr), body });
            } else {
              core.summary.addHeading('/ak').addRaw(body).write();
            }
