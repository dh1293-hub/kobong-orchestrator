+name: Weekly Housekeeping
+
+on:
+  schedule:
+    - cron: '0 2 * * 1'   # 매주 월요일 11:00 KST (UTC+9)
+  workflow_dispatch:
+
+permissions:
+  actions: write
+  contents: read
+
+jobs:
+  clean:
+    runs-on: ubuntu-latest
+    steps:
+      - name: Delete old workflow runs (≥14d)
+        uses: actions/github-script@v7
+        with:
+          script: |
+            const cutoff = Date.now() - 14*24*60*60*1000;
+            let page = 1, deleted = 0;
+            while (true) {
+              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
+                owner: context.repo.owner, repo: context.repo.repo,
+                per_page: 100, page
+              });
+              if (!data.workflow_runs?.length) break;
+              for (const run of data.workflow_runs) {
+                if (new Date(run.created_at).getTime() < cutoff) {
+                  await github.rest.actions.deleteWorkflowRun({
+                    owner: context.repo.owner, repo: context.repo.repo, run_id: run.id
+                  }).catch(() => {});
+                  deleted++;
+                }
+              }
+              page++;
+            }
+            core.notice(`Deleted runs: ${deleted}`);
+
+      - name: Prune old caches (≥14d)
+        uses: actions/github-script@v7
+        with:
+          script: |
+            const cutoff = Date.now() - 14*24*60*60*1000;
+            let after = undefined, pruned = 0;
+            while (true) {
+              const { data } = await github.request('GET /repos/{owner}/{repo}/actions/caches', {
+                owner: context.repo.owner, repo: context.repo.repo, per_page: 100, after
+              });
+              const list = data.actions_caches || [];
+              if (!list.length) break;
+              for (const c of list) {
+                if (new Date(c.created_at).getTime() < cutoff) {
+                  await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}', {
+                    owner: context.repo.owner, repo: context.repo.repo, cache_id: c.id
+                  }).catch(() => {});
+                  pruned++;
+                }
+              }
+              after = data?.pagination?.next ?? undefined;
+              if (!after) break;
+            }
+            core.notice(`Pruned caches: ${pruned}`);
+
+      - name: Delete artifacts older than 14d
+        uses: actions/github-script@v7
+        with:
+          script: |
+            const cutoff = Date.now() - 14*24*60*60*1000;
+            let page = 1, deleted = 0;
+            while (true) {
+              const { data } = await github.rest.actions.listArtifactsForRepo({
+                owner: context.repo.owner, repo: context.repo.repo, per_page: 100, page
+              });
+              if (!data.artifacts?.length) break;
+              for (const a of data.artifacts) {
+                if (new Date(a.created_at).getTime() < cutoff) {
+                  await github.rest.actions.deleteArtifact({
+                    owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id
+                  }).catch(() => {});
+                  deleted++;
+                }
+              }
+              page++;
+            }
+            core.notice(`Deleted artifacts: ${deleted}`);
