name: Weekly Housekeeping

on:
  schedule:
    - cron: '0 2 * * 1'   # 매주 월요일 11:00 KST
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete runs older than 14 days
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 14*24*60*60*1000;
            let page = 1, deleted = 0;
            while (true) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                per_page: 100, page
              });
              if (!data.workflow_runs || data.workflow_runs.length === 0) break;
              for (const run of data.workflow_runs) {
                if (new Date(run.created_at).getTime() < cutoff) {
                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner: context.repo.owner, repo: context.repo.repo, run_id: run.id
                    });
                    deleted++;
                  } catch {}
                }
              }
              page++;
            }
            core.notice(`Deleted runs: ${deleted}`);

      - name: Delete artifacts older than 14 days
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 14*24*60*60*1000;
            let page = 1, deleted = 0;
            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner, repo: context.repo.repo, per_page: 100, page
              });
              if (!data.artifacts || data.artifacts.length === 0) break;
              for (const a of data.artifacts) {
                if (new Date(a.created_at).getTime() < cutoff) {
                  try {
                    await github.rest.actions.deleteArtifact({
                      owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id
                    });
                    deleted++;
                  } catch {}
                }
              }
              page++;
            }
            core.notice(`Deleted artifacts: ${deleted}`);
