name: Weekly Auto Release Smoke

on:
  schedule:
    - cron: '0 0 * * 0'   # 매주 일요일 00:00 UTC (KST 09:00)
  workflow_dispatch:

permissions:
  contents: write   # 태그/릴리즈 생성·삭제

concurrency:
  group: weekly-auto-release-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO: ${{ github.repository }}
      SHA:  ${{ github.sha }}

    steps:
      # 1) 체크아웃 + git 환경 고정 (128 방지)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # 전체 히스토리
      - name: Prepare git
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # 원격에 토큰이 잡혀 있음(Checkout 기본). 태그 목록 확보
          git fetch --tags --force

      # 2) 다음 v0.0.X 태그 생성(annotated) → 진짜 git push
      - name: Create and push tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          # 기존 v0.0.X 중 가장 큰 번호 +1
          last=$(git tag -l 'v0.0.*' | sed -n 's/^v0\.0\.\([0-9]\+\)$/\1/p' | sort -n | tail -1)
          next=${last:-0}; next=$((next+1))
          TAG="v0.0.${next}"
          git tag -a "$TAG" -m "smoke(auto-release): $TAG" "$SHA"
          git push origin "refs/tags/$TAG"
          echo "TAG=$TAG" | tee -a "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 3) 릴리즈 생성 대기 (릴리즈 워크플로가 태그를 잡아 생성해야 PASS)
      - name: Wait for release to appear
        id: wait_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${TAG:?missing}"
          ok=0
          for i in $(seq 1 60); do   # 최대 10분(10초 × 60회)
            if gh release view "$tag" >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::release not detected for tag $tag"
            exit 1
          fi
          rid=$(gh release view "$tag" --json id -q .id)
          echo "rid=$rid" >> "$GITHUB_OUTPUT"
          echo "Release detected: $rid"

      # 4) 정리(항상): 릴리즈/태그 제거
      - name: Cleanup release and tag (always)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${TAG:-}"
          if [ -n "$tag" ]; then
            if gh release view "$tag" >/dev/null 2>&1; then
              rid=$(gh release view "$tag" --json id -q .id)
              gh release delete "$tag" -y || true
              echo "deleted release $rid"
            fi
            git push origin ":refs/tags/$tag" || true
            echo "deleted tag $tag"
          fi

      # 5) 요약
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Auto-release smoke"
            echo "- Tag: \`$TAG\`"
            echo "- Result: $([ "${{ job.status }}" = "success" ] && echo '✅ PASS' || echo '❌ FAIL')"
          } >> "$GITHUB_STEP_SUMMARY"
