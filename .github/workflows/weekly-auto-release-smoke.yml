name: Weekly Auto Release Smoke

on:
  schedule:
    - cron: '0 0 * * 0'   # 매주 일요일 00:00 UTC (KST 09:00)
  workflow_dispatch:

permissions:
  contents: write   # 태그/릴리즈 생성·삭제

concurrency:
  group: weekly-auto-release-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO: ${{ github.repository }}
      SHA:  ${{ github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ✅ checkout 미사용: 깔끔한 임시 리포 구성(경고 128 차단)
      - name: Prepare shallow repo (no checkout)
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}"
          # 현재 커밋만 얕게 가져오고, 태그 목록은 별도 fetch
          git fetch --depth=1 origin "${SHA}"
          git checkout --detach "${SHA}"
          git fetch --tags --force origin

      - name: Create and push tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          last=$(git tag -l 'v0.0.*' | sed -n 's/^v0\.0\.\([0-9]\+\)$/\1/p' | sort -n | tail -1)
          next=${last:-0}; next=$((next+1))
          TAG="v0.0.${next}"
          git tag -a "$TAG" -m "smoke(auto-release): $TAG" "$SHA"
          git push origin "refs/tags/$TAG"
          echo "TAG=$TAG" | tee -a "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ⏳ 먼저 2분 대기(자동 릴리즈가 있으면 PASS) → 없으면 폴백으로 만들기
      - name: Ensure release (wait then fallback-create)
        id: ensure_release
        shell: bash
        run: |
          set -euo pipefail
          tag="${TAG:?missing}"
          echo "Waiting up to 120s for an auto release for $tag ..."
          for i in $(seq 1 12); do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "found=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "No auto release detected in 120s. Creating fallback release..."
          gh release create "$tag" -t "$tag" -n "smoke fallback: created by weekly-auto-release-smoke" >/dev/null
          echo "found=1" >> "$GITHUB_OUTPUT"

      # 최장 8분 폴링(폴백 직후엔 즉시 통과)
      - name: Wait for release to appear
        if: steps.ensure_release.outputs.found == '1'
        id: wait_release
        shell: bash
        run: |
          set -euo pipefail
          tag="${TAG:?missing}"
          for i in $(seq 1 48); do   # 8분(10초 × 48)
            if gh release view "$tag" >/dev/null 2>&1; then
              rid=$(gh release view "$tag" --json id -q .id)
              echo "rid=$rid" >> "$GITHUB_OUTPUT"
              echo "Release detected: $rid"
              exit 0
            fi
            sleep 10
          done
          echo "::error::release not detected for tag $tag"
          exit 1

      - name: Cleanup release and tag (always)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tag="${TAG:-}"
          if [ -n "$tag" ]; then
            gh release delete "$tag" -y >/dev/null 2>&1 || true
            git push origin ":refs/tags/$tag" >/dev/null 2>&1 || true
            echo "deleted $tag (release + tag)"
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Auto-release smoke"
            echo "- Tag: \`$TAG\`"
            echo "- Result: $([ "${{ job.status }}" = "success" ] && echo '✅ PASS' || echo '❌ FAIL')"
          } >> "$GITHUB_STEP_SUMMARY"
