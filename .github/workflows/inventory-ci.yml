# ========================================================================
# inventory/ci
# 목적:
#   - 저장소의 GitHub Actions 워크플로(.yml/.yaml)를 스캔해
#     _inventory/workflows/inventory.json, inventory.csv 를 생성
#   - (옵션) 변경이 있으면 _inventory/ 경로로 PR 발행 / 정책 허용 시 자동머지
#
# 트리거:
#   - pull_request/push: 워크플로/액션/스クリپ트 변경 시 자동 실행
#   - workflow_dispatch: 수동 수행 + 발행/자동머지 토글 가능
#
# 산출물:
#   - _inventory/workflows/inventory.json  (모니터링 UI가 바로 읽을 수 있는 스키마)
#   - _inventory/workflows/inventory.csv   (간단 조회/엑셀 확인용)
#   - CI 아티팩트(workflows-inventory-<run_id>)에도 업로드
#
# 안전가드/정책:
#   - 최소 권한(contents: read)
#   - 변경이 없으면 PR 생략 (idempotent)
#   - _inventory/ 이외 파일 변경이 감지되면 자동머지 스킵(보수적)
#   - 저장소에서 Auto-merge 허용 안되면 자동머지 스텝이 알아서 무해하게 종료
#
# 참고:
#   - 불린 입력은 문자열로 처리('true'/'false') → YAML 파서 혼동 방지
#   - 파이썬 코드는 .github/tools/gen_inventory.py 로 분리 (파서 에러 원천 차단)
# ========================================================================

name: inventory/ci

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/g5/**'
      - '.github/workflows/inventory-ci.yml'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/g5/**'
      - '.github/workflows/inventory-ci.yml'
  workflow_dispatch:
    inputs:
      publish_pr:
        description: '인벤토리를 _inventory/ 로 PR 발행할지 여부'
        type: choice
        options: ['true', 'false']   # ⚠️ 문자열 리터럴(불린 리터럴 사용 금지)
        default: 'true'
      auto_merge:
        description: '인벤토리 PR 자동 머지(저장소 정책 허용 시)'
        type: choice
        options: ['true', 'false']
        default: 'false'

permissions:
  # 최소 권한 원칙: 읽기만 필요. PR 생성 단계에서만 개별 job에서 write로 상향.
  contents: read

concurrency:
  # 같은 ref에서 중복 실행 시 이전 작업 취소 → 러너 절약/경쟁 상태 방지
  group: inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare requirements (pin)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/tools
          echo 'pyyaml==6.0.2' > .github/tools/requirements.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: .github/tools/requirements.txt  # ← 요게 핵심!

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check --no-input -r .github/tools/requirements.txt

      - name: Generate inventory JSON/CSV
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tools/gen_inventory.py


      - name: 'Setup Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'     # pyyaml 캐시로 속도 ↑

      - name: 'Install deps'
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check --no-input pyyaml==6.0.2

      - name: 'Generate inventory JSON/CSV'
        # 핵심: 분리된 스크립트를 그대로 실행 → YAML 파서가 코드에 관여 X
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tools/gen_inventory.py

      - name: 'Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: workflows-inventory-${{ github.run_id }}
          path: |
            _inventory/workflows/inventory.json
            _inventory/workflows/inventory.csv
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # PR에선 산출만, main push 또는 수동(입력 허용)일 때만 발행
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_pr == 'true')
    permissions:
      contents: write       # PR 브랜치 푸시용
      pull-requests: write  # PR 생성/병합용

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 'Download inventory artifacts'
        uses: actions/download-artifact@v4
        with:
          path: _inventory/_ci_artifacts
          merge-multiple: true
          pattern: workflows-inventory-*

      - name: 'Stage _inventory (dedupe)'
        # 중복을 피하기 위해 _ci_artifacts → _inventory 로 병합 후 _ci_artifacts 제거
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _inventory/workflows
          if command -v rsync >/dev/null 2>&1; then
            rsync -a _inventory/_ci_artifacts/ _inventory/
          else
            shopt -s dotglob
            cp -R _inventory/_ci_artifacts/* _inventory/ || true
          fi
          rm -rf _inventory/_ci_artifacts
          find _inventory -maxdepth 2 -type f -print

      - name: 'Commit & open PR (only if changes)'
        id: openpr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "wf-inventory-bot"
          git config user.email "wf-inventory-bot@users.noreply.github.com"

          branch="bot/inventory-${GITHUB_RUN_ID}"
          git checkout -b "$branch"

          git add -f _inventory/*
          git rm -r --cached _inventory/_ci_artifacts 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes in _inventory → skip PR."
            exit 0
          fi

          git commit -m "[WF] workflows inventory (run=${GITHUB_RUN_ID})"
          git push --set-upstream origin "$branch"

          base="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"
          out="$(gh pr create --base "$base" --head "$branch" \
                 --title "[WF] workflows inventory ${GITHUB_RUN_ID}" \
                 --body "자동 생성 인벤토리(_inventory/workflows/*)")" || true

          pr=""
          if echo "$out" | grep -Eo '/pull/[0-9]+' >/dev/null; then
            pr="$(echo "$out" | grep -Eo '/pull/[0-9]+' | grep -Eo '[0-9]+' | tail -1)"
          else
            pr="$(gh pr view --head "$branch" --json number -q .number || true)"
          fi

          echo "pr=${pr}" >> "$GITHUB_OUTPUT"
          echo "Opened PR #${pr}"

      - name: 'Enable auto-merge (optional/safe)'
        # _inventory/ 외 파일이 섞인 경우는 자동머지 금지(보수적)
        if: ${{ steps.openpr.outputs.pr && inputs.auto_merge == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="${{ steps.openpr.outputs.pr }}"
          files="$(gh pr view "$pr" --json files -q '.files[].path')"
          if echo "$files" | grep -v '^_inventory/' >/dev/null; then
            echo "Skip automerge: non-inventory changes detected."
            exit 0
          fi
          auto="$(gh repo view --json autoMergeAllowed -q .autoMergeAllowed || echo false)"
          if [ "$auto" != "true" ]; then
            echo "Skip automerge: repository auto-merge disabled."
            exit 0
          fi
          gh pr merge "$pr" --squash --auto || {
            echo "::warning::Automerge not enabled (policy)."; exit 0;
          }
