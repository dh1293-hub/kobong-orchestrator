# ========================================================================
# inventory/ci (보안·산출물 보강본)
# 목적:
#   - 저장소의 GitHub Actions 워크플로(.yml/.yaml)를 스캔해
#     _inventory/workflows/inventory.json, inventory.csv 를 생성
#   - (옵션) 변경이 있으면 _inventory/ 경로로 PR 발행 / 정책 허용 시 자동머지
#
# 트리거:
#   - pull_request: 워크플로/액션/스크립트 변경 시 자동 실행 (fork PR도 '읽기'만)
#   - push@main: 운용 브랜치에서 변경 시
#   - workflow_dispatch: 수동 수행 + 발행/자동머지 토글 가능
#
# 산출물(보장):
#   - _inventory/workflows/inventory.json  (모니터링 UI 스키마)
#   - _inventory/workflows/inventory.csv   (간단 조회/엑셀)
#   - CI 아티팩트(workflows-inventory-<run_id>) 업로드
#   - Job Summary에 파일 목록/카운트 기록
#
# 보안:
#   - 기본 permissions: read-only
#   - publish 잡에서만 contents/pull-requests: write
#   - checkout은 persist-credentials: false (토큰 주입 차단)
#   - PR 자동머지는 _inventory/* 외 파일 섞이면 즉시 차단
#   - action 버전은 @v* 표기(실 운영 시 커밋 SHA pin 권장)
# ========================================================================

name: inventory/ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/g5/**'
      - '.github/workflows/inventory-ci.yml'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/g5/**'
      - '.github/workflows/inventory-ci.yml'
  workflow_dispatch:
    inputs:
      publish_pr:
        description: '_inventory/ 로 PR 발행 여부'
        type: choice
        options: ['false','true']
        default: 'false'
      auto_merge:
        description: 'PR 자동머지(정책 허용 + _inventory/* 한정)'
        type: choice
        options: ['false','true']
        default: 'false'

# ✅ 워크플로: 서브모듈 비활성 + 최소권한 + 읽기전용
permissions:
  contents: read  # 보안: 읽기만

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (read-only; no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 히스토리 필요한 작업 대비
          submodules: 'false'   # ⚠️ 강제 비활성 (깨진 .gitmodules라도 foreach 안탐)
          persist-credentials: false

      # (선택) 러너 하드닝 — 실 운영 시 커밋 SHA로 pin 권장
      # - name: Harden runner (egress lock)
      #   uses: step-security/harden-runner@v2
      #   with:
      #     egress-policy: audit

      # (기존) Checkout 스텝은 보안·안정 위해 이렇게 유지 권장
      - name: Checkout (read-only; no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'false'         # 깨진 submodule 회피
          persist-credentials: false  # 토큰 주입 차단
      
      # (기존) 파이썬/의존 설치 후, 반드시 출력 폴더를 미리 생성
      - name: Prepare output dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _inventory/workflows
      
      # (기존) 생성기 실행 — 실패해도 다음 단계에서 정규화로 커버
      - name: Generate inventory (repo script)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ".github/tools/gen_inventory.py" ]; then
            python3 .github/tools/gen_inventory.py || true
          else
            echo "::warning::.github/tools/gen_inventory.py not found."
          fi
      
      # ✅ 추가: "산출물 정규화(이동·리네임)" — 양쪽 네이밍 모두 흡수
# ... (생략) build 또는 publish job 안 "정규화/업로드/커밋" 구간 교체

      # 1) 산출물 정규화: 이름 통일(→ index.*), 중복 제거
      - name: Normalize outputs (rename → index.*; dedupe)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _inventory/workflows
      
          # 루트/하위 어디에 있든 표준명으로 이동
          mv -f _inventory/workflows.json              _inventory/workflows/index.json  2>/dev/null || true
          mv -f _inventory/workflows.csv               _inventory/workflows/index.csv   2>/dev/null || true
          mv -f _inventory/workflows/inventory.json    _inventory/workflows/index.json  2>/dev/null || true
          mv -f _inventory/workflows/inventory.csv     _inventory/workflows/index.csv   2>/dev/null || true
          mv -f _inventory/workflows/workflows.json    _inventory/workflows/index.json  2>/dev/null || true
          mv -f _inventory/workflows/workflows.csv     _inventory/workflows/index.csv   2>/dev/null || true
      
          # 최소 보장(빈 산출 방지)
          test -s _inventory/workflows/index.json || echo "[]" > _inventory/workflows/index.json
          test -s _inventory/workflows/index.csv  || echo "path,triggers" > _inventory/workflows/index.csv
      
          # 레거시 이름 제거(충돌 방지)
          rm -f _inventory/workflows.json _inventory/workflows.csv \
                _inventory/workflows/inventory.json _inventory/workflows/inventory.csv \
                _inventory/workflows/workflows.json _inventory/workflows/workflows.csv || true
      
          # 루트 파일 재유입 방지
          touch .gitignore
          { echo "_inventory/workflows.json"; echo "_inventory/workflows.csv"; } >> .gitignore
          sort -u .gitignore -o .gitignore
      
      # 2) 업로드는 표준 파일 2개만
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflows-inventory-${{ github.run_id }}
          path: |
            _inventory/workflows/index.json
            _inventory/workflows/index.csv
          if-no-files-found: error
          retention-days: 7
      
      # 3) 커밋/PR: 표준 파일만 스테이징, 루트 레거시는 강제 제거
      - name: Commit & open/update single PR
        id: openpr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "wf-inventory-bot"
          git config user.email "wf-inventory-bot@users.noreply.github.com"
          branch="bot/wf-inventory"
          git checkout -B "$branch"
      
          # 표준 파일 + .gitignore만 반영
          git add -f _inventory/workflows/index.json _inventory/workflows/index.csv .gitignore
      
          # 루트 레거시가 이미 트래킹 중이면 제거
          git rm -f _inventory/workflows.json _inventory/workflows.csv 2>/dev/null || true
      
          if git diff --cached --quiet; then
            echo "No changes → skip PR open/update."; exit 0
          fi
      
          git commit -m "[WF] workflows inventory → index.(json|csv) (canonicalize & dedupe)"
          git push -f --set-upstream origin "$branch"
      
          base="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"
          out="$(gh pr create --base "$base" --head "$branch" \
                 --title "[WF] workflows inventory (canonical index.*)" \
                 --body "단일 진실원본(SSOT): _inventory/workflows/index.json,csv\n레거시 제거 + .gitignore 가드")" || true
          pr="$(gh pr view --head "$branch" --json number -q .number || true)"
          echo "pr=${pr}" >> "$GITHUB_OUTPUT"
          echo "Opened/updated PR #${pr}"
      
      # 4) 자동머지 미허용이어도 실패로 처리하지 않음(정책 친화)
      - name: Enable auto-merge (optional)
        if: ${{ steps.openpr.outputs.pr }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="${{ steps.openpr.outputs.pr }}"
          gh pr merge "$pr" --squash --auto \
            && echo "Automerge requested." \
            || echo "::notice::Automerge not enabled (policy). Job continues."
