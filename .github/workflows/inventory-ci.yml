# ========================================================================
# inventory/ci (보안·산출물 보강본)
# 목적:
#   - 저장소의 GitHub Actions 워크플로(.yml/.yaml)를 스캔해
#     _inventory/workflows/inventory.json, inventory.csv 를 생성
#   - (옵션) 변경이 있으면 _inventory/ 경로로 PR 발행 / 정책 허용 시 자동머지
#
# 트리거:
#   - pull_request: 워크플로/액션/스크립트 변경 시 자동 실행 (fork PR도 '읽기'만)
#   - push@main: 운용 브랜치에서 변경 시
#   - workflow_dispatch: 수동 수행 + 발행/자동머지 토글 가능
#
# 산출물(보장):
#   - _inventory/workflows/inventory.json  (모니터링 UI 스키마)
#   - _inventory/workflows/inventory.csv   (간단 조회/엑셀)
#   - CI 아티팩트(workflows-inventory-<run_id>) 업로드
#   - Job Summary에 파일 목록/카운트 기록
#
# 보안:
#   - 기본 permissions: read-only
#   - publish 잡에서만 contents/pull-requests: write
#   - checkout은 persist-credentials: false (토큰 주입 차단)
#   - PR 자동머지는 _inventory/* 외 파일 섞이면 즉시 차단
#   - action 버전은 @v* 표기(실 운영 시 커밋 SHA pin 권장)
# ========================================================================

name: inventory/ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/g5/**'
      - '.github/workflows/inventory-ci.yml'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/g5/**'
      - '.github/workflows/inventory-ci.yml'
  workflow_dispatch:
    inputs:
      publish_pr:
        description: '_inventory/ 로 PR 발행 여부'
        type: choice
        options: ['false','true']
        default: 'false'
      auto_merge:
        description: 'PR 자동머지(정책 허용 + _inventory/* 한정)'
        type: choice
        options: ['false','true']
        default: 'false'

# 기본은 읽기 전용. 잡별로 상향.
permissions:
  contents: read

concurrency:
  # 같은 ref에서 중복 실행 시 이전 작업 취소 → 러너 절약/경쟁 상태 방지
  group: inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # fork PR에서도 실행해도 안전(읽기 전용 + 산출물 업로드만)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      # (선택) 러너 하드닝 — 실 운영 시 커밋 SHA로 pin 권장
      # - name: Harden runner (egress lock)
      #   uses: step-security/harden-runner@v2
      #   with:
      #     egress-policy: audit

      - name: Checkout (read-only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install deps (pin minimal)
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check --no-input pyyaml==6.0.2

      - name: Prepare output dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _inventory/workflows

      - name: Generate inventory (primary, repo script)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ".github/tools/gen_inventory.py" ]; then
            python3 .github/tools/gen_inventory.py
          else
            echo "::warning::.github/tools/gen_inventory.py not found. Will run fallback."
          fi

      - name: Fallback generator (guarantee artifacts)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s _inventory/workflows/inventory.json ] || [ ! -s _inventory/workflows/inventory.csv ]; then
            python3 - <<'PY'
            import os, json, csv, glob, sys
            try:
              import yaml  # type: ignore
            except Exception:
              yaml = None
            root = ".github/workflows"
            rows = []
            for p in sorted(glob.glob(os.path.join(root, "*.y*ml"))):
                triggers = []
                if yaml:
                    try:
                        with open(p, encoding="utf-8") as f:
                            y = list(yaml.safe_load_all(f))
                        if y:
                            on = y[0].get("on") or {}
                            if isinstance(on, dict):
                                triggers = list(on.keys())
                            elif isinstance(on, list):
                                triggers = on
                    except Exception:
                        pass
                rows.append({"path": p, "triggers": triggers})
            os.makedirs("_inventory/workflows", exist_ok=True)
            with open("_inventory/workflows/inventory.json","w",encoding="utf-8") as f:
                json.dump(rows, f, ensure_ascii=False, indent=2)
            with open("_inventory/workflows/inventory.csv","w",newline="",encoding="utf-8") as f:
                w=csv.writer(f); w.writerow(["path","triggers"])
                for r in rows: w.writerow([r["path"], "|".join(r["triggers"])])
            PY
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflows-inventory-${{ github.run_id }}
          path: |
            _inventory/workflows/inventory.json
            _inventory/workflows/inventory.csv
          if-no-files-found: error
          retention-days: 7

      - name: Job Summary
        shell: bash
        run: |
          set -euo pipefail
          echo "### workflows inventory" >> "$GITHUB_STEP_SUMMARY"
          if [ -d _inventory/workflows ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            ls -lah _inventory/workflows >> "$GITHUB_STEP_SUMMARY" || true
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No directory '_inventory/workflows' found." >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # PR에선 산출만, main push 또는 수동(입력 허용)일 때만 발행
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_pr == 'true')
    permissions:
      contents: write       # PR 브랜치 푸시용
      pull-requests: write  # PR 생성/병합용

    steps:
      - name: Checkout (write intent)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download inventory artifacts
        uses: actions/download-artifact@v4
        with:
          path: _inventory/_ci_artifacts
          merge-multiple: true
          pattern: workflows-inventory-*

      - name: Stage _inventory (dedupe)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _inventory
          if command -v rsync >/dev/null 2>&1; then
            rsync -a _inventory/_ci_artifacts/ _inventory/
          else
            shopt -s dotglob
            cp -R _inventory/_ci_artifacts/* _inventory/ || true
          fi
          rm -rf _inventory/_ci_artifacts
          find _inventory -maxdepth 2 -type f -print

      - name: Commit & open PR (only if changes)
        id: openpr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "wf-inventory-bot"
          git config user.email "wf-inventory-bot@users.noreply.github.com"
          branch="bot/inventory-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -f _inventory/*
          git rm -r --cached _inventory/_ci_artifacts 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes in _inventory → skip PR."
            exit 0
          fi
          git commit -m "[WF] workflows inventory (run=${GITHUB_RUN_ID})"
          git push --set-upstream origin "$branch"
          base="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"
          out="$(gh pr create --base "$base" --head "$branch" \
                 --title "[WF] workflows inventory ${GITHUB_RUN_ID}" \
                 --body "자동 생성 인벤토리(_inventory/workflows/*)")" || true
          pr=""
          if echo "$out" | grep -Eo '/pull/[0-9]+' >/dev/null; then
            pr="$(echo "$out" | grep -Eo '/pull/[0-9]+' | grep -Eo '[0-9]+' | tail -1)"
          else
            pr="$(gh pr view --head "$branch" --json number -q .number || true)"
          fi
          echo "pr=${pr}" >> "$GITHUB_OUTPUT"
          echo "Opened PR #${pr}"

      - name: Enable auto-merge (optional/safe)
        if: ${{ steps.openpr.outputs.pr && inputs.auto_merge == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="${{ steps.openpr.outputs.pr }}"
          files="$(gh pr view "$pr" --json files -q '.files[].path')"
          if echo "$files" | grep -v '^_inventory/' >/dev/null; then
            echo "Skip automerge: non-inventory changes detected."
            exit 0
          fi
          auto="$(gh repo view --json autoMergeAllowed -q .autoMergeAllowed || echo false)"
          if [ "$auto" != "true" ]; then
            echo "Skip automerge: repository auto-merge disabled."
            exit 0
          fi
          gh pr merge "$pr" --squash --auto || {
            echo "::warning::Automerge not enabled (policy)."; exit 0;
          }
