# ========================================================================
# inventory/ci (보안·산출물 보강본)
# 목적:
#   - 저장소의 GitHub Actions 워크플로(.yml/.yaml)를 스캔해
#     _inventory/workflows/inventory.json, inventory.csv 를 생성
#   - (옵션) 변경이 있으면 _inventory/ 경로로 PR 발행 / 정책 허용 시 자동머지
#
# 트리거:
#   - pull_request: 워크플로/액션/스크립트 변경 시 자동 실행 (fork PR도 '읽기'만)
#   - push@main: 운용 브랜치에서 변경 시
#   - workflow_dispatch: 수동 수행 + 발행/자동머지 토글 가능
#
# 산출물(보장):
#   - _inventory/workflows/inventory.json  (모니터링 UI 스키마)
#   - _inventory/workflows/inventory.csv   (간단 조회/엑셀)
#   - CI 아티팩트(workflows-inventory-<run_id>) 업로드
#   - Job Summary에 파일 목록/카운트 기록
#
# 보안:
#   - 기본 permissions: read-only
#   - publish 잡에서만 contents/pull-requests: write
#   - checkout은 persist-credentials: false (토큰 주입 차단)
#   - PR 자동머지는 _inventory/* 외 파일 섞이면 즉시 차단
#   - action 버전은 @v* 표기(실 운영 시 커밋 SHA pin 권장)
# ========================================================================

name: inventory/ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/g5/**'
      - '.github/workflows/inventory-ci.yml'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/g5/**'
      - '.github/workflows/inventory-ci.yml'
  workflow_dispatch:
    inputs:
      publish_pr:
        description: '_inventory/ 로 PR 발행 여부'
        type: choice
        options: ['false','true']
        default: 'false'
      auto_merge:
        description: 'PR 자동머지(정책 허용 + _inventory/* 한정)'
        type: choice
        options: ['false','true']
        default: 'false'

# ✅ 워크플로: 서브모듈 비활성 + 최소권한 + 읽기전용
permissions:
  contents: read  # 보안: 읽기만

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (read-only; no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 히스토리 필요한 작업 대비
          submodules: 'false'   # ⚠️ 강제 비활성 (깨진 .gitmodules라도 foreach 안탐)
          persist-credentials: false

      # (선택) 러너 하드닝 — 실 운영 시 커밋 SHA로 pin 권장
      # - name: Harden runner (egress lock)
      #   uses: step-security/harden-runner@v2
      #   with:
      #     egress-policy: audit

      # (기존) Checkout 스텝은 보안·안정 위해 이렇게 유지 권장
      - name: Checkout (read-only; no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'false'         # 깨진 submodule 회피
          persist-credentials: false  # 토큰 주입 차단
      
      # (기존) 파이썬/의존 설치 후, 반드시 출력 폴더를 미리 생성
      - name: Prepare output dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _inventory/workflows
      
      # (기존) 생성기 실행 — 실패해도 다음 단계에서 정규화로 커버
      - name: Generate inventory (repo script)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ".github/tools/gen_inventory.py" ]; then
            python3 .github/tools/gen_inventory.py || true
          else
            echo "::warning::.github/tools/gen_inventory.py not found."
          fi
      
      # ✅ 추가: "산출물 정규화(이동·리네임)" — 양쪽 네이밍 모두 흡수
      - name: Normalize inventory outputs (compat shim)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _inventory/workflows
      
          # 1) 루트 생성물 → 하위 폴더/표준명으로 이동
          if [ -s "_inventory/workflows.json" ] && [ ! -s "_inventory/workflows/inventory.json" ]; then
            mv -f "_inventory/workflows.json" "_inventory/workflows/inventory.json"
          fi
          if [ -s "_inventory/workflows.csv" ] && [ ! -s "_inventory/workflows/inventory.csv" ]; then
            mv -f "_inventory/workflows.csv" "_inventory/workflows/inventory.csv"
          fi
      
          # 2) 혹시 하위 폴더에 workflows.json/csv 이름으로 나온 경우도 표준명으로 정리
          if [ -s "_inventory/workflows/workflows.json" ] && [ ! -s "_inventory/workflows/inventory.json" ]; then
            mv -f "_inventory/workflows/workflows.json" "_inventory/workflows/inventory.json"
          fi
          if [ -s "_inventory/workflows/workflows.csv" ] && [ ! -s "_inventory/workflows/inventory.csv" ]; then
            mv -f "_inventory/workflows/workflows.csv" "_inventory/workflows/inventory.csv"
          fi
      
          # 3) 최종 보장: 없으면 경고를 남겨 디버깅 힌트 제공
          if [ ! -s "_inventory/workflows/inventory.json" ] || [ ! -s "_inventory/workflows/inventory.csv" ]; then
            echo "::warning::normalized outputs not found. check generator."
            ls -lah _inventory || true
            ls -lah _inventory/workflows || true
          fi
      
      # ✅ 업로드는 '표준 경로'를 우선, 루트 경로는 보조로 포함 (이중 안전망)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflows-inventory-${{ github.run_id }}
          path: |
            _inventory/workflows/inventory.json
            _inventory/workflows/inventory.csv
            _inventory/workflows.json
            _inventory/workflows.csv
          if-no-files-found: error
          retention-days: 7
      
      # ✅ Summary에서 루트/하위 모두 출력해 가시성↑
      - name: Job Summary
        shell: bash
        run: |
          {
            echo "### workflows inventory (after normalize)"
            echo ""
            echo "#### _inventory/"
            echo '```'
            ls -lah _inventory || true
            echo '```'
            echo "#### _inventory/workflows/"
            echo '```'
            ls -lah _inventory/workflows || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # PR에선 산출만, main push 또는 수동(입력 허용)일 때만 발행
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_pr == 'true')
    permissions:
      contents: write       # PR 브랜치 푸시용
      pull-requests: write  # PR 생성/병합용

    steps:
      - name: Checkout (write intent)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download inventory artifacts
        uses: actions/download-artifact@v4
        with:
          path: _inventory/_ci_artifacts
          merge-multiple: true
          pattern: workflows-inventory-*

      - name: Stage _inventory (dedupe)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _inventory
          if command -v rsync >/dev/null 2>&1; then
            rsync -a _inventory/_ci_artifacts/ _inventory/
          else
            shopt -s dotglob
            cp -R _inventory/_ci_artifacts/* _inventory/ || true
          fi
          rm -rf _inventory/_ci_artifacts
          find _inventory -maxdepth 2 -type f -print

      - name: Commit & open PR (only if changes)
        id: openpr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "wf-inventory-bot"
          git config user.email "wf-inventory-bot@users.noreply.github.com"
          branch="bot/inventory-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -f _inventory/*
          git rm -r --cached _inventory/_ci_artifacts 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes in _inventory → skip PR."
            exit 0
          fi
          git commit -m "[WF] workflows inventory (run=${GITHUB_RUN_ID})"
          git push --set-upstream origin "$branch"
          base="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"
          out="$(gh pr create --base "$base" --head "$branch" \
                 --title "[WF] workflows inventory ${GITHUB_RUN_ID}" \
                 --body "자동 생성 인벤토리(_inventory/workflows/*)")" || true
          pr=""
          if echo "$out" | grep -Eo '/pull/[0-9]+' >/dev/null; then
            pr="$(echo "$out" | grep -Eo '/pull/[0-9]+' | grep -Eo '[0-9]+' | tail -1)"
          else
            pr="$(gh pr view --head "$branch" --json number -q .number || true)"
          fi
          echo "pr=${pr}" >> "$GITHUB_OUTPUT"
          echo "Opened PR #${pr}"

      - name: Enable auto-merge (optional/safe)
        if: ${{ steps.openpr.outputs.pr && inputs.auto_merge == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="${{ steps.openpr.outputs.pr }}"
          files="$(gh pr view "$pr" --json files -q '.files[].path')"
          if echo "$files" | grep -v '^_inventory/' >/dev/null; then
            echo "Skip automerge: non-inventory changes detected."
            exit 0
          fi
          auto="$(gh repo view --json autoMergeAllowed -q .autoMergeAllowed || echo false)"
          if [ "$auto" != "true" ]; then
            echo "Skip automerge: repository auto-merge disabled."
            exit 0
          fi
          gh pr merge "$pr" --squash --auto || {
            echo "::warning::Automerge not enabled (policy)."; exit 0;
          }
