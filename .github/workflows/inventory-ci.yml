# ========================================================================
# inventory/ci — 워크플로 인벤토리 생성·게시 (수동/자동 겸용 안정판)
# 목적:
#   1) .github/workflows/*.y*ml 스캔 → 인벤토리 산출
#   2) 산출물 SSOT: _inventory/workflows/index.json, index.csv
#   3) 수동 실행(workflow_dispatch) 기본은 아티팩트만, 원하면 PR 반영
#      - publisher=cpr(기본): create-pull-request 액션으로 푸시/PR/인증 일괄 처리
#      - publisher=git: 원격에 토큰 주입 후 git/gh로 푸시(레거시 호환)
# 보안·안정:
#   - checkout@v4: submodules:false (깨진 .gitmodules 보호)
#   - Python 3.11 고정, pip 캐시 미사용(의존 파일 無)
#   - Auto-merge 실패는 notice(잡 성공 유지)
# ========================================================================

name: inventory/ci

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/g5/**"
      - ".github/workflows/inventory-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/g5/**"
      - ".github/workflows/inventory-ci.yml"
  workflow_dispatch:
    inputs:
      publish_pr:
        description: '인벤토리를 PR로 반영할까요?'
        type: choice
        options: ['false','true']
        default: 'false'
      publisher:
        description: 'PR 발행 방식 선택 (cpr 권장)'
        type: choice
        options: ['cpr','git']
        default: 'cpr'
      auto_merge:
        description: '정책 허용 시 자동 병합'
        type: choice
        options: ['false','true']
        default: 'false'

# 기본 권한(읽기). publish 잡에서만 write 상승
permissions:
  contents: read
  actions: read

# ref별 직렬화(스팸 PR/경합 방지)
concurrency:
  group: inv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # --- 소스 읽기: read-only / submodule 완전 비활성 ---
      - name: Checkout (read-only; no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      # --- Python 준비: 캐시 OFF + 3.11 고정 ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- 최소 의존 ---
      - name: Install deps (pyyaml)
        run: python -m pip install --upgrade --disable-pip-version-check pyyaml==6.0.2

      # --- 출력 디렉터리 보장 ---
      - name: Prepare output dir
        run: mkdir -p _inventory/workflows

      # --- 1차: 저장소 스크립트로 생성(있으면) ---
      - name: Generate inventory (repo script)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ".github/tools/gen_inventory.py" ]; then
            python .github/tools/gen_inventory.py || echo "::warning::generator returned non-zero"
          else
            echo "::notice::.github/tools/gen_inventory.py not found; will fallback."
          fi

      # --- 2차 폴백: 항상 산출물 보장(여기문서 대신 shell: python) ---
      - name: Fallback generator (always produce)
        shell: python
        run: |
          import os, glob, json, csv
          try:
              import yaml
          except Exception:
              yaml = None
          rows=[]
          for p in sorted(glob.glob(".github/workflows/*.y*ml")):
              triggers=[]
              if yaml:
                  try:
                      with open(p, encoding="utf-8") as f:
                          y=list(yaml.safe_load_all(f))
                      d=y[0] if y else {}
                      on=d.get("on") or {}
                      if isinstance(on, dict): triggers=list(on.keys())
                      elif isinstance(on, list): triggers=on
                  except Exception:
                      pass
              rows.append({"path": p, "triggers": triggers})
          os.makedirs("_inventory", exist_ok=True)
          open("_inventory/workflows.json","w",encoding="utf-8").write(json.dumps(rows,ensure_ascii=False,indent=2))
          with open("_inventory/workflows.csv","w",newline="",encoding="utf-8") as f:
              w=csv.writer(f); w.writerow(["path","triggers"])
              [w.writerow([r["path"], "|".join(r["triggers"])]) for r in rows]

      # --- SSOT 정규화: _inventory/workflows/index.(json|csv) ---
      - name: Normalize outputs (→ SSOT index.*)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _inventory/workflows
          mv -f _inventory/workflows.json           _inventory/workflows/index.json  2>/dev/null || true
          mv -f _inventory/workflows.csv            _inventory/workflows/index.csv   2>/dev/null || true
          mv -f _inventory/workflows/inventory.json _inventory/workflows/index.json  2>/dev/null || true
          mv -f _inventory/workflows/inventory.csv  _inventory/workflows/index.csv   2>/dev/null || true
          mv -f _inventory/workflows/workflows.json _inventory/workflows/index.json  2>/dev/null || true
          mv -f _inventory/workflows/workflows.csv  _inventory/workflows/index.csv   2>/dev/null || true
          [ -s _inventory/workflows/index.json ] || echo "[]" > _inventory/workflows/index.json
          [ -s _inventory/workflows/index.csv  ] || echo "path,triggers" > _inventory/workflows/index.csv
          rm -f _inventory/workflows.json _inventory/workflows.csv || true
          touch .gitignore
          { echo "_inventory/workflows.json"; echo "_inventory/workflows.csv"; } >> .gitignore
          sort -u .gitignore -o .gitignore

      # --- 요약(파일 리스트) ---
      - name: Job Summary
        shell: bash
        run: |
          echo "### workflows inventory" >> "$GITHUB_STEP_SUMMARY"
          echo "#### _inventory/workflows" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lah _inventory/workflows || true >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # --- 아티팩트(수동 모드에서 다운로드해 확인 가능) ---
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflows-inventory-${{ github.run_id }}
          path: |
            _inventory/workflows/index.json
            _inventory/workflows/index.csv
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    # push(main) 또는 수동에서 publish_pr=true일 때만 실행
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_pr == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout (no creds)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: _inventory/_ci_artifacts
          merge-multiple: true
          pattern: workflows-inventory-*

      # 안전망: 어떤 이름으로 와도 SSOT로 통일
      - name: Stage & normalize inventory (SSOT)
        shell: bash
        run: |
          set -euo pipefail
          ART_DIR="_inventory/_ci_artifacts"
          SSOT_DIR="_inventory/workflows"
          mkdir -p "$SSOT_DIR"
          rsync -a "$ART_DIR"/ _inventory/ 2>/dev/null || cp -R "$ART_DIR"/* _inventory/ || true
          rm -rf "$ART_DIR"
          mv -f _inventory/workflows.json            "$SSOT_DIR/index.json"  2>/dev/null || true
          mv -f _inventory/workflows.csv             "$SSOT_DIR/index.csv"   2>/dev/null || true
          mv -f _inventory/index.json                "$SSOT_DIR/index.json"  2>/dev/null || true
          mv -f _inventory/index.csv                 "$SSOT_DIR/index.csv"   2>/dev/null || true
          mv -f _inventory/workflows/inventory.json  "$SSOT_DIR/index.json"  2>/dev/null || true
          mv -f _inventory/workflows/inventory.csv   "$SSOT_DIR/index.csv"   2>/dev/null || true
          mv -f _inventory/workflows/workflows.json  "$SSOT_DIR/index.json"  2>/dev/null || true
          mv -f _inventory/workflows/workflows.csv   "$SSOT_DIR/index.csv"   2>/dev/null || true
          [ -s "$SSOT_DIR/index.json" ] || echo "[]" > "$SSOT_DIR/index.json"
          [ -s "$SSOT_DIR/index.csv"  ] || echo "path,triggers" > "$SSOT_DIR/index.csv"
          rm -f _inventory/workflows.json _inventory/workflows.csv _inventory/index.json _inventory/index.csv || true
          touch .gitignore
          { echo "_inventory/workflows.json"; echo "_inventory/workflows.csv"; echo "_inventory/index.json"; echo "_inventory/index.csv"; } >> .gitignore
          sort -u .gitignore -o .gitignore

      # === 퍼블리셔: cpr(권장) / git(레거시) ===
      - name: Create or Update PR (cpr)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publisher == 'cpr' || (github.event_name != 'workflow_dispatch') }}
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/wf-inventory
          commit-message: "[WF] workflows inventory → index.(json|csv) (canonicalize & dedupe)"
          title: "[WF] workflows inventory (canonical index.*)"
          body: |
            SSOT: `_inventory/workflows/index.json,csv`
            - Canonicalize & dedupe
            - Auto-generated by `inventory/ci`
          add-paths: |
            _inventory/workflows/index.json
            _inventory/workflows/index.csv
            .gitignore
          signoff: false
          committer: wf-inventory-bot <wf-inventory-bot@users.noreply.github.com>
          author: wf-inventory-bot <wf-inventory-bot@users.noreply.github.com>

      # 레거시 모드: 직접 git/gh 사용(원격에 토큰 주입으로 128 차단)
      - name: Commit & open/update PR (git legacy)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publisher == 'git' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "wf-inventory-bot"
          git config user.email "wf-inventory-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          branch="bot/wf-inventory"
          git checkout -B "$branch"
          git add -f _inventory/workflows/index.json _inventory/workflows/index.csv .gitignore
          if git diff --cached --quiet; then
            echo "No changes → skip PR."; exit 0; fi
          git commit -m "[WF] workflows inventory → index.(json|csv) (canonicalize & dedupe)"
          git push -f --set-upstream origin "$branch"
          base="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"
          gh pr create --base "$base" --head "$branch" \
            --title "[WF] workflows inventory (canonical index.*)" \
            --body  "SSOT: _inventory/workflows/index.json,csv" \
          || true

      # 오토머지(정책 허용 시). 실패는 notice → 잡 성공 유지
      - name: Enable auto-merge (optional; non-fatal)
        if: ${{ (steps.cpr.outputs.pull-request-number || inputs.publisher == 'git') && (github.event_name != 'workflow_dispatch' || inputs.auto_merge == 'true') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # PR 번호 가져오기(cpr 또는 git)
          pr="${{ steps.cpr.outputs.pull-request-number || '' }}"
          if [ -z "$pr" ]; then
            pr="$(gh pr list --head bot/wf-inventory --json number -q '.[0].number' || echo '')"
          fi
          [ -z "$pr" ] && { echo "::notice::no PR detected"; exit 0; }
          auto="$(gh repo view --json autoMergeAllowed -q .autoMergeAllowed || echo false)"
          [ "$auto" != "true" ] && { echo "::notice::automerge disabled by repo policy"; exit 0; }
          gh pr merge "$pr" --squash --auto || echo "::notice::automerge request failed (non-fatal)"
