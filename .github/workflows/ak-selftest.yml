# =========================================================
# 파일 용도 : scripts/g5/* 변경 시
#             1) PowerShell 정적 점검(PSScriptAnalyzer)
#             2) 스모크 실행(ak-dispatch.ps1 -Command help)
# 동작 방식 : push/pull_request 경로 필터(워크플로 변경 포함) + 수동 실행
# 연관 파일 : .github/workflows/ak-commands.yml, ak-auto.yml, scripts/g5/ak-dispatch.ps1
# 안전 가드 : PSGallery 장애 시에도 "문법 분석 폴백"으로 진행(의미있는 실패만 fail)
# 산출물    : Job Summary/콘솔 로그, artifacts/pssa-findings.txt
# =========================================================
name: ak-selftest

on:
  pull_request:
    paths:
      - scripts/g5/**
      - .github/workflows/ak-selftest.yml
  push:
    paths:
      - scripts/g5/**
      - .github/workflows/ak-selftest.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print pwsh env
        shell: pwsh
        run: |
          $v=$PSVersionTable.PSVersion.ToString()
          $hasPSR=[bool](Get-Command Install-PSResource -ErrorAction SilentlyContinue)
          $pget=(Get-Module PowerShellGet -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1).Version
          Write-Host "pwsh=$v  Install-PSResource?=$hasPSR  PowerShellGet=$pget"

      # ── 설치 실패해도 "폴백"으로 계속 진행(던지지 않음) ──
      - name: Install PSScriptAnalyzer robust
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ok=$false

          function Try-V3 {
            if (Get-Command Install-PSResource -ErrorAction SilentlyContinue) {
              if (-not (Get-PSResourceRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                Register-PSResourceRepository -Name PSGallery -Uri 'https://www.powershellgallery.com/api/v3' -Trusted
              } else { try { Set-PSResourceRepository -Name PSGallery -Trusted } catch {} }
              Install-PSResource -Name PSScriptAnalyzer -Repository PSGallery -Scope CurrentUser -TrustRepository -Quiet -Reinstall
              $script:ok=$true
            }
          }

          function Try-V2 {
            if ($IsWindows -and -not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
              Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
            }
            $pg = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
            if (-not $pg) {
              $hasDefault=(Get-Command Register-PSRepository).Parameters.ContainsKey('Default')
              if ($hasDefault) {
                Register-PSRepository -Default
                try { Set-PSRepository -Name PSGallery -InstallationPolicy Trusted } catch {}
              } else {
                Register-PSRepository -Name PSGallery `
                  -SourceLocation 'https://www.powershellgallery.com/api/v2' `
                  -ScriptSourceLocation 'https://www.powershellgallery.com/api/v2' `
                  -InstallationPolicy Trusted
              }
            } else { try { Set-PSRepository -Name PSGallery -InstallationPolicy Trusted } catch {} }
            Install-Module PSScriptAnalyzer -Repository PSGallery -Scope CurrentUser -Force -AcceptLicense
            $script:ok=$true
          }

          for ($i=0; $i -lt 6 -and -not $ok; $i++) { try { Try-V3 } catch { Start-Sleep -Seconds ([math]::Pow(2,$i)) } }
          for ($i=0; $i -lt 6 -and -not $ok; $i++) { try { Try-V2 } catch { Start-Sleep -Seconds ([math]::Pow(2,$i)) } }

          if ($ok) {
            Import-Module PSScriptAnalyzer -Force
            Get-Module PSScriptAnalyzer | Format-List Name,Version | Out-String | Write-Host
            'PRIMARY=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Warning 'PSScriptAnalyzer install failed; will run syntax-only fallback.'
            'PRIMARY=0' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Run PSScriptAnalyzer
        if: env.PRIMARY == '1'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Test-Path 'scripts/g5')) { Write-Host 'No scripts/g5; skip.'; exit 0 }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $results = Invoke-ScriptAnalyzer -Path 'scripts/g5' -Recurse -Severity Error,Warning
          if ($results) {
            $results | Sort-Object Severity, RuleName |
              Select-Object Severity, RuleName, ScriptName, Line, Message |
              Format-Table -AutoSize | Out-String | Tee-Object -FilePath 'artifacts/pssa-findings.txt'
          } else { 'PSScriptAnalyzer: no findings' | Tee-Object -FilePath 'artifacts/pssa-findings.txt' }
          $err = ($results | Where-Object { $_.Severity -eq 'Error' }).Count
          if ($err -gt 0) { Write-Error "PSScriptAnalyzer errors: $err" }

      - name: Fallback syntax-only analysis
        if: env.PRIMARY != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Test-Path 'scripts/g5')) { Write-Host 'No scripts/g5; skip.'; exit 0 }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $errs=@()
          Get-ChildItem 'scripts/g5' -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            try {
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$null)
            } catch {
              $errs += [pscustomobject]@{ Severity='Error'; RuleName='Syntax'; ScriptName=$_.Name; Line=0; Message=$_.Exception.Message }
            }
          }
          if ($errs.Count -gt 0) {
            $errs | Format-Table -AutoSize | Out-String | Tee-Object -FilePath 'artifacts/pssa-findings.txt'
            Write-Error "Syntax errors: $($errs.Count)"
          } else {
            'Syntax-only: no parse errors (fallback mode)' | Tee-Object -FilePath 'artifacts/pssa-findings.txt'
          }

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pssa-findings
          path: artifacts/pssa-findings.txt
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: Smoke help
    runs-on: ubuntu-latest
    needs: analyze
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke ak-dispatch help
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'scripts/g5/ak-dispatch.ps1')) {
            throw 'Missing scripts/g5/ak-dispatch.ps1'
          }
          ./scripts/g5/ak-dispatch.ps1 -Command help -Pr 0
