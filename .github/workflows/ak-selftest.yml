# =========================================================
# 파일 용도 : scripts/g5/* 변경 시
#             1) PowerShell 정적 점검(PSScriptAnalyzer)
#             2) 스모크 실행(ak-dispatch.ps1 -Command help)
# 동작 방식 : push/pull_request 경로 필터 트리거 → 에러 시 즉시 실패
# 연관 파일 : .github/workflows/ak-commands.yml, ak-auto.yml, scripts/g5/ak-dispatch.ps1
# 안전 가드 : 모듈 설치 비대화식, 스모크는 help만(부작용 최소화)
# 산출물    : Job Summary/콘솔 로그
# =========================================================
name: ak-selftest

on:
  pull_request:
    paths:
      - scripts/g5/**
  push:
    paths:
      - scripts/g5/**

# 최소 권한(읽기만)
permissions:
  contents: read

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print pwsh env
        shell: pwsh
        run: |
          $v=$PSVersionTable.PSVersion.ToString()
          $hasPSR=[bool](Get-Command Install-PSResource -ErrorAction SilentlyContinue)
          $pget=(Get-Module PowerShellGet -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1).Version
          Write-Host "pwsh=$v  Install-PSResource?=$hasPSR  PowerShellGet=$pget"
        
      - name: Install PSScriptAnalyzer robust
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ok=$false
      
          # v3: PSResourceGet 우선 (Install-PSResource 존재 시)
          if (Get-Command Install-PSResource -ErrorAction SilentlyContinue) {
            if (-not (Get-PSResourceRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
              Register-PSResourceRepository -Name PSGallery -Uri 'https://www.powershellgallery.com/api/v3' -Trusted
            } else { try { Set-PSResourceRepository -Name PSGallery -Trusted } catch {} }
      
            for ($i=0; $i -lt 6 -and -not $ok; $i++) {
              try {
                Install-PSResource -Name PSScriptAnalyzer -Repository PSGallery `
                  -Scope CurrentUser -TrustRepository -Quiet -Reinstall
                $ok=$true
              } catch { Start-Sleep -Seconds ([math]::Pow(2,$i)) }
            }
          }
      
          # v2: PowerShellGet 폴백
          if (-not $ok) {
            if ($IsWindows -and -not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
              Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
            }
            $pg = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
            if (-not $pg) {
              $hasDefault = (Get-Command Register-PSRepository).Parameters.ContainsKey('Default')
              if ($hasDefault) {
                Register-PSRepository -Default
                try { Set-PSRepository -Name PSGallery -InstallationPolicy Trusted } catch {}
              } else {
                Register-PSRepository -Name PSGallery `
                  -SourceLocation 'https://www.powershellgallery.com/api/v2' `
                  -ScriptSourceLocation 'https://www.powershellgallery.com/api/v2' `
                  -InstallationPolicy Trusted
              }
            } else { try { Set-PSRepository -Name PSGallery -InstallationPolicy Trusted } catch {} }
      
            for ($i=0; $i -lt 6 -and -not $ok; $i++) {
              try {
                Install-Module PSScriptAnalyzer -Repository PSGallery `
                  -Scope CurrentUser -Force -AcceptLicense
                $ok=$true
              } catch { Start-Sleep -Seconds ([math]::Pow(2,$i)) }
            }
          }
      
          if (-not $ok) { throw "PSScriptAnalyzer install failed (PSGallery unavailable?)" }
      
          Import-Module PSScriptAnalyzer -Force
          Get-Module PSScriptAnalyzer | Format-List Name,Version | Out-String | Write-Host


      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $issues = Invoke-ScriptAnalyzer -Path 'scripts/g5' -Recurse -Severity Error
          if ($issues) {
            $issues | Format-Table | Out-String | Write-Output
            throw "PSScriptAnalyzer errors: $($issues.Count)"
          }
          Write-Output 'PSScriptAnalyzer: no errors'

  smoke:
    name: Smoke help
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ⚠️ 여기서는 name에 콜론(:)을 쓰지 않습니다.
      - name: Smoke ak-dispatch help
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'scripts/g5/ak-dispatch.ps1')) {
            throw 'Missing scripts/g5/ak-dispatch.ps1'
          }
          ./scripts/g5/ak-dispatch.ps1 -Command help -Pr 0
