# =========================================================
# 파일 용도:  scripts/g5/* (ChatOps 디스패처 등) 변경 시
#            1) 파워셸 정적 점검(PSScriptAnalyzer)
#            2) 스모크 실행(ak-dispatch.ps1 -Command help)
# 동작 방식: push/pull_request 에서 경로 필터로 트리거.
#            오류 발생 시 즉시 실패하여 운영 반영 전 차단.
# 연관 파일: .github/workflows/ak-commands.yml
#            .github/workflows/ak-auto.yml
#            scripts/g5/ak-dispatch.ps1
# 안전 가드: - PSGallery 신뢰 설정 후 모듈 설치(비대화식)
#            - 스모크는 'help'만 실행(부작용 최소화)
# 산출물   : Job Summary(분석 결과), (필요 시) 콘솔 로그
# 운영 팁 : scripts/g5/* 업데이트는 반드시 이 게이트를
#           통과해야 실제 ChatOps 루프가 안전해집니다.
# =========================================================
name: ak-selftest

"on":
  push:
    paths: ["scripts/g5/**"]
  pull_request:
    paths: ["scripts/g5/**"]

permissions:
  contents: read

concurrency:
  group: ak-selftest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: PSScriptAnalyzer (errors fail)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $issues = Invoke-ScriptAnalyzer -Path scripts/g5 -Recurse -Severity Error
          if ($issues) {
            $issues | Format-Table | Out-String | Write-Host
            throw "PSScriptAnalyzer found $($issues.Count) error(s)."
          }

  smoke:
    name: Smoke (ak-dispatch help)
    runs-on: ubuntu-24.04
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke: ak-dispatch.ps1 -Command help
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Test-Path ./scripts/g5/ak-dispatch.ps1)) {
            throw "Missing scripts/g5/ak-dispatch.ps1"
          }
          ./scripts/g5/ak-dispatch.ps1 -Command help -Pr 0
