name: ak-dispatch

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "/ak scan | test | rewrite | fix | help"
        required: true
        type: string
      pr:
        description: "PR number (optional)"
        required: false
        default: ""
      sha:
        description: "Commit SHA (optional)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ak-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # 0) 로컬 액션 부트스트랩 (checkout 없이 .github/actions 만 전개)
      - name: Bootstrap local actions (no git)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $ref ='${{ github.sha }}'
          $zip = Join-Path $env:RUNNER_TEMP 'repo.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'repo'
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $Headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version"="2022-11-28"
            "User-Agent"="bootstrap-actions"
            Accept="application/vnd.github+json"
          }
          $owner,$name = $repo.Split('/')
          $url = "https://api.github.com/repos/$owner/$name/zipball/$ref"
          Invoke-WebRequest -Uri $url -Headers $Headers -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $root = Get-ChildItem -Directory $tmp | Select-Object -First 1
          $dst  = Join-Path $env:GITHUB_WORKSPACE '.github'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path (Join-Path $root.FullName '.github\actions') -Destination $dst -Recurse -Force
          Remove-Item $zip -Force

      # 1) (이제 존재함) zip-fetch 로 전체 소스 전개
      - uses: ./.github/actions/zip-fetch
        with:
          ref: ${{ github.event.inputs.sha || github.sha }}

      # 2) 메인 실행
      - name: AK Dispatch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:GITHUB_WORKSPACE
          pwsh -NoProfile -File "scripts/g5/ak-dispatch.ps1" `
            -Command "${{ github.event.inputs.cmd }}" `
            -Pr "${{ github.event.inputs.pr }}" `
            -Sha "${{ github.event.inputs.sha }}"

      # 3) 로그 업로드(409 방지: 고유 이름)
      - uses: ./.github/actions/publish-logs
        if: always()
        with:
          logdir: logs
          name: ak-logs

      # 4) (선택) PR 코멘트
      - name: Comment to PR (optional)
        if: ${{ github.event.inputs.pr != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const pr = Number(process.env.PR);
            const cmd = process.env.CMD;
            const sha = process.env.SHA || context.sha;
            const short = (sha || '').slice(0,7);
            const body = `AK dispatch \`${cmd}\` finished on \`${short}\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr, body
            });
        env:
          PR:  ${{ github.event.inputs.pr }}
          CMD: ${{ github.event.inputs.cmd }}
          SHA: ${{ github.event.inputs.sha }}
