# ===========================================
# 파일: .github/workflows/ak-dispatch.yml
# 목적: 수동(workflow_dispatch)으로 "AK" 명령들을 실행하는 디스패처.
#       - git 없이(zipball) 로컬 커스텀 액션(.github/actions) 부트스트랩
#       - zip-fetch 로 원하는 ref(sha) 소스 전개
#       - scripts/g5/ak-dispatch.ps1 실행(/ak scan|test|rewrite|fix|help)
#       - 로그 아티팩트 업로드 + (선택) PR 코멘트
# 운영 강화(기능 축소 없음):
#   * concurrency 취소, timeout, Job Summary, PR 코멘트 실패 무해화, 전역 pwsh 고정
# ===========================================

name: ak-dispatch

on:
  # 수동 트리거(파라미터로 명령/PR/sha를 받음)
  workflow_dispatch:
    inputs:
      cmd:
        description: 'AK command (예: /ak scan | /ak test | /ak rewrite | /ak fix | /ak help)'
        type: choice            # UI에서 실수를 줄이기 위한 choice (강화)
        required: true
        options: ['/ak scan','/ak test','/ak rewrite','/ak fix','/ak help']
      pr:
        description: 'PR 번호 (선택: 코멘트 대상)'
        required: false
        type: string
        default: ''
      sha:
        description: '대상 커밋 SHA (미입력 시 현재 SHA)'
        required: false
        type: string
        default: ''

# 최소 권한 + 필요한 쓰기만 부여
permissions:
  contents: read
  pull-requests: write
  issues: write

# 동일 ref에서 중복 실행 시, 먼저 돌던 실행을 취소(레이스/자원 낭비 방지)
concurrency:
  group: ak-dispatch-${{ github.ref }}
  cancel-in-progress: true     # [강화] 이전 실행 취소

jobs:
  run:
    # 원본: self-hosted 러너 + ghmon-safe 라벨에서만 실행
    runs-on: [ self-hosted, ghmon-safe ]

    # [강화] 행잉 방지
    timeout-minutes: 30

    # [강화] 모든 run: pwsh로 통일
    defaults:
      run:
        shell: pwsh

    steps:
      # --- (가시성) 이 워크플로 버전 표시 -----------------------------------
      - name: Announce version
        run: |
          Write-Host "AK-DISPATCH :: v2 (commented)"

      # --- (핵심) git 없이 로컬 액션 부트스트랩 ------------------------------
      #  - 왜? self-hosted나 제한된 환경에서 git checkout 실패/exit 128 회피
      #  - zipball로 현재 레포 소스를 받아 .github/actions 만 워크스페이스에 복사
      - name: Bootstrap local actions (no git)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}      # zipball API 인증
          REPO: ${{ github.repository }}             # owner/repo
          REF:  ${{ github.event.inputs.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'src.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'src-unzip'
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          New-Item -ItemType Directory -Force -Path ".github/actions" | Out-Null

          $hdr = @{
            Authorization        = "Bearer $env:GH_TOKEN"
            Accept               = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$($env:REPO)/zipball/$($env:REF)"
          Write-Host "==> Downloading zipball: $uri"
          Invoke-WebRequest -Headers $hdr -Uri $uri -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $tmp -Force

          # zipball 최상위 폴더(sha-접미) 탐색 후 .github/actions만 복사
          $root = Get-ChildItem $tmp -Directory | Select-Object -First 1
          if (-not $root) { throw "zipball root not found" }
          $src = Join-Path $root.FullName ".github/actions"
          if (Test-Path $src) {
            Copy-Item -Recurse -Force $src ".github/actions"
          } else {
            Write-Warning "No .github/actions found in ref=$($env:REF). Local actions step may fail."
          }

      # --- (핵심) zip-fetch 로 전체 소스 전개 --------------------------------
      #  - 로컬 액션을 사용(방금 부트스트랩). ref는 입력 sha 또는 현재 sha
      #  - zip-fetch의 입력 파라미터/동작은 레포 내 액션 구현을 따릅니다.
      - name: Download source via zip-fetch
        uses: ./.github/actions/zip-fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ref: ${{ github.event.inputs.sha || github.sha }}   # 원하는 커밋 기준으로 전개

      # --- (핵심) AK 디스패처 실행 ------------------------------------------
      #  - 실제 명령 수행은 scripts/g5/ak-dispatch.ps1 이 담당
      #  - 스크립트가 0이 아닌 코드를 반환하면 잡 실패(의도적)
      - name: Run ak-dispatch
        id: ak
        env:
          AK_CMD: ${{ github.event.inputs.cmd }}
          AK_PR:  ${{ github.event.inputs.pr }}
          AK_SHA: ${{ github.event.inputs.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cmd = $env:AK_CMD
          $pr  = $env:AK_PR
          $sha = $env:AK_SHA

          if (-not (Test-Path 'scripts/g5/ak-dispatch.ps1')) {
            throw "scripts/g5/ak-dispatch.ps1 not found (zip-fetch result?)"
          }

          Write-Host "==> ak-dispatch.ps1 -Command ""$cmd"" -Pr ""$pr"" -Sha ""$sha"""
          & pwsh -NoProfile -File "scripts/g5/ak-dispatch.ps1" -Command "$cmd" -Pr "$pr" -Sha "$sha"
          exit $LASTEXITCODE

      # --- (로그) 아티팩트 업로드 (로컬 액션 + 표준 액션 병행 가능) ----------
      # 1) 레포 내 publish-logs 액션(있다면) 사용
      - name: Publish logs (local action)
        if: always()
        continue-on-error: true         # 로컬 액션 인터페이스가 달라도 전체 실패 방지
        uses: ./.github/actions/publish-logs
        with:
          name: ak-dispatch
          path: _deploy/logs            # 레포 규칙에 맞춰 조정

      # 2) 표준 업로드(이중 안전장치) — _deploy/logs 폴더가 있으면 올림
      - name: Upload logs (fallback)
        if: always() && hashFiles('_deploy/logs/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ak-dispatch
          path: _deploy/logs
          retention-days: 14

      # --- (가시성) Job Summary ---------------------------------------------
      - name: Write job summary
        if: always()
        run: |
          $cmd  = "${{ github.event.inputs.cmd }}"
          $pr   = "${{ github.event.inputs.pr }}"
          $sha  = "${{ github.event.inputs.sha || github.sha }}"
          $short= if ($sha.Length -ge 7) { $sha.Substring(0,7) } else { $sha }
          $run  = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          @"
### AK Dispatch Summary
- **cmd**: `$cmd`
- **pr** : `${if($pr){$pr}else{'(none)'}}`
- **sha**: `$short`
- **logs**: (Actions → Artifacts → `ak-dispatch`)
- **run**: $run
"@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      # --- (선택) PR 코멘트 -------------------------------------------------
      #  - fork PR/권한 문제로 실패할 수 있으므로 continue-on-error 처리
      #  - 링크와 커맨드/sha만 간단히 남김(자세한 내용은 Artifact/Logs)
      - name: Comment to PR (optional)
        if: ${{ github.event.inputs.pr != '' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const pr = Number(process.env.PR || 0);
            if (!pr) { core.notice('PR not provided → skip comment'); return; }
            try {
              const cmd   = process.env.CMD;
              const sha   = process.env.SHA || context.sha;
              const short = (sha || '').slice(0,7);
              const run   = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const body  = `AK dispatch \`${cmd}\` finished on \`${short}\` · [logs](${run})`;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr, body
              });
            } catch (e) {
              core.warning(`Failed to comment: ${e.message}`);
            }
        env:
          PR:  ${{ github.event.inputs.pr }}
          CMD: ${{ github.event.inputs.cmd }}
          SHA: ${{ github.event.inputs.sha }}
