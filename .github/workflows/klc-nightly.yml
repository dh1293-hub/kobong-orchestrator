# =========================================
# 이름 : KLC / Nightly Aggregate (UNIFIED)
# 용도 : 하루치 KLC 로그 집계 → 요약 + 아티팩트
# 트리거 : 매일 00:00 KST(= 15:00 UTC), 수동 실행 지원
# 권한 : contents:read, actions:read
# 산출물 : out/*.jsonl (업로드, 보존 7일), Step Summary
# =========================================
name: KLC / Nightly Aggregate
on:
  schedule:
    - cron: "0 15 * * *"   # 00:00 KST
  workflow_dispatch:
    inputs:
      dryrun:
        description: "쓰기 없는 리포트"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: klc-nightly
  cancel-in-progress: true

jobs:
  agg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # TODO: 실제 KLC 수집 로직으로 교체. 지금은 동작 확인용 더미.
      - name: Aggregate (mock)
        shell: bash
        run: |
          mkdir -p out
          echo '{"traceId":"nightly","exitCode":0,"durationMs":1234,"anchorHash":"'${GITHUB_SHA}'","component":"demo","message":"ok"}' > out/klc.jsonl
      - name: Summary
        uses: actions/github-script@v7
        with:
          script: |
            await core.summary
              .addHeading('✅ KLC Nightly Summary', 3)
              .addList(['Files: 1 (mock)'])
              .write()
      - name: Upload artifacts (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: klc-nightly-${{ github.run_id }}
          path: out
          retention-days: 7
