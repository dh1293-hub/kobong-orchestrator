# =========================================
# 목적: 하루치 KLC 로그 집계 → 요약/아티팩트(모니터링 단일화)
# 충돌 회피: 기존 파일 보존, v2로 병행 운영 후 통합
# =========================================
name: KLC / Nightly Aggregate v2
on:
  schedule: [ { cron: "0 15 * * *" } ]  # 매일 00:00 KST
  workflow_dispatch:
    inputs:
      dryrun: { description: "쓰기 없는 리포트", type: boolean, default: true }
permissions: { contents: read, actions: read }
concurrency: { group: klc-nightly, cancel-in-progress: true }
jobs:
  agg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Aggregate KLC (mock)
        run: |
          mkdir -p out
          echo '{"traceId":"demo","exitCode":0,"durationMs":1234,"anchorHash":"sha","component":"demo","message":"ok"}' > out/klc.jsonl
      - name: Write summary
        run: |
          echo "### ✅ KLC Nightly Summary(v2)" >> $GITHUB_STEP_SUMMARY
          echo "- Files: $(ls -1 out | wc -l)" >> $GITHUB_STEP_SUMMARY
      - name: Upload artifacts (7 days)
        uses: actions/upload-artifact@v4
        with: { name: klc-nightly-${{ github.run_id }}, path: out, retention-days: 7 }
