name: ci/webui
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node 툴체인 (필요하면 18/20로 바꿔도 OK)
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # 1) 웹 리소스 빌드/정적 검사(프로젝트에 맞게 스크립트 추가 가능)
      - name: Install deps (optional)
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          if (Test-Path package.json) { npm run -s build || exit 1 }

      # 2) 간단한 HTML 검증(정적)
      - name: Validate HTML (basic)
        run: |
          $files = Get-ChildItem -Recurse -Include *.html
          if ($files.Count -eq 0) { echo "no html"; exit 0 }
          foreach ($f in $files) {
            Write-Host "check $($f.FullName)"
            # 너무 엄격한 린트는 배제, 존재 여부만
            if (!(Get-Content $f.FullName)) { Write-Error "empty file: $($f.FullName)"; exit 1 }
          }

      # 3) 문서/링크 라이트 린트
      - name: Docs lint
        run: |
          $md = Get-ChildItem -Recurse -Include *.md
          if ($md.Count -eq 0) { exit 0 }
          foreach ($m in $md) {
            if ((Get-Content $m.FullName | Measure-Object -Line).Lines -lt 1) {
              Write-Error "empty md: $($m.FullName)"; exit 1
            }
          }
