name: ci/webui

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-webui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # 0) 로컬 액션 부트스트랩 (.github/actions만 전개)
      - name: Bootstrap local actions (no git)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $ref ='${{ github.sha }}'
          $zip = Join-Path $env:RUNNER_TEMP 'repo.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'repo'
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $Headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version"="2022-11-28"
            "User-Agent"="bootstrap-actions"
            Accept="application/vnd.github+json"
          }
          $owner,$name = $repo.Split('/')
          $url = "https://api.github.com/repos/$owner/$name/zipball/$ref"
          Invoke-WebRequest -Uri $url -Headers $Headers -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $root = Get-ChildItem -Directory $tmp | Select-Object -First 1
          $dst  = Join-Path $env:GITHUB_WORKSPACE '.github'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path (Join-Path $root.FullName '.github\actions') -Destination $dst -Recurse -Force
          Remove-Item $zip -Force

      # 1) Git 미사용: zip-fetch 액션으로 소스 전개
      - uses: ./.github/actions/zip-fetch

      # 2) (옵션) Node 빌드: package.json 있을 때만
      - name: Install & build (optional)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm ci + build (optional)
        if: hashFiles('package.json') != ''
        shell: pwsh
        run: |
          npm ci
          if (Test-Path package.json) { npm run -s build || exit 1 }

      # 3) 간단 HTML 존재/빈파일 검사
      - name: Validate HTML (basic)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.html
          if ($files.Count -eq 0) { "no html"; exit 0 }
          foreach ($f in $files) {
            if (-not (Get-Content $f.FullName)) { Write-Error "empty file: $($f.FullName)"; exit 1 }
          }

      # 4) 문서 최소 린트
      - name: Docs lint
        shell: pwsh
        run: |
          $md = Get-ChildItem -Recurse -Include *.md
          if ($md.Count -eq 0) { exit 0 }
          foreach ($m in $md) {
            if ((Get-Content $m.FullName | Measure-Object -Line).Lines -lt 1) {
              Write-Error "empty md: $($m.FullName)"; exit 1
            }
          }

      # 5) 로그 업로드(유일 이름 → 409 방지)
      - uses: ./.github/actions/publish-logs
        if: always()
        with:
          logdir: logs
          name: ci-logs
