# =========================================
# CI: WebUI 스모크 (가벼운 안전망) — B안(인라인)
# - 트리거: PR / main 푸시 (경로 필터)
# - 보안: 최소 권한(contents: read), Git 미사용(zipball 복제) → 128/CRLF 이슈 회피
# - 동작:
#   1) zipball로 소스 전개(깃 없이)  ← 로컬 액션 zip-fetch 대체
#   2) package.json 있으면 Node 22 + npm 캐시 + ci + build (옵션)
#   3) HTML 빈파일 검증(기초)
#   4) Markdown 빈파일 검증(기초)
#   5) logs/ 를 아티팩트 업로드     ← 로컬 액션 publish-logs 대체
# - 강화점: 경로 필터, npm 캐시, 타임아웃(15분), 동시성 취소, 실패 시 워크스페이스 트리 덤프
# =========================================
name: ci/webui

on:
  pull_request:
    paths:
      - 'webui/**'
      - '**/*.html'
      - '**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  push:
    branches: [ main ]
    paths:
      - 'webui/**'
      - '**/*.html'
      - '**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-webui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # 0) 깃 없이 zipball로 소스 전개 (로컬 액션 zip-fetch 대체)
      - name: Expand repo via zipball (no git)
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          sha="${{ github.sha }}"

          tmp="$(mktemp -d)"
          zip="$tmp/src.zip"

          echo "Downloading zipball for $repo@$sha"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${repo}/zipball/${sha}" -o "$zip"

          echo "Unzipping…"
          mkdir -p "$tmp/unz"
          unzip -q "$zip" -d "$tmp/unz"

          # zipball 루트(오너-리포-커밋접두) 폴더 탐색
          root="$(find "$tmp/unz" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$root" || { echo "zipball root not found"; exit 1; }

          echo "Sync to workspace: $root -> $GITHUB_WORKSPACE"
          rsync -a --delete --exclude '.git/' "$root"/ "$GITHUB_WORKSPACE"/

          rm -rf "$tmp"
          echo "Zipball expand done."

      # 1) Node 세팅 + npm 캐시 (있을 때만)
      - name: Detect Node project
        id: detect
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node (with npm cache)
        if: steps.detect.outputs.has_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: npm ci + build (optional)
        if: steps.detect.outputs.has_node == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          if jq -e '.scripts.build' package.json >/dev/null 2>&1; then
            npm run -s build
          else
            echo "No build script — skip."
          fi

      # 2) 간단 HTML 존재/빈파일 검사
      - name: Validate HTML (basic)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t htmls < <(find . -type f -name '*.html' -not -path './.git/*' -not -path './node_modules/*')
          if [ "${#htmls[@]}" -eq 0 ]; then
            echo "No HTML files — skip."
            exit 0
          fi
          bad=0
          for f in "${htmls[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::Empty HTML file"
              bad=1
            fi
          done
          exit $bad

      # 3) 문서 최소 린트 (빈 md 방지)
      - name: Docs lint (basic)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t mds < <(find . -type f -name '*.md' -not -path './.git/*' -not -path './node_modules/*')
          if [ "${#mds[@]}" -eq 0 ]; then
            exit 0
          fi
          bad=0
          while IFS= read -r f; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::Empty Markdown file"
              bad=1
            fi
          done < <(printf "%s\n" "${mds[@]}")
          exit $bad

      # 4) (항상) 로그 업로드 — 로컬 액션 publish-logs 대체
      - name: Publish logs artifact (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: logs
          if-no-files-found: warn

      # 5) 실패 시 디버그용 워크스페이스 트리 덤프
      - name: Dump workspace tree (on failure)
        if: failure()
        shell: bash
        run: |
          set +e
          echo "== top-level =="
          ls -la
          echo "== find depth 2 =="
          find . -maxdepth 2 -type d -print
