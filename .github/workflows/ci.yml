# =========================================
# CI: WebUI 스모크 (가벼운 안전망) — 강화판
# - 트리거: PR / main 푸시 (경로 필터 적용)
# - 보안: 최소 권한(contents: read), Git 미사용(zipball로 복제) → exit code 128 회피
# - 동작:
#   1) .github/actions 만 부트스트랩(로컬 액션 사용 준비)
#   2) zip-fetch 로 소스 전개(깃 없는 복제)
#   3) package.json 있으면 Node 22 + npm 캐시 + ci + build (옵션)
#   4) HTML 파일이 비어있지 않은지 검사(기초 검증)
#   5) Markdown 최소 린트(빈 파일 방지)
#   6) logs/ 를 아티팩트 업로드
# - 산출물: Actions 아티팩트(ci-logs)
# - 강화점: 경로 필터, npm 캐시, 타임아웃(15분), 동시성 취소
# =========================================
name: ci/webui

on:
  pull_request:
    paths:
      - 'webui/**'
      - '**/*.html'
      - '**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/actions/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [ main ]
    paths:
      - 'webui/**'
      - '**/*.html'
      - '**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/actions/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-webui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest         # ✅ Ubuntu 러너로 전환
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Bootstrap local actions (no git)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo='${{ github.repository }}'
          $ref ='${{ github.sha }}'
          $zip = Join-Path $env:RUNNER_TEMP 'repo.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'repo'
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $Headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version"="2022-11-28"
            "User-Agent"="bootstrap-actions"
            Accept="application/vnd.github+json"
          }
          $owner,$name = $repo.Split('/')
          $url = "https://api.github.com/repos/$owner/$name/zipball/$ref"
          Invoke-WebRequest -Uri $url -Headers $Headers -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $root = Get-ChildItem -Directory $tmp | Select-Object -First 1
          $dst  = Join-Path $env:GITHUB_WORKSPACE '.github'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          # ✅ 경로 구분자 섞임 방지: Join-Path로 조합
          Copy-Item -Path (Join-Path $root.FullName '.github') -Destination $dst -Recurse -Force
          Remove-Item $zip -Force
          # actions만 남기고 나머지 .github 내 폴더는 선택적으로 정리
          Get-ChildItem (Join-Path $dst '*') -Directory |
            Where-Object { $_.Name -ne 'actions' } | ForEach-Object { Remove-Item $_.FullName -Recurse -Force }

      - uses: ./.github/actions/zip-fetch

      - name: Setup Node (with npm cache)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: npm ci + build (optional)
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          [ -f package.json ] && npm run -s build || true

      - name: Validate HTML (basic)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.html
          if ($files.Count -eq 0) { Write-Host "No HTML files — skip."; exit 0 }
          $bad = foreach ($f in $files) { if (-not (Get-Content $f.FullName)) { $f.FullName } }
          if ($bad) { throw "Empty HTML files:`n$($bad -join "`n")" }

      - name: Docs lint (basic)
        shell: pwsh
        run: |
          $md = Get-ChildItem -Recurse -Include *.md
          if ($md.Count -eq 0) { exit 0 }
          $bad = foreach ($m in $md) {
            if ((Get-Content $m.FullName | Measure-Object -Line).Lines -lt 1) { $m.FullName }
          }
          if ($bad) { throw "Empty Markdown files:`n$($bad -join "`n")" }

      - uses: ./.github/actions/publish-logs
        if: always()
        with:
          logdir: logs
          name: ci-logs
