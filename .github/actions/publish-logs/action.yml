name: publish-logs
description: Zip logs and upload artifact with unique name
inputs:
  logdir:
    required: false
    default: logs
  name:
    required: false
    default: ak-logs
runs:
  using: "composite"
  steps:
    - shell: pwsh
      run: |
        $dir='${{ inputs.logdir }}'
        if (-not (Test-Path $dir)) {
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          'init' | Out-File (Join-Path $dir 'placeholder.log') -Encoding utf8
        }
        $out = Join-Path $env:RUNNER_TEMP '${{ inputs.name }}.zip'
        if (Test-Path $out) { Remove-Item $out -Force }
        Compress-Archive -Path "$dir\*" -DestinationPath $out -Force
        Write-Host "artifact:$out"
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/${{ inputs.name }}.zip
        overwrite: true
        if-no-files-found: warn
